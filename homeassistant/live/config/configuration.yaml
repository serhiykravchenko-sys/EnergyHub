default_config:

homeassistant:
  packages: !include_dir_named packages

frontend:
  themes: !include_dir_merge_named themes

automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml

# Keep raw state history compact while preserving long-term statistics for
# energy and chart entities. Diagnostic payloads remain available live/MQTT.
recorder:
  purge_keep_days: 10
  auto_purge: true
  exclude:
    entities:
      - sensor.energyhub_peak_load_guard
      - sensor.energyhub_peak_load_guard_event
      - input_text.energyhub_load_last_command

input_boolean:
  energyhub_climate_solar_window_enabled:
    name: Solar heating/cooling schedule
  energyhub_climate_smart_window_enabled:
    name: Smart heating/cooling schedule
  energyhub_climate_quiet_enabled:
    name: Quiet hours for Smart heating
  energyhub_smart_heating:
    name: Smart Heating
    icon: mdi:heat-pump-outline
  energyhub_solar_only_heating:
    name: Solar-only Heating
    icon: mdi:solar-power-variant
  energyhub_hp1_battery_paused:
    name: First-floor HP Paused by Battery Protection
    icon: mdi:battery-lock
  energyhub_hp1_auto_resume:
    name: First-floor HP Automatic Start Authorized
    icon: mdi:heat-pump-outline
  energyhub_battery_full_today:
    name: Battery Reached Full Today
    icon: mdi:battery-check
  energyhub_load_control_armed:
    name: Overload Protection Automatic
    icon: mdi:shield-bolt

input_number:
  energyhub_intent_heat_pump_floor_1:
    name: Load control intent revision heat_pump_floor_1
    min: 0
    max: 1000000000
    step: 1
    mode: box
input_text:
  energyhub_load_bridge_session:
    name: Load Control Bridge Session
    initial: ''
    max: 100
  energyhub_load_last_command:
    name: Load Control Last Command
    max: 100
input_datetime:
  energyhub_climate_solar_start:
    name: Solar window starts
    has_date: false
    has_time: true
  energyhub_climate_solar_end:
    name: Solar window ends
    has_date: false
    has_time: true
  energyhub_climate_smart_start:
    name: Smart window starts
    has_date: false
    has_time: true
  energyhub_climate_smart_end:
    name: Smart window ends
    has_date: false
    has_time: true
  energyhub_climate_quiet_start:
    name: Quiet hours start
    has_date: false
    has_time: true
  energyhub_climate_quiet_end:
    name: Quiet hours end
    has_date: false
    has_time: true
input_select:
  energyhub_climate_policy:
    name: Heating/cooling energy policy
    options: ['Off', Solar-only, Smart]
  energyhub_climate_operation:
    name: Heating/cooling operation
    options: [Continuous, Scheduled]
  energyhub_climate_effective_policy:
    name: Current heating/cooling request
    options: ['Off', Solar-only, Smart]
  energyhub_hp1_family_mode:
    name: Family selected heat-pump mode
    options: [Unknown, heat, cool]
  energyhub_ahm_weather_authority:
    name: Battery Reserve Control
    icon: mdi:battery-heart-variant
    options:
      - Manual
      - Automatic
  energyhub_smart_heating_status:
    name: Smart Heating Status
    icon: mdi:heat-pump-outline
    options:
      - Manual
      - Waiting
      - Battery paused
      - Solar paused
      - Eco
      - Quiet
      - Normal

timer:
  energyhub_smart_heating_beacon_pulse:
    name: Smart Heating Beacon Pulse
    duration: "00:00:02"

sensor:
  - platform: statistics
    name: EnergyHub Solar Power 15m Average
    unique_id: energyhub_solar_power_15m_average
    state_characteristic: average_step
    sampling_size: 180
    max_age:
      minutes: 15
    entity_id: sensor.powmr_10_2m_total_pv_power
  - platform: integration
    source: sensor.third_floor_heat_pump_plug_electric_power
    name: Third Floor Heat Pump Energy Calculated
    unique_id: energyhub_third_floor_heat_pump_energy_calculated
    unit_prefix: k
    unit_time: h
    method: left
    round: 3
    max_sub_interval:
      minutes: 5
  - platform: integration
    source: sensor.water_boiler_plug_electric_power
    name: Water Boiler Energy Calculated
    unique_id: energyhub_water_boiler_energy_calculated
    unit_prefix: k
    unit_time: h
    method: left
    round: 3
    max_sub_interval:
      minutes: 5
  - platform: integration
    source: sensor.water_pump_plug_electric_power
    name: Basement Water Pump Energy Calculated
    unique_id: energyhub_basement_water_pump_energy_calculated
    unit_prefix: k
    unit_time: h
    method: left
    round: 3
    max_sub_interval:
      minutes: 5
  - platform: integration
    source: sensor.microwave_plug_electric_power
    name: Microwave Energy Calculated
    unique_id: energyhub_microwave_energy_calculated
    unit_prefix: k
    unit_time: h
    method: left
    round: 3
    max_sub_interval:
      minutes: 5
  - platform: integration
    source: sensor.powmr_10_2m_pv1_power
    name: EnergyHub PV1 Energy Total
    unique_id: energyhub_pv1_energy_total
    unit_prefix: k
    unit_time: h
    method: trapezoidal
    round: 3
    max_sub_interval:
      minutes: 5
  - platform: integration
    source: sensor.powmr_10_2m_pv2_power
    name: EnergyHub PV2 Energy Total
    unique_id: energyhub_pv2_energy_total
    unit_prefix: k
    unit_time: h
    method: trapezoidal
    round: 3
    max_sub_interval:
      minutes: 5
  - platform: integration
    source: sensor.powmr_10_2m_total_pv_power
    name: EnergyHub Total Solar Energy
    unique_id: energyhub_total_solar_energy
    unit_prefix: k
    unit_time: h
    method: trapezoidal
    round: 3
    max_sub_interval:
      minutes: 5

utility_meter:
  energyhub_pv1_generation_daily:
    source: sensor.energyhub_pv1_energy_total
    name: PV1 Generated Today
    unique_id: energyhub_pv1_generation_daily
    cycle: daily
    periodically_resetting: false
  energyhub_pv2_generation_daily:
    source: sensor.energyhub_pv2_energy_total
    name: PV2 Generated Today
    unique_id: energyhub_pv2_generation_daily
    cycle: daily
    periodically_resetting: false
  energyhub_total_solar_generation_daily:
    source: sensor.energyhub_total_solar_energy
    name: Total Solar Generated Today
    unique_id: energyhub_total_solar_generation_daily
    cycle: daily
    periodically_resetting: false
  energyhub_pv1_generation_weekly:
    source: sensor.energyhub_pv1_energy_total
    name: PV1 Generated This Week
    unique_id: energyhub_pv1_generation_weekly
    cycle: weekly
    periodically_resetting: false
  energyhub_pv2_generation_weekly:
    source: sensor.energyhub_pv2_energy_total
    name: PV2 Generated This Week
    unique_id: energyhub_pv2_generation_weekly
    cycle: weekly
    periodically_resetting: false
  energyhub_total_solar_generation_weekly:
    source: sensor.energyhub_total_solar_energy
    name: Total Solar Generated This Week
    unique_id: energyhub_total_solar_generation_weekly
    cycle: weekly
    periodically_resetting: false
  energyhub_pv1_generation_monthly:
    source: sensor.energyhub_pv1_energy_total
    name: PV1 Generated This Month
    unique_id: energyhub_pv1_generation_monthly
    cycle: monthly
    periodically_resetting: false
  energyhub_pv2_generation_monthly:
    source: sensor.energyhub_pv2_energy_total
    name: PV2 Generated This Month
    unique_id: energyhub_pv2_generation_monthly
    cycle: monthly
    periodically_resetting: false
  energyhub_total_solar_generation_monthly:
    source: sensor.energyhub_total_solar_energy
    name: Total Solar Generated This Month
    unique_id: energyhub_total_solar_generation_monthly
    cycle: monthly
    periodically_resetting: false
  energyhub_pv1_generation_yearly:
    source: sensor.energyhub_pv1_energy_total
    name: PV1 Generated This Year
    unique_id: energyhub_pv1_generation_yearly
    cycle: yearly
    periodically_resetting: false
  energyhub_pv2_generation_yearly:
    source: sensor.energyhub_pv2_energy_total
    name: PV2 Generated This Year
    unique_id: energyhub_pv2_generation_yearly
    cycle: yearly
    periodically_resetting: false
  energyhub_total_solar_generation_yearly:
    source: sensor.energyhub_total_solar_energy
    name: Total Solar Generated This Year
    unique_id: energyhub_total_solar_generation_yearly
    cycle: yearly
    periodically_resetting: false
  floor_1_heat_pump_weekly:
    source: sensor.first_floor_heat_pump_plug_energy
    name: Floor 1 Heat Pump This Week
    unique_id: energyhub_floor_1_heat_pump_weekly
    cycle: weekly
    periodically_resetting: false
  floor_1_heat_pump_monthly:
    source: sensor.first_floor_heat_pump_plug_energy
    name: Floor 1 Heat Pump This Month
    unique_id: energyhub_floor_1_heat_pump_monthly
    cycle: monthly
    periodically_resetting: false
  floor_1_heat_pump_yearly:
    source: sensor.first_floor_heat_pump_plug_energy
    name: Floor 1 Heat Pump This Year
    unique_id: energyhub_floor_1_heat_pump_yearly
    cycle: yearly
    periodically_resetting: false
  floor_2_heat_pump_weekly:
    source: sensor.second_floor_heat_pump_plug_energy
    name: Floor 2 Heat Pump This Week
    unique_id: energyhub_floor_2_heat_pump_weekly
    cycle: weekly
    periodically_resetting: false
  floor_2_heat_pump_monthly:
    source: sensor.second_floor_heat_pump_plug_energy
    name: Floor 2 Heat Pump This Month
    unique_id: energyhub_floor_2_heat_pump_monthly
    cycle: monthly
    periodically_resetting: false
  floor_2_heat_pump_yearly:
    source: sensor.second_floor_heat_pump_plug_energy
    name: Floor 2 Heat Pump This Year
    unique_id: energyhub_floor_2_heat_pump_yearly
    cycle: yearly
    periodically_resetting: false
  floor_3_heat_pump_weekly:
    source: sensor.third_floor_heat_pump_energy_calculated
    name: Floor 3 Heat Pump This Week
    unique_id: energyhub_floor_3_heat_pump_weekly
    cycle: weekly
    periodically_resetting: false
  floor_3_heat_pump_monthly:
    source: sensor.third_floor_heat_pump_energy_calculated
    name: Floor 3 Heat Pump This Month
    unique_id: energyhub_floor_3_heat_pump_monthly
    cycle: monthly
    periodically_resetting: false
  floor_3_heat_pump_yearly:
    source: sensor.third_floor_heat_pump_energy_calculated
    name: Floor 3 Heat Pump This Year
    unique_id: energyhub_floor_3_heat_pump_yearly
    cycle: yearly
    periodically_resetting: false
  basement_water_pump_weekly:
    source: sensor.basement_water_pump_energy_calculated
    name: Water Pump This Week
    unique_id: energyhub_basement_water_pump_weekly
    cycle: weekly
    periodically_resetting: false
  basement_water_pump_monthly:
    source: sensor.basement_water_pump_energy_calculated
    name: Water Pump This Month
    unique_id: energyhub_basement_water_pump_monthly
    cycle: monthly
    periodically_resetting: false
  basement_water_pump_yearly:
    source: sensor.basement_water_pump_energy_calculated
    name: Water Pump This Year
    unique_id: energyhub_basement_water_pump_yearly
    cycle: yearly
    periodically_resetting: false
  microwave_weekly:
    source: sensor.microwave_energy_calculated
    name: Microwave This Week
    unique_id: energyhub_microwave_weekly
    cycle: weekly
    periodically_resetting: false
  microwave_monthly:
    source: sensor.microwave_energy_calculated
    name: Microwave This Month
    unique_id: energyhub_microwave_monthly
    cycle: monthly
    periodically_resetting: false
  microwave_yearly:
    source: sensor.microwave_energy_calculated
    name: Microwave This Year
    unique_id: energyhub_microwave_yearly
    cycle: yearly
    periodically_resetting: false
  water_boiler_weekly:
    source: sensor.water_boiler_energy_calculated
    name: Water Boiler This Week
    unique_id: energyhub_water_boiler_weekly
    cycle: weekly
    periodically_resetting: false
  water_boiler_monthly:
    source: sensor.water_boiler_energy_calculated
    name: Water Boiler This Month
    unique_id: energyhub_water_boiler_monthly
    cycle: monthly
    periodically_resetting: false
  water_boiler_yearly:
    source: sensor.water_boiler_energy_calculated
    name: Water Boiler This Year
    unique_id: energyhub_water_boiler_yearly
    cycle: yearly
    periodically_resetting: false
