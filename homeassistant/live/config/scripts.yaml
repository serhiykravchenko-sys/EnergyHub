energyhub_start_panic:
  alias: EnergyHub - Build Emergency Reserve
  description: Starts manual Reserve Protection charging when Autopilot is enabled.
  mode: single
  sequence:
  - choose:
    - conditions:
      - condition: state
        entity_id: input_boolean.energyhub_autopilot
        state: 'on'
      sequence:
      - action: mqtt.publish
        data:
          topic: energyhub/input/ha/inverter_mode
          payload: panic
          retain: false
    default:
    - action: persistent_notification.create
      data:
        title: 'EnergyHub: Reserve Protection not started'
        notification_id: energyhub_manual_panic_blocked
        message: >-
          Manual Reserve Protection was not started because Autopilot is disabled.

          Enable EnergyHub Autopilot and press Build Emergency Reserve again.
