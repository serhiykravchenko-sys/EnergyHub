- id: '1783953087633'
  alias: EnergyHub - Mode Notifications
  description: Shows notifications after automatic Battery Reserve transitions succeed or fail.
  triggers:
  - trigger: mqtt
    topic: energyhub/event/notification
  conditions: []
  actions:
  - variables:
      event: '{{ trigger.payload_json }}'
      event_type: '{{ event.type | default(''unknown'') }}'
      mode: '{{ event.mode | default(''unknown'') }}'
      requested_mode: '{{ event.requested_mode | default(''unknown'') }}'
      soc: '{{ event.soc | default(''unknown'') }}'
      target_soc: '{{ event.target_soc | default(''unknown'') }}'
      reason: '{{ event.reason | default(''No reason provided'') }}'
      error: '{{ event.error | default(''No transition error provided'') }}'
      current_mode: '{{ event.current_mode | default(''unknown'') }}'
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ event_type == ''automatic_mode_activation'' and mode ==
          ''panic'' }}'
      sequence:
      - action: persistent_notification.create
        data:
          title: >-
            {% if event.grid_confidence | default('unknown') | lower == 'normal' %}
              {% if requested_mode == 'solar' %}
                ☀️ EnergyHub: Solar + battery restored
              {% else %}
                🔌 EnergyHub: House on grid
              {% endif %}
            {% else %}
              🚨 EnergyHub: Battery Reserve protection activated
            {% endif %}
          notification_id: energyhub_panic
          message: >-
            {% if event.grid_confidence | default('unknown') | lower == 'normal' %}
              {% if requested_mode == 'solar' %}
                Battery reached {{ soc }}%. The house is now supplied by solar and battery.
              {% else %}
                Battery reached its {{ target_soc }}% reserve. The house switched to grid;
                solar and battery resume at {{ (target_soc | float(0) + 10) | round(0) }}%.
              {% endif %}
            {% else %}
              Grid confidence: {{ event.grid_confidence | default('unknown') }}.
              Battery: {{ soc }}%; applied reserve: {{ target_soc }}%.
              {{ reason }}
            {% endif %}
    - conditions:
      - condition: template
        value_template: '{{ event_type == ''automatic_mode_activation_failed'' and
          mode == ''panic'' }}'
      sequence:
      - action: persistent_notification.create
        data:
          title: >-
            {% if event.grid_confidence | default('unknown') | lower == 'normal' %}
              ⚠️ EnergyHub: Battery reserve transition failed
            {% else %}
              ⚠️ EnergyHub: Battery Reserve protection failed
            {% endif %}
          notification_id: energyhub_panic
          message: 'EnergyHub requested {{ requested_mode }}, but the inverter transition
            was not confirmed.

            Current mode: {{ current_mode }}

            Error: {{ error }}

            Decision reason: {{ reason }}'
  mode: queued
  max: 10
- id: energyhub_load_bridge_start
  alias: EnergyHub - Initialize Load Control Bridge
  triggers:
  - trigger: homeassistant
    event: start
  actions:
  - action: input_text.set_value
    target:
      entity_id: input_text.energyhub_load_bridge_session
    data:
      value: "{{ now().isoformat() }}"
  mode: single

- id: energyhub_load_control_snapshot
  alias: EnergyHub - Load Control Snapshot
  triggers:
  - trigger: time_pattern
    seconds: /10
  conditions:
  - condition: template
    value_template: >-
      {% set cycle = state_attr('sensor.energyhub_peak_load_guard', 'cycle') or {} %}
      {% set pending = state_attr('sensor.energyhub_peak_load_guard', 'pending') %}
      {{ now().second % 30 == 0
         or pending is mapping
         or cycle.get('shedding', false)
         or cycle.get('owned', {}) | count > 0 }}
  actions:
  - variables:
      hp_settings: "{{ {'temperature': state_attr('climate.first_floor_heat_pump', 'temperature'), 'fan_mode': state_attr('climate.first_floor_heat_pump', 'fan_mode'), 'swing_mode': state_attr('climate.first_floor_heat_pump', 'swing_mode'), 'eco': states('switch.first_floor_heat_pump_eco'), 'quiet': states('switch.first_floor_heat_pump_quiet'), 'super': states('switch.first_floor_heat_pump_super'), 'sleep': states('select.first_floor_heat_pump_sleep'), 'eight_degree': states('switch.first_floor_heat_pump_8_degree_heat')} }}"
      hp_normal: >-
        {{ hp_settings.eco == 'off' and hp_settings.quiet == 'off'
           and hp_settings.super == 'off' and hp_settings.sleep | lower == 'off'
           and hp_settings.eight_degree == 'off'
           and hp_settings.temperature | float(-1) >= 16
           and hp_settings.temperature | float(99) <= 30
           and hp_settings.fan_mode in ['auto', 'lower', 'low', 'medium', 'high', 'higher'] }}
      bridge_ready: >-
        {{ is_state('automation.energyhub_load_control_executor', 'on')
           and is_state('automation.energyhub_load_control_external_intents', 'on')
           and states('input_text.energyhub_load_bridge_session') not in ['', 'unknown', 'unavailable'] }}
  - action: mqtt.publish
    data:
      topic: energyhub/input/ha/peak_load_control_plugs
      retain: true
      payload: >-
        {{ {
          'control_schema': 5,
          'battery_control_ready': bridge_ready
              and states('input_boolean.energyhub_water_boiler_soc_lockout') in ['on', 'off']
              and states('input_boolean.energyhub_heat_pump_soc_lockout') in ['on', 'off'],
          'legacy_battery_lockout': (is_state('input_boolean.energyhub_water_boiler_soc_lockout', 'on')
