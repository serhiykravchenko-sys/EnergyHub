  - trigger: numeric_state
    entity_id: sensor.energyhub_grid_available_48h
    above: 47.99
    id: availability_48h_recovered
  - trigger: numeric_state
    entity_id: sensor.powmr_10_2m_grid_voltage
    above: 50
    id: current_grid_recovered
  - trigger: state
    entity_id: sensor.energyhub_telemetry_freshness
    to: fresh
    id: telemetry_recovered
  - trigger: homeassistant
    event: start
    id: startup
  actions:
