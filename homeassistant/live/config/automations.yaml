                'state': ('on' if states('climate.first_floor_heat_pump') == 'heat' else 'off' if states('climate.first_floor_heat_pump') == 'off' else 'unavailable'),
                'state_observed_at': states['climate.first_floor_heat_pump'].last_reported.isoformat() if states('climate.first_floor_heat_pump') in ['heat', 'off'] else none,
                'context_id': states['climate.first_floor_heat_pump'].context.id if states('climate.first_floor_heat_pump') in ['heat', 'off'] else none,
                'intent_revision': states('input_number.energyhub_intent_heat_pump_floor_1') | int(-1),
                'power_w': states('sensor.first_floor_heat_pump_plug_power') | float(none),
                'power_observed_at': states['sensor.first_floor_heat_pump_plug_power'].last_reported.isoformat() if states('sensor.first_floor_heat_pump_plug_power') not in ['unknown', 'unavailable'] else none,
                'control_ready': bridge_ready
                    and is_state('switch.first_floor_heat_pump_plug', 'on'),
                'restore_allowed': true,
                'settings': {'temperature': state_attr('climate.first_floor_heat_pump', 'temperature'), 'fan_mode': state_attr('climate.first_floor_heat_pump', 'fan_mode'), 'swing_mode': state_attr('climate.first_floor_heat_pump', 'swing_mode'), 'eco': states('switch.first_floor_heat_pump_eco'), 'quiet': states('switch.first_floor_heat_pump_quiet'), 'super': states('switch.first_floor_heat_pump_super'), 'sleep': states('select.first_floor_heat_pump_sleep'), 'eight_degree': states('switch.first_floor_heat_pump_8_degree_heat')}
              },
              {
                'key': 'heat_pump_floor_2',
                'availability': ('online' if states('switch.second_floor_heat_pump_plug') in ['on', 'off'] else states('switch.second_floor_heat_pump_plug')),
                'state': states('switch.second_floor_heat_pump_plug'),
                'state_observed_at': states['switch.second_floor_heat_pump_plug'].last_reported.isoformat() if states('switch.second_floor_heat_pump_plug') in ['on', 'off'] else none,
                'context_id': states['switch.second_floor_heat_pump_plug'].context.id if states('switch.second_floor_heat_pump_plug') in ['on', 'off'] else none,
                'intent_revision': states('input_number.energyhub_intent_heat_pump_floor_2') | int(-1),
                'power_w': states('sensor.second_floor_heat_pump_plug_power') | float(none),
                'power_observed_at': states['sensor.second_floor_heat_pump_plug_power'].last_reported.isoformat() if states('sensor.second_floor_heat_pump_plug_power') not in ['unknown', 'unavailable'] else none,
                'control_ready': bridge_ready
                    and states('switch.second_floor_heat_pump_plug') in ['on', 'off'],
                'restore_allowed': true,
                'settings': {}
              },
              {
                'key': 'heat_pump_floor_3',
                'availability': 'not_applicable',
                'state': states('switch.third_floor_heat_pump_plug_switch'),
                'state_observed_at': states['switch.third_floor_heat_pump_plug_switch'].last_reported.isoformat() if states('switch.third_floor_heat_pump_plug_switch') in ['on', 'off'] else none,
                'context_id': states['switch.third_floor_heat_pump_plug_switch'].context.id if states('switch.third_floor_heat_pump_plug_switch') in ['on', 'off'] else none,
                'intent_revision': states('input_number.energyhub_intent_heat_pump_floor_3') | int(-1),
                'power_w': states('sensor.third_floor_heat_pump_plug_electric_power') | float(none),
                'power_observed_at': states['sensor.third_floor_heat_pump_plug_electric_power'].last_reported.isoformat() if states('sensor.third_floor_heat_pump_plug_electric_power') not in ['unknown', 'unavailable'] else none,
                'control_ready': bridge_ready,
                'restore_allowed': true,
                'settings': {}
              },
              {
                'key': 'microwave',
                'availability': 'not_applicable',
                'state': states('switch.microwave_plug_switch'),
                'state_observed_at': states['switch.microwave_plug_switch'].last_reported.isoformat() if states('switch.microwave_plug_switch') in ['on', 'off'] else none,
                'context_id': states['switch.microwave_plug_switch'].context.id if states('switch.microwave_plug_switch') in ['on', 'off'] else none,
                'intent_revision': states('input_number.energyhub_intent_microwave') | int(-1),
                'power_w': states('sensor.microwave_plug_electric_power') | float(none),
                'power_observed_at': states['sensor.microwave_plug_electric_power'].last_reported.isoformat() if states('sensor.microwave_plug_electric_power') not in ['unknown', 'unavailable'] else none,
                'control_ready': bridge_ready,
                'restore_allowed': true,
                'settings': {}
              }
          ]
        } | tojson }}
  mode: single

- id: energyhub_load_control_external_intents
  alias: EnergyHub - Load Control External Intents
  description: Records control requests including OFF on an already OFF load; no load switching.
  triggers:
  - trigger: event
    event_type: call_service
  conditions:
  - condition: template
    value_template: "{{ trigger.event.data.domain in ['switch', 'climate', 'homeassistant', 'select', 'number'] }}"
  actions:
  - variables:
      targets: >-
        {{ trigger.event.data.get('target', {}).get('entity_id', [])
           or trigger.event.data.service_data.get('entity_id', []) }}
      target_list: "{{ [targets] if targets is string else targets }}"
      mapping: {"water_pump":"switch.water_pump_plug_switch","water_boiler":"switch.water_boiler_plug_switch","heat_pump_floor_1":"climate.first_floor_heat_pump","heat_pump_floor_2":"switch.second_floor_heat_pump_plug","heat_pump_floor_3":"switch.third_floor_heat_pump_plug_switch","microwave":"switch.microwave_plug_switch"}
      keys: >-
        {% set ns = namespace(keys=[]) %}
        {% for key, entity in mapping.items() %}
          {% if 'all' in target_list or entity in target_list
             or (key == 'heat_pump_floor_1' and
               (target_list | select('search', 'first_floor_heat_pump|first_floor_heat_pump_plug') | list | length > 0)) %}
            {% set ns.keys = ns.keys + [key] %}
          {% endif %}
        {% endfor %}
        {{ ns.keys }}
  - repeat:
      for_each: "{{ keys }}"
      sequence:
      - action: input_number.increment
        target:
          entity_id: "{{ 'input_number.energyhub_intent_' ~ repeat.item }}"
  - action: mqtt.publish
    data:
      topic: energyhub/input/ha/peak_load_guard_intent
      retain: false
      payload: >-
        {{ {'context_id': trigger.event.context.id, 'keys': keys,
            'observed_at': now().isoformat()} | tojson }}
  mode: queued
  max: 100

- id: energyhub_load_control_executor
  alias: EnergyHub - Load Control Executor
  description: Allow-listed expiring EH commands only; independent arming and state checks.
  triggers:
  - trigger: mqtt
    topic: energyhub/control/peak_load_guard
  actions:
  - variables:
      cmd: "{{ trigger.payload_json }}"
      mapping: {"water_pump":"switch.water_pump_plug_switch","water_boiler":"switch.water_boiler_plug_switch","heat_pump_floor_1":"climate.first_floor_heat_pump","heat_pump_floor_2":"switch.second_floor_heat_pump_plug","heat_pump_floor_3":"switch.third_floor_heat_pump_plug_switch","microwave":"switch.microwave_plug_switch"}
      entity: "{{ mapping.get(cmd.get('key'), '') }}"
      hp_settings: "{{ {'temperature': state_attr('climate.first_floor_heat_pump', 'temperature'), 'fan_mode': state_attr('climate.first_floor_heat_pump', 'fan_mode'), 'swing_mode': state_attr('climate.first_floor_heat_pump', 'swing_mode'), 'eco': states('switch.first_floor_heat_pump_eco'), 'quiet': states('switch.first_floor_heat_pump_quiet'), 'super': states('switch.first_floor_heat_pump_super'), 'sleep': states('select.first_floor_heat_pump_sleep'), 'eight_degree': states('switch.first_floor_heat_pump_8_degree_heat')} }}"
      load_pct: "{{ states('sensor.powmr_10_2m_load') | float(-1) }}"
      load_w: "{{ states('sensor.powmr_10_2m_output_power') | float(-1) }}"
      inverter_warning_fresh: >-
        {{ states('sensor.energyhub_inverter_health_reason') not in ['unknown', 'unavailable', 'warning_read_failed']
           and 'over_load' in (states('sensor.energyhub_inverter_health_reason').split(','))
           and 0 <= now().timestamp() - as_timestamp(states['sensor.energyhub_inverter_health_reason'].last_reported, 0) <= 90 }}
      battery_soc: "{{ states('sensor.powmr_10_2m_battery_soc') | float(-1) }}"
      grid_voltage: "{{ states('sensor.powmr_10_2m_grid_voltage') | float(-1) }}"
      battery_evidence_fresh: >-
        {{ is_state('sensor.energyhub_telemetry_freshness', 'fresh')
           and 0 <= battery_soc <= 100 and grid_voltage >= 0
           and 0 <= now().timestamp() - as_timestamp(states['sensor.powmr_10_2m_battery_soc'].last_reported, 0) <= 30
           and 0 <= now().timestamp() - as_timestamp(states['sensor.powmr_10_2m_grid_voltage'].last_reported, 0) <= 30 }}
      battery_recovered: >-
        {{ battery_evidence_fresh and
           (battery_soc >= 60
            or grid_voltage > 180
            or (cmd.key == 'heat_pump_floor_1'
                and cmd.get('restore_profile') == 'eco'
                and is_state('input_boolean.energyhub_smart_heating', 'on')
                and grid_voltage <= 180 and battery_soc >= 50)) }}
  - condition: template
    value_template: >-
      {{ cmd is mapping and cmd.get('control_schema') == 5 and cmd.get('action') in ['shed', 'restore']
         and entity != '' and cmd.get('reason') in ['overload', 'battery']
         and (cmd.reason == 'battery' or is_state('input_boolean.energyhub_load_control_armed', 'on'))
         and (cmd.reason != 'battery' or cmd.key != 'microwave')
         and cmd.get('command_id', '') != '' and cmd.command_id != states('input_text.energyhub_load_last_command')
         and cmd.get('bridge_session') == states('input_text.energyhub_load_bridge_session')
         and now().timestamp() <= cmd.get('expires_at', 0) | float(0)
         and 0 <= now().timestamp() - as_timestamp(cmd.get('issued_at'), 0) <= 20
         and is_state('sensor.energyhub_telemetry_freshness', 'fresh')
         and 0 <= now().timestamp() - as_timestamp(states['sensor.powmr_10_2m_load'].last_reported, 0) <= 30
         and 0 <= now().timestamp() - as_timestamp(states['sensor.powmr_10_2m_output_power'].last_reported, 0) <= 30
         and states[entity].context.id == cmd.get('expected_context')
         and states('input_number.energyhub_intent_' ~ cmd.key) | int(-1) == cmd.get('expected_revision')
         and (('off' if states(entity) == 'off' else 'on' if states(entity) in ['on', 'heat'] else 'unknown') == cmd.get('expected_state'))
         and (cmd.key != 'heat_pump_floor_1' or (hp_settings == cmd.expected_settings
              and is_state('switch.first_floor_heat_pump_plug', 'on'))) }}
  - condition: template
    value_template: >-
      {{ (cmd.action == 'shed' and
             ((cmd.reason == 'overload' and (load_pct > 75 or inverter_warning_fresh))
              or (cmd.reason == 'battery' and battery_evidence_fresh
                  and grid_voltage <= 180 and
                    (battery_soc <= 40 or
                     (cmd.get('battery_locked') == true and battery_soc < 60)))))
         or (cmd.action == 'restore' and load_pct >= 0 and load_pct < 50 and load_w >= 0
             and (cmd.key == 'microwave' or battery_recovered)) }}
  - action: input_text.set_value
    target:
      entity_id: input_text.energyhub_load_last_command
    data:
      value: "{{ cmd.command_id }}"
  - choose:
    - conditions: "{{ cmd.key == 'heat_pump_floor_1' }}"
      sequence:
      - action: climate.set_hvac_mode
        target:
          entity_id: climate.first_floor_heat_pump
        data:
          hvac_mode: "{{ 'off' if cmd.action == 'shed' else 'heat' }}"
      - if:
        - condition: template
          value_template: "{{ cmd.action == 'restore' and cmd.get('restore_profile') == 'eco' }}"
        then:
        - action: switch.turn_off
          target:
            entity_id: switch.first_floor_heat_pump_super
        - action: "{{ 'switch.turn_on' if now().hour >= 23 or now().hour < 8 else 'switch.turn_off' }}"
          target:
            entity_id: switch.first_floor_heat_pump_quiet
        - action: switch.turn_on
          target:
            entity_id: switch.first_floor_heat_pump_eco
    default:
    - action: "{{ 'switch.turn_off' if cmd.action == 'shed' else 'switch.turn_on' }}"
      target:
        entity_id: "{{ entity }}"
  - wait_template: >-
      {{ states(entity) == ('off' if cmd.action == 'shed' else 'heat' if cmd.key == 'heat_pump_floor_1' else 'on')
         and (cmd.get('restore_profile') != 'eco'
              or is_state('switch.first_floor_heat_pump_eco', 'on')) }}
    timeout:
      seconds: 8
    continue_on_timeout: true
  - action: mqtt.publish
    data:
      topic: energyhub/input/ha/peak_load_guard_ack
      retain: false
      payload: >-
        {{ {'command_id': cmd.command_id, 'bridge_session': cmd.bridge_session,
            'result': 'accepted' if wait.completed else 'unconfirmed',
            'context_id': states[entity].context.id, 'observed_at': now().isoformat()} | tojson }}
  mode: single
- id: '1786023000017'
  alias: EnergyHub 2.4 - Publish Battery Reserve Forecast Inputs
  description: >-
    Publishes a preliminary next-day forecast plan at 23:52 after the completed
    Daily Summary, replaces it with the updated current-day forecast at 05:00,
    and republishes authority/current reserve changes without replacing the
    dated forecast. EnergyHub combines it with up to three valid completed
    consumption days, live Grid Confidence and official UHMC warnings.
  triggers:
  - trigger: time
    at: '23:52:00'
    id: preliminary_next_day
  - trigger: time
    at: '05:00:00'
    id: morning_revision
  - trigger: homeassistant
    event: start
    id: startup
  - trigger: state
    entity_id:
    - input_select.energyhub_ahm_weather_authority
    - input_number.ahm_minimum_soc
    - input_boolean.energyhub_smart_heating
    - sensor.solcast_pv_forecast_forecast_today
    id: setting_changed
  actions:
  - if:
    - condition: trigger
      id: startup
    then:
    - delay:
        seconds: 15
  - variables:
      preliminary: '{{ trigger.id | default(''refresh'') == ''preliminary_next_day'' }}'
      retained_preliminary: >-
        {{ not preliminary
           and state_attr('sensor.energyhub_ahm_weather_buffer', 'forecast_plan_stage') == 'preliminary'
           and state_attr('sensor.energyhub_ahm_weather_buffer', 'date') ==
             (now().date() + timedelta(days=1)).isoformat()
           and now() >= today_at('23:50') }}
      plan_stage: >-
        {{ 'preliminary' if preliminary else
           'morning' if trigger.id | default('refresh') == 'morning_revision'
           else 'refresh' }}
      plan_date: >-
        {{ (now().date() + timedelta(days=1)).isoformat()
           if preliminary or retained_preliminary else now().date().isoformat() }}
      forecast_entity: >-
        {{ 'sensor.solcast_pv_forecast_forecast_tomorrow'
           if preliminary or retained_preliminary
           else 'sensor.solcast_pv_forecast_forecast_today' }}
  - action: mqtt.publish
    data:
      topic: energyhub/input/ha/weather_buffer_forecast
      retain: true
      payload: >-
        {{ {
          'date': plan_date,
          'observed_at': now().isoformat(),
          'mode': states('input_select.energyhub_ahm_weather_authority'),
          'smart_heating_enabled': is_state('input_boolean.energyhub_smart_heating', 'on'),
          'applied_minimum_soc': states('input_number.ahm_minimum_soc') | float(none),
          'evaluation_reason': trigger.id | default('manual'),
          'forecast_plan_stage': plan_stage,
          'source_entity': forecast_entity,
          'solar_forecast_kwh': states(forecast_entity) | float(none)
        } | tojson }}
  mode: restart
