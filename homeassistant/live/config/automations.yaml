        and states('sensor.powmr_10_2m_grid_voltage') | float(0) > 50
      %}
      {% set recovery_soc = 60 if trusted_grid else 90 %}
      {{ states('sensor.powmr_10_2m_battery_soc') | float(-1) >= recovery_soc }}
  - action: input_boolean.turn_off
    target:
      entity_id: input_boolean.energyhub_heat_pump_soc_lockout
  - action: persistent_notification.dismiss
    data:
      notification_id: energyhub_heat_pump_soc_lockout
  - action: persistent_notification.dismiss
    data:
      notification_id: energyhub_heat_pump_reserve_shed
  - action: persistent_notification.dismiss
    data:
      notification_id: energyhub_heat_pump_floor_2_shed
  - action: persistent_notification.dismiss
    data:
      notification_id: energyhub_heat_pump_floor_1_shed
  mode: restart
- id: '1786023000016'
  alias: EnergyHub - Hybrid Heat Pump Manual Permission
  description: While confirmed Hybrid or Panic is carrying the house from a present grid
    with fresh telemetry, allows manual heat-pump plug requests without clearing
    the remembered SOC lockout and without turning any heat pump on.
  triggers:
  - trigger: state
    entity_id: sensor.energyhub_operating_mode
    id: operating_mode_changed
  - trigger: numeric_state
    entity_id: sensor.powmr_10_2m_grid_voltage
    above: 50
    id: current_grid_recovered
  - trigger: state
    entity_id: sensor.energyhub_telemetry_freshness
    to: fresh
    id: telemetry_recovered
  conditions:
  - condition: state
    entity_id: sensor.energyhub_telemetry_freshness
    state: fresh
  - condition: template
    value_template: >-
      {{ states('sensor.energyhub_operating_mode') | lower in
           ['hybrid_charging', 'hybrid_grid_hold', 'panic', 'panic_grid_hold']
         and states('sensor.powmr_10_2m_grid_voltage') | float(0) > 50 }}
  actions:
  - action: persistent_notification.dismiss
    data:
      notification_id: energyhub_heat_pump_soc_lockout
  - action: persistent_notification.dismiss
    data:
      notification_id: energyhub_heat_pump_reserve_shed
  - action: persistent_notification.dismiss
    data:
      notification_id: energyhub_heat_pump_floor_2_shed
  - action: persistent_notification.dismiss
    data:
      notification_id: energyhub_heat_pump_floor_1_shed
  mode: restart
