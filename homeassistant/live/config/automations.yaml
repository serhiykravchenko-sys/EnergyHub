      {% set hybrid_grid_permission =
        states('sensor.energyhub_operating_mode') | lower in
          ['hybrid_charging', 'hybrid_grid_hold', 'panic', 'panic_grid_hold']
        and states('sensor.powmr_10_2m_grid_voltage') | float(0) > 50
      %}
      {{ not hybrid_grid_permission }}
  actions:
  - if:
    - condition: state
      entity_id: switch.first_floor_heat_pump_plug
      state: 'on'
    then:
    - action: switch.turn_off
      continue_on_error: true
      target:
        entity_id: switch.first_floor_heat_pump_plug
  - if:
    - condition: state
      entity_id: switch.second_floor_heat_pump_plug
      state: 'on'
    then:
    - action: switch.turn_off
      continue_on_error: true
      target:
        entity_id: switch.second_floor_heat_pump_plug
  - if:
    - condition: state
      entity_id: switch.chuangmi_212a01_ea40_switch
      state: 'on'
    then:
    - action: switch.turn_off
      continue_on_error: true
      target:
        entity_id: switch.chuangmi_212a01_ea40_switch
  - delay:
      seconds: 3
  - action: persistent_notification.create
    data:
      title: >-
        {% if trigger.id in ['floor_1', 'floor_2', 'floor_3'] %}
          EnergyHub - Heat-pump ON rejected
        {% else %}
          EnergyHub - Heat-pump protection restored
        {% endif %}
      notification_id: energyhub_heat_pump_soc_lockout
      message: >-
        {% set trusted_grid =
          states('sensor.energyhub_grid_confidence') | lower == 'normal'
          and states('sensor.energyhub_grid_availability_24h') | float(-1) >= 100
          and states('sensor.energyhub_grid_available_48h') | float(-1) >= 48
          and states('sensor.powmr_10_2m_grid_voltage') | float(0) > 50
