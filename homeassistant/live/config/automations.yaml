- id: '1783705009942'
  alias: EnergyHub - Hybrid Schedule
  description: Evaluates Hybrid at 23:50 and restores Solar at 07:00.
  triggers:
  - trigger: time
    at: '23:50:00'
    id: evaluate_hybrid
  - trigger: time
    at: 07:00:00
    id: restore_solar
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id:
        - evaluate_hybrid
      sequence:
      - action: mqtt.publish
        data:
          topic: energyhub/input/ha/inverter_mode
          payload: evaluate_hybrid
          retain: false
    - conditions:
      - condition: trigger
        id:
        - restore_solar
      - condition: state
        entity_id: input_boolean.energyhub_autopilot
        state: 'on'
      sequence:
      - action: mqtt.publish
        data:
          topic: energyhub/input/ha/inverter_mode
          payload: solar
          retain: false
    default:
    - action: mqtt.publish
      data:
        topic: energyhub/input/ha/inverter_mode
        payload: evaluate_hybrid
        retain: false
  mode: single
- id: '1783953087633'
  alias: EnergyHub - Mode Notifications
  description: Shows notifications after automatic Hybrid or Panic transitions succeed
    or fail.
  triggers:
  - trigger: mqtt
    topic: energyhub/event/notification
  conditions: []
  actions:
  - variables:
      event: '{{ trigger.payload_json }}'
      event_type: '{{ event.type | default(''unknown'') }}'
      mode: '{{ event.mode | default(''unknown'') }}'
      requested_mode: '{{ event.requested_mode | default(''unknown'') }}'
      soc: '{{ event.soc | default(''unknown'') }}'
      target_soc: '{{ event.target_soc | default(''unknown'') }}'
      reason: '{{ event.reason | default(''No reason provided'') }}'
      error: '{{ event.error | default(''No transition error provided'') }}'
      current_mode: '{{ event.current_mode | default(''unknown'') }}'
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ event_type == ''automatic_mode_activation'' and mode ==
          ''hybrid'' and requested_mode != ''solar'' }}'
      sequence:
      - action: persistent_notification.create
        data:
          title: "\U0001F319 EnergyHub: Hybrid activated"
          notification_id: energyhub_hybrid
          message: 'Battery SOC: {{ soc }}%

            Tomorrow forecast: {{ event.forecast | round(2) }} kWh

            Projected SOC at 07:00: {{ event.projected_soc_at_07 }}%

            Useful solar starts: {{ event.useful_solar_start }}

            Morning gap: {{ event.morning_hours }} hour(s)

            Expected consumption after 07:00:
            {{ event.expected_consumption_after_07 | default(''unknown'') }} kWh

            Solar forecast after 07:00:
            {{ event.solar_forecast_after_07 | default(''unknown'') }} kWh

            Daytime deficit: {{ event.daytime_deficit_kwh | default(''unknown'') }}
            kWh / {{ event.daytime_deficit_soc | default(''unknown'') }}% SOC

            Target SOC: {{ target_soc }}%

            EnergyHub will keep the house on the night grid until 07:00.

            Reason: {{ reason }}'
    - conditions:
      - condition: template
        value_template: '{{ event_type == ''automatic_mode_activation'' and mode ==
          ''hybrid'' and requested_mode == ''solar'' }}'
      sequence:
      - action: persistent_notification.create
        data:
          title: "☀️ EnergyHub: AHM restored Solar"
          notification_id: energyhub_hybrid
          message: >-
            AHM took ownership from daytime Panic at 23:50 and restored Solar.
            Battery SOC: {{ soc }}%. Target SOC: {{ target_soc }}%.
            Reason: {{ reason }}
    - conditions:
      - condition: template
        value_template: '{{ event_type == ''automatic_mode_activation'' and mode ==
          ''panic'' }}'
      sequence:
      - action: persistent_notification.create
        data:
          title: "\U0001F6A8 EnergyHub: Panic activated"
          notification_id: energyhub_panic
          message: 'Battery SOC: {{ soc }}%

            Grid confidence: {{ event.grid_confidence | default(''unknown'') }}

            Target SOC: {{ target_soc }}%

            Panic phase: {{ event.phase | default(''unknown'') }}

            Target source: {{ event.target_source | default(''unknown'') }}

            Reason: {{ reason }}'
    - conditions:
      - condition: template
        value_template: '{{ event_type == ''automatic_mode_activation_failed'' and
          mode == ''hybrid'' }}'
      sequence:
      - action: persistent_notification.create
        data:
          title: '⚠️ EnergyHub: Hybrid activation failed'
          notification_id: energyhub_hybrid
          message: 'EnergyHub decided to activate Hybrid, but the inverter transition
            was not confirmed.

            Current mode: {{ current_mode }}

            Error: {{ error }}

            Decision reason: {{ reason }}'
    - conditions:
      - condition: template
        value_template: '{{ event_type == ''automatic_mode_activation_failed'' and
          mode == ''panic'' }}'
      sequence:
      - action: persistent_notification.create
        data:
          title: '⚠️ EnergyHub: Panic activation failed'
          notification_id: energyhub_panic
          message: 'EnergyHub decided to activate Panic, but the inverter transition
            was not confirmed.

            Current mode: {{ current_mode }}

            Error: {{ error }}

            Decision reason: {{ reason }}'
  mode: queued
  max: 10
- id: '1786023000001'
  alias: EnergyHub - Water Boiler Reserve Shed
  description: Turns the water boiler off once when fresh battery SOC reaches 50%.
    A later ON request remains allowed until the emergency lockout activates.
  triggers:
  - trigger: numeric_state
    entity_id: sensor.powmr_10_2m_battery_soc
    below: 51
  conditions:
  - condition: state
    entity_id: sensor.energyhub_telemetry_freshness
    state: fresh
  - condition: state
    entity_id: switch.chuangmi_212a01_c91f_switch
    state: 'on'
  actions:
  - action: switch.turn_off
    continue_on_error: true
    target:
      entity_id: switch.chuangmi_212a01_c91f_switch
  - delay:
      seconds: 3
  - action: persistent_notification.create
    data:
      title: EnergyHub - Water boiler reserve shed
      notification_id: energyhub_water_boiler_reserve_shed
      message: >-
        Battery SOC reached {{ states('sensor.powmr_10_2m_battery_soc') }}%.
        EnergyHub requested boiler OFF. Current plug state:
        {{ states('switch.chuangmi_212a01_c91f_switch') }}. An ON request is allowed
        above 40%; at 40% a lockout remains active until SOC reaches 60%.
  mode: single
- id: '1786023000002'
  alias: EnergyHub - Water Boiler Critical SOC Lockout
  description: Latches the boiler lockout at 40% SOC and requests OFF only while
    EnergyHub telemetry is fresh.
  triggers:
  - trigger: numeric_state
    entity_id: sensor.powmr_10_2m_battery_soc
    below: 41
    id: critical_soc
  - trigger: state
    entity_id: sensor.energyhub_telemetry_freshness
    to: fresh
    id: telemetry_recovered
  - trigger: homeassistant
    event: start
    id: startup
  actions:
  - if:
    - condition: trigger
      id: startup
    then:
    - delay:
        seconds: 10
  - condition: state
    entity_id: sensor.energyhub_telemetry_freshness
    state: fresh
  - condition: numeric_state
    entity_id: sensor.powmr_10_2m_battery_soc
    below: 41
  - action: input_boolean.turn_on
    target:
      entity_id: input_boolean.energyhub_water_boiler_soc_lockout
  - if:
    - condition: state
      entity_id: switch.chuangmi_212a01_c91f_switch
      state: 'on'
    then:
    - action: switch.turn_off
      continue_on_error: true
      target:
        entity_id: switch.chuangmi_212a01_c91f_switch
    - delay:
        seconds: 3
  - action: persistent_notification.create
    data:
      title: EnergyHub - Water boiler locked
      notification_id: energyhub_water_boiler_soc_lockout
      message: >-
        Battery SOC is {{ states('sensor.powmr_10_2m_battery_soc') }}%.
        The boiler is locked OFF until fresh SOC reaches 60%. Current plug state:
        {{ states('switch.chuangmi_212a01_c91f_switch') }}.
  mode: restart
- id: '1786023000003'
  alias: EnergyHub - Enforce Water Boiler SOC Lockout
  description: Rejects boiler ON requests while the 40% SOC lockout is latched.
  triggers:
  - trigger: state
    entity_id: switch.chuangmi_212a01_c91f_switch
    to: 'on'
  conditions:
  - condition: state
    entity_id: input_boolean.energyhub_water_boiler_soc_lockout
    state: 'on'
  - condition: state
    entity_id: sensor.energyhub_telemetry_freshness
    state: fresh
  actions:
  - action: switch.turn_off
    continue_on_error: true
    target:
      entity_id: switch.chuangmi_212a01_c91f_switch
  - delay:
      seconds: 3
  - action: persistent_notification.create
    data:
      title: EnergyHub - Water boiler ON rejected
      notification_id: energyhub_water_boiler_soc_lockout
      message: >-
        The boiler SOC lockout is active. Battery SOC is
        {{ states('sensor.powmr_10_2m_battery_soc') }}%; unlock requires fresh SOC
        of at least 60%. Current plug state:
        {{ states('switch.chuangmi_212a01_c91f_switch') }}.
