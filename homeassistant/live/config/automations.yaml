- id: '1786023000011'
  alias: EnergyHub - Heat Pump Reserve Shed
  description: In the conservative grid policy, requests all running heat-pump
    plugs OFF once when fresh battery SOC reaches 80% or the grid becomes untrusted.
    Fully trusted grid operation and confirmed grid-backed Hybrid/Panic permission skip
    this action.
  triggers:
  - trigger: numeric_state
    entity_id: sensor.powmr_10_2m_battery_soc
    below: 81
    id: soc_at_80
  - trigger: state
    entity_id: sensor.energyhub_grid_confidence
    id: confidence_changed
  - trigger: numeric_state
    entity_id: sensor.energyhub_grid_availability_24h
    below: 100
    id: availability_24h_degraded
  - trigger: numeric_state
    entity_id: sensor.energyhub_grid_available_48h
    below: 48
    id: availability_48h_degraded
  - trigger: numeric_state
    entity_id: sensor.powmr_10_2m_grid_voltage
    below: 50
    id: current_grid_lost
  - trigger: state
    entity_id: sensor.energyhub_operating_mode
    id: operating_mode_changed
  conditions:
  - condition: state
    entity_id: sensor.energyhub_telemetry_freshness
    state: fresh
  - condition: numeric_state
    entity_id: sensor.powmr_10_2m_battery_soc
    below: 81
  - condition: template
    value_template: >-
      {% if trigger.id == 'soc_at_80' %}
        {{ trigger.from_state is not none
           and trigger.from_state.state | float(-1) > 80 }}
      {% elif trigger.id == 'operating_mode_changed' %}
        {{ trigger.from_state is not none
           and trigger.to_state is not none
           and trigger.from_state.state | lower in
             ['hybrid_charging', 'hybrid_grid_hold', 'panic', 'panic_grid_hold']
           and trigger.to_state.state | lower not in
             ['hybrid_charging', 'hybrid_grid_hold', 'panic', 'panic_grid_hold'] }}
      {% else %}
        {{ trigger.from_state is not none
           and trigger.from_state.state not in ['unknown', 'unavailable'] }}
      {% endif %}
  - condition: template
    value_template: >-
      {% set hybrid_grid_permission =
        states('sensor.energyhub_operating_mode') | lower in
          ['hybrid_charging', 'hybrid_grid_hold', 'panic', 'panic_grid_hold']
        and states('sensor.powmr_10_2m_grid_voltage') | float(0) > 50
      %}
      {{ not hybrid_grid_permission }}
  - condition: template
    value_template: >-
      {{ not (
        states('sensor.energyhub_grid_confidence') | lower == 'normal'
        and states('sensor.energyhub_grid_availability_24h') | float(-1) >= 100
        and states('sensor.energyhub_grid_available_48h') | float(-1) >= 48
        and states('sensor.powmr_10_2m_grid_voltage') | float(0) > 50
      ) }}
  actions:
  - if:
    - condition: state
      entity_id: switch.first_floor_heat_pump_plug
      state: 'on'
    then:
    - action: switch.turn_off
      continue_on_error: true
      target:
        entity_id: switch.first_floor_heat_pump_plug
  - if:
    - condition: state
      entity_id: switch.second_floor_heat_pump_plug
      state: 'on'
    then:
    - action: switch.turn_off
      continue_on_error: true
      target:
        entity_id: switch.second_floor_heat_pump_plug
  - if:
    - condition: state
      entity_id: switch.chuangmi_212a01_ea40_switch
      state: 'on'
    then:
    - action: switch.turn_off
      continue_on_error: true
      target:
        entity_id: switch.chuangmi_212a01_ea40_switch
  - delay:
      seconds: 3
  - action: persistent_notification.create
    data:
      title: EnergyHub - Heat-pump reserve shed
      notification_id: energyhub_heat_pump_reserve_shed
      message: >-
        Battery SOC reached {{ states('sensor.powmr_10_2m_battery_soc') }}%.
        Grid Confidence is {{ states('sensor.energyhub_grid_confidence') }} with
        {{ states('sensor.energyhub_grid_availability_24h') }}% availability over
        24 hours and {{ states('sensor.energyhub_grid_available_48h') }} available
        hours over 48 hours. EnergyHub requested all running heat pumps OFF.
        Observed states: floor 1
        {{ states('switch.first_floor_heat_pump_plug') }}, floor 2
        {{ states('switch.second_floor_heat_pump_plug') }}, floor 3
        {{ states('switch.chuangmi_212a01_ea40_switch') }}. Manual overrides remain
        possible above the staged thresholds and the 50% global lockout.
  mode: single
- id: '1786023000012'
  alias: EnergyHub - Heat Pump Manual Override Sheds
  description: Sheds the floor-2 manual override at 70% and floor-1 manual override
    at 60%. Floor 3 is protected until the 50% global lockout.
  triggers:
  - trigger: numeric_state
    entity_id: sensor.powmr_10_2m_battery_soc
    below: 71
    id: floor_2_at_70
  - trigger: numeric_state
    entity_id: sensor.powmr_10_2m_battery_soc
    below: 61
    id: floor_1_at_60
  conditions:
  - condition: state
    entity_id: sensor.energyhub_telemetry_freshness
    state: fresh
  - condition: template
    value_template: >-
      {% set hybrid_grid_permission =
        states('sensor.energyhub_operating_mode') | lower in
          ['hybrid_charging', 'hybrid_grid_hold', 'panic', 'panic_grid_hold']
        and states('sensor.powmr_10_2m_grid_voltage') | float(0) > 50
      %}
      {{ not hybrid_grid_permission }}
  - condition: template
    value_template: >-
      {{ not (
        states('sensor.energyhub_grid_confidence') | lower == 'normal'
        and states('sensor.energyhub_grid_availability_24h') | float(-1) >= 100
        and states('sensor.energyhub_grid_available_48h') | float(-1) >= 48
        and states('sensor.powmr_10_2m_grid_voltage') | float(0) > 50
      ) }}
  - condition: template
    value_template: >-
      {% if trigger.id == 'floor_2_at_70' %}
        {{ trigger.from_state is not none
           and trigger.from_state.state | float(-1) > 70 }}
      {% else %}
        {{ trigger.from_state is not none
           and trigger.from_state.state | float(-1) > 60 }}
      {% endif %}
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: floor_2_at_70
      - condition: state
        entity_id: switch.second_floor_heat_pump_plug
        state: 'on'
      sequence:
      - action: switch.turn_off
        continue_on_error: true
        target:
          entity_id: switch.second_floor_heat_pump_plug
      - delay:
          seconds: 3
      - action: persistent_notification.create
        data:
          title: EnergyHub - Floor 2 heat pump shed
          notification_id: energyhub_heat_pump_floor_2_shed
          message: >-
            Battery SOC reached
            {{ states('sensor.powmr_10_2m_battery_soc') }}%. EnergyHub requested
            the floor 2 heat pump OFF. Observed state:
            {{ states('switch.second_floor_heat_pump_plug') }}. Another manual ON
            request remains possible above the 50% global lockout.
    - conditions:
      - condition: trigger
        id: floor_1_at_60
      - condition: state
        entity_id: switch.first_floor_heat_pump_plug
        state: 'on'
      sequence:
      - action: switch.turn_off
        continue_on_error: true
        target:
          entity_id: switch.first_floor_heat_pump_plug
      - delay:
          seconds: 3
      - action: persistent_notification.create
        data:
          title: EnergyHub - Floor 1 heat pump shed
          notification_id: energyhub_heat_pump_floor_1_shed
          message: >-
            Battery SOC reached
            {{ states('sensor.powmr_10_2m_battery_soc') }}%. EnergyHub requested
            the floor 1 heat pump OFF. Observed state:
            {{ states('switch.first_floor_heat_pump_plug') }}. Another manual ON
            request remains possible above the 50% global lockout.
  mode: queued
  max: 2
- id: '1786023000013'
  alias: EnergyHub - Heat Pump Critical SOC Lockout
  description: At 50% fresh SOC, latches the global heat-pump lockout and requests
    every running heat-pump plug OFF unless confirmed Hybrid is currently carrying
    the house from a present grid. The latch remains remembered during that temporary
    manual-use permission.
  triggers:
  - trigger: numeric_state
    entity_id: sensor.powmr_10_2m_battery_soc
    below: 51
    id: critical_soc
  - trigger: state
    entity_id: sensor.energyhub_telemetry_freshness
    to: fresh
    id: telemetry_recovered
  - trigger: homeassistant
    event: start
    id: startup
  actions:
  - if:
    - condition: trigger
      id: startup
    then:
    - delay:
        seconds: 10
  - condition: state
    entity_id: sensor.energyhub_telemetry_freshness
    state: fresh
  - condition: numeric_state
    entity_id: sensor.powmr_10_2m_battery_soc
    below: 51
  - action: input_boolean.turn_on
    target:
      entity_id: input_boolean.energyhub_heat_pump_soc_lockout
  - condition: template
    value_template: >-
