            if ns.ramp_confirmed and raw_morning_hours >= 1 else 0 %}
          {% set morning_hours = [0,
            raw_morning_hours - ramp_credit_hours] | max %}
          {% set effective_solar_start = ns.useful_solar_start
            - timedelta(hours=ramp_credit_hours) %}
          {{ {
            'raw_morning_hours': raw_morning_hours | round(2),
            'morning_hours': morning_hours | round(2),
            'useful_solar_start':
              ns.useful_solar_start.strftime('%H:%M'),
            'effective_solar_start':
              effective_solar_start.strftime('%H:%M'),
            'ramp_confirmed': ns.ramp_confirmed,
            'ramp_credit_hours': ramp_credit_hours,
            'ramp_start_power_w':
              (ns.ramp_start_power * 1000) | round(1),
            'ramp_next_power_w':
              ((ns.ramp_next_power * 1000) | round(1))
              if ns.ramp_next_power is not none else none,
            'hourly_solar': ns.hourly_solar,
            'solar_after_07_kwh': ns.solar_after_07 | round(2)
          } | tojson }}
        {% else %}
          {{ {
            'raw_morning_hours': 5,
            'morning_hours': 5,
            'useful_solar_start': 'fallback 12:00',
            'effective_solar_start': 'fallback 12:00',
            'ramp_confirmed': false,
            'ramp_credit_hours': 0,
            'ramp_start_power_w': none,
            'ramp_next_power_w': none,
            'hourly_solar': ns.hourly_solar,
            'solar_after_07_kwh': ns.solar_after_07 | round(2)
          } | tojson }}
        {% endif %}
      retain: true
  mode: restart
- id: '1783697064742'
  alias: EnergyHub - Publish Autopilot State
  description: Publishes the EnergyHub Autopilot helper state to MQTT.
  triggers:
  - trigger: state
    entity_id:
    - input_boolean.energyhub_autopilot
  - trigger: homeassistant
    event: start
  actions:
  - delay:
      seconds: 5
  - action: mqtt.publish
    data:
      topic: energyhub/input/ha/autopilot
      payload: '{{ states(''input_boolean.energyhub_autopilot'') }}'
      retain: true
  mode: restart
- id: '1786500000001'
  alias: EnergyHub - Publish AHM Minimum SOC
  description: Publishes the selected Adaptive Hybrid minimum reserve to EnergyHub.
  triggers:
  - trigger: state
    entity_id: input_number.ahm_minimum_soc
  - trigger: homeassistant
    event: start
  conditions: []
  actions:
  - delay:
      seconds: 5
  - action: mqtt.publish
    data:
      topic: energyhub/input/ha/ahm_minimum_soc
      payload: '{{ states(''input_number.ahm_minimum_soc'') }}'
      retain: true
  mode: restart
- id: '1786500000002'
  alias: EnergyHub - Capture Essential Morning Load
  description: Publishes hourly 07:00-12:00 house and heat-pump energy snapshots so EnergyHub can learn the essential morning load.
  triggers:
  - trigger: time
    at:
    - 07:00:00
    - 08:00:00
    - 09:00:00
    - '10:00:00'
    - '11:00:00'
    - '12:00:00'
  conditions: []
  actions:
  - delay:
      seconds: 30
  - action: mqtt.publish
    data:
      topic: energyhub/input/ha/morning_load_snapshot
      payload: >-
        {% set house =
          states('sensor.powmr_10_2m_daily_house_consumption')
          | float(none) %}
        {% set hp1 =
          states('sensor.first_floor_heat_pump_plug_energy')
          | float(none) %}
        {% set hp2 =
          states('sensor.second_floor_heat_pump_plug_energy')
          | float(none) %}
        {% set hp3 =
          states('sensor.third_floor_heat_pump_energy_calculated')
          | float(none) %}
        {% set heat_pump = hp1 + hp2 + hp3
          if hp1 is not none and hp2 is not none and hp3 is not none
          else none %}
        {{ {
          'captured_at': now().isoformat(),
          'date': now().strftime('%Y-%m-%d'),
          'hour': now().hour,
          'house_kwh': house,
          'heat_pump_kwh': heat_pump
        } | tojson }}
      retain: false
  mode: single
- id: '1786500000003'
  alias: EnergyHub - Observe AHM Morning Reserve
  description: Tracks the lowest 07:00-12:00 SOC and publishes one completed morning to the three-day AHM reserve advisor.
  triggers:
  - trigger: time
    at: 07:00:00
    id: initialize
  - trigger: state
    entity_id: sensor.powmr_10_2m_battery_soc
    id: update_minimum
  - trigger: time
    at: '12:05:00'
    id: publish
  - trigger: homeassistant
    event: start
    id: invalidate_after_restart
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: initialize
      sequence:
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.energyhub_ahm_morning_observation_valid
      - condition: template
        value_template: >-
          {% set soc = states('sensor.powmr_10_2m_battery_soc') | float(none) %}
          {{ soc is not none and 0 <= soc <= 100 }}
      - action: input_number.set_value
        target:
          entity_id: input_number.ahm_morning_minimum_soc
        data:
          value: '{{ states(''sensor.powmr_10_2m_battery_soc'') | float }}'
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.energyhub_ahm_morning_observation_valid
    - conditions:
      - condition: trigger
        id: invalidate_after_restart
      - condition: time
        after: 07:00:00
        before: '12:05:01'
      sequence:
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.energyhub_ahm_morning_observation_valid
    - conditions:
      - condition: trigger
        id: update_minimum
      - condition: time
        after: 07:00:00
        before: '12:00:01'
      - condition: state
        entity_id: input_boolean.energyhub_ahm_morning_observation_valid
        state: 'on'
      - condition: template
        value_template: >-
          {% set soc = states('sensor.powmr_10_2m_battery_soc') | float(none) %}
          {% set minimum = states('input_number.ahm_morning_minimum_soc') | float(none) %}
          {{ soc is not none and 0 <= soc <= 100
             and minimum is not none
             and soc < minimum }}
      sequence:
      - action: input_number.set_value
        target:
          entity_id: input_number.ahm_morning_minimum_soc
        data:
          value: '{{ states(''sensor.powmr_10_2m_battery_soc'') | float(0) }}'
    - conditions:
      - condition: trigger
        id: publish
      - condition: state
        entity_id: input_boolean.energyhub_ahm_morning_observation_valid
        state: 'on'
      - condition: template
        value_template: >-
          {% set minimum = states('input_number.ahm_morning_minimum_soc') | float(none) %}
          {% set selected = states('input_number.ahm_minimum_soc') | float(none) %}
          {{ minimum is not none and 0 <= minimum <= 100
             and selected is not none and 20 <= selected <= 50 }}
      sequence:
      - action: mqtt.publish
        data:
          topic: energyhub/input/ha/ahm_reserve_observation
          payload: >-
            {{ {
              'date': now().strftime('%Y-%m-%d'),
              'minimum_soc': states('input_number.ahm_morning_minimum_soc') | float,
              'selected_soc': states('input_number.ahm_minimum_soc') | float
            } | tojson }}
          retain: false
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.energyhub_ahm_morning_observation_valid
  mode: queued
- id: '1783705009942'
  alias: EnergyHub - Hybrid Schedule
  description: Evaluates Hybrid at 23:50, requests one guarded early-Solar check
    at 06:05, and restores Solar at 07:00.
  triggers:
  - trigger: time
    at: '23:50:00'
    id: evaluate_hybrid
  - trigger: time
    at: 06:05:00
    id: early_solar_check
  - trigger: time
    at: 07:00:00
    id: restore_solar
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id:
        - early_solar_check
      sequence:
      - action: mqtt.publish
        data:
          topic: energyhub/input/ha/early_solar_check
          payload: >-
            {% set hourly =
              state_attr('sensor.solcast_pv_forecast_forecast_today',
              'detailedHourly') or [] %}
            {% set interval_start = today_at('06:00') %}
            {% set interval_end = today_at('07:00') %}
            {% set ns = namespace(forecast_kwh=none) %}
            {% for item in hourly %}
              {% set period = as_local(as_datetime(item.period_start)) %}
              {% if period >= interval_start and period < interval_end %}
                {% set ns.forecast_kwh = item.pv_estimate | float(0) %}
              {% endif %}
            {% endfor %}
            {{ {
              'date': now().strftime('%Y-%m-%d'),
              'forecast_kwh': ns.forecast_kwh
            } | tojson }}
          retain: false
    - conditions:
      - condition: trigger
        id:
        - evaluate_hybrid
      sequence:
      - action: mqtt.publish
        data:
          topic: energyhub/input/ha/inverter_mode
          payload: evaluate_hybrid
          retain: false
    - conditions:
      - condition: trigger
        id:
        - restore_solar
      - condition: state
        entity_id: input_boolean.energyhub_autopilot
        state: 'on'
      sequence:
      - action: mqtt.publish
        data:
          topic: energyhub/input/ha/inverter_mode
          payload: solar
          retain: false
    default:
    - action: mqtt.publish
      data:
        topic: energyhub/input/ha/inverter_mode
        payload: evaluate_hybrid
        retain: false
  mode: single
- id: '1783953087633'
  alias: EnergyHub - Mode Notifications
  description: Shows notifications after automatic Hybrid or Panic transitions succeed
    or fail.
  triggers:
  - trigger: mqtt
    topic: energyhub/event/notification
  conditions: []
  actions:
  - variables:
      event: '{{ trigger.payload_json }}'
      event_type: '{{ event.type | default(''unknown'') }}'
      mode: '{{ event.mode | default(''unknown'') }}'
      requested_mode: '{{ event.requested_mode | default(''unknown'') }}'
      soc: '{{ event.soc | default(''unknown'') }}'
      target_soc: '{{ event.target_soc | default(''unknown'') }}'
      reason: '{{ event.reason | default(''No reason provided'') }}'
      error: '{{ event.error | default(''No transition error provided'') }}'
      current_mode: '{{ event.current_mode | default(''unknown'') }}'
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ event_type == ''automatic_mode_activation'' and mode ==
          ''hybrid'' and requested_mode != ''solar'' }}'
      sequence:
      - action: persistent_notification.create
        data:
          title: "\U0001F319 EnergyHub: Hybrid activated"
          notification_id: energyhub_hybrid
          message: 'Battery SOC: {{ soc }}%

            Tomorrow forecast: {{ event.forecast | round(2) }} kWh

            Projected SOC at 07:00: {{ event.projected_soc_at_07 }}%

            Useful solar starts: {{ event.useful_solar_start }}

            Forecast ramp: {{ event.ramp_start_power_w | default(''unknown'') }} W
            → {{ event.ramp_next_power_w | default(''unknown'') }} W

            Ramp confirmed: {{ event.ramp_confirmed | default(false) }};
            credit: {{ event.ramp_credit_hours | default(0) }} hour(s)

            Effective solar support: {{ event.effective_solar_start }}

            Raw/effective morning gap: {{ event.raw_morning_hours }} /
            {{ event.morning_hours }} hour(s)

            Selected minimum SOC: {{ event.minimum_soc }}%

            Morning model: {{ event.morning_model_source }}
            ({{ event.morning_model_reason }})

            Learned samples/hour: {{ event.morning_model_samples }}

            Essential load / solar / net deficit:
            {{ event.morning_expected_load_kwh | default(''unknown'') }} /
            {{ event.morning_forecast_solar_kwh | default(''unknown'') }} /
            {{ event.morning_net_deficit_kwh | default(''unknown'') }} kWh

            Expected consumption after 07:00:
            {{ event.expected_consumption_after_07 | default(''unknown'') }} kWh

            Solar forecast after 07:00:
            {{ event.solar_forecast_after_07 | default(''unknown'') }} kWh

            Daytime deficit: {{ event.daytime_deficit_kwh | default(''unknown'') }}
            kWh / {{ event.daytime_deficit_soc | default(''unknown'') }}% SOC

            Target SOC: {{ target_soc }}%

            EnergyHub will keep the house on the night grid until a guarded
            early-Solar handover succeeds or the normal 07:00 fallback.

            Reason: {{ reason }}'
    - conditions:
      - condition: template
        value_template: '{{ event_type == ''automatic_mode_activation'' and mode ==
          ''hybrid'' and requested_mode == ''solar'' }}'
      sequence:
      - action: persistent_notification.create
        data:
          title: "☀️ EnergyHub: AHM restored Solar"
          notification_id: energyhub_hybrid
          message: >-
            AHM took ownership from daytime Panic at 23:50 and restored Solar.
            Battery SOC: {{ soc }}%. Target SOC: {{ target_soc }}%.
            Reason: {{ reason }}
    - conditions:
      - condition: template
        value_template: '{{ event_type == ''automatic_mode_activation'' and mode ==
          ''early_solar'' }}'
      sequence:
      - action: persistent_notification.create
        data:
          title: "☀️ EnergyHub: Early Solar handover"
          notification_id: energyhub_early_solar
          message: >-
            Hybrid Grid Hold ended early. Battery SOC: {{ soc }}%.
            Adaptive Hybrid target: {{ target_soc }}%. Live Total Solar:
            {{ event.live_solar_w }} W. Forecast 06:00–07:00:
            {{ event.forecast_energy_kwh }} kWh. Reason: {{ reason }}
    - conditions:
      - condition: template
        value_template: '{{ event_type == ''automatic_mode_activation_failed'' and
          mode == ''early_solar'' }}'
      sequence:
      - action: persistent_notification.create
        data:
          title: '⚠️ EnergyHub: Early Solar handover failed'
          notification_id: energyhub_early_solar
          message: >-
            EnergyHub kept the confirmed inverter state. Battery SOC:
            {{ soc }}%. Target: {{ target_soc }}%. Error: {{ error }}.
            Current mode: {{ current_mode }}. Reason: {{ reason }}
    - conditions:
      - condition: template
        value_template: '{{ event_type == ''automatic_mode_activation'' and mode ==
          ''panic'' }}'
      sequence:
      - action: persistent_notification.create
        data:
          title: "\U0001F6A8 EnergyHub: Panic activated"
          notification_id: energyhub_panic
          message: 'Battery SOC: {{ soc }}%

            Grid confidence: {{ event.grid_confidence | default(''unknown'') }}

            Target SOC: {{ target_soc }}%

            Panic phase: {{ event.phase | default(''unknown'') }}

            Target source: {{ event.target_source | default(''unknown'') }}

            Reason: {{ reason }}'
    - conditions:
      - condition: template
        value_template: '{{ event_type == ''automatic_mode_activation_failed'' and
          mode == ''hybrid'' }}'
      sequence:
      - action: persistent_notification.create
        data:
          title: '⚠️ EnergyHub: Hybrid activation failed'
          notification_id: energyhub_hybrid
          message: 'EnergyHub decided to activate Hybrid, but the inverter transition
            was not confirmed.

            Current mode: {{ current_mode }}

            Error: {{ error }}

            Decision reason: {{ reason }}'
    - conditions:
      - condition: template
        value_template: '{{ event_type == ''automatic_mode_activation_failed'' and
          mode == ''panic'' }}'
      sequence:
      - action: persistent_notification.create
        data:
          title: '⚠️ EnergyHub: Panic activation failed'
          notification_id: energyhub_panic
          message: 'EnergyHub decided to activate Panic, but the inverter transition
            was not confirmed.

            Current mode: {{ current_mode }}

            Error: {{ error }}

            Decision reason: {{ reason }}'
  mode: queued
  max: 10
- id: '1786023000001'
  alias: EnergyHub - Water Boiler Reserve Shed
  description: Turns the water boiler off once when fresh battery SOC reaches 50%.
    A later ON request remains allowed until the emergency lockout activates.
  triggers:
  - trigger: numeric_state
    entity_id: sensor.powmr_10_2m_battery_soc
    below: 51
  conditions:
  - condition: state
    entity_id: sensor.energyhub_telemetry_freshness
    state: fresh
  - condition: state
    entity_id: switch.chuangmi_212a01_c91f_switch
    state: 'on'
  actions:
  - action: switch.turn_off
    continue_on_error: true
    target:
      entity_id: switch.chuangmi_212a01_c91f_switch
  - delay:
      seconds: 3
  - action: persistent_notification.create
    data:
      title: EnergyHub - Water boiler reserve shed
      notification_id: energyhub_water_boiler_reserve_shed
      message: >-
        Battery SOC reached {{ states('sensor.powmr_10_2m_battery_soc') }}%.
        EnergyHub requested boiler OFF. Current plug state:
        {{ states('switch.chuangmi_212a01_c91f_switch') }}. An ON request is allowed
        above 40%; at 40% a lockout remains active until SOC reaches 60%.
  mode: single
- id: '1786023000002'
  alias: EnergyHub - Water Boiler Critical SOC Lockout
  description: Latches the boiler lockout at 40% SOC and requests OFF only while
    EnergyHub telemetry is fresh.
  triggers:
  - trigger: numeric_state
    entity_id: sensor.powmr_10_2m_battery_soc
    below: 41
    id: critical_soc
  - trigger: state
    entity_id: sensor.energyhub_telemetry_freshness
    to: fresh
    id: telemetry_recovered
  - trigger: homeassistant
    event: start
    id: startup
  actions:
  - if:
    - condition: trigger
      id: startup
    then:
    - delay:
        seconds: 10
  - condition: state
    entity_id: sensor.energyhub_telemetry_freshness
    state: fresh
  - condition: numeric_state
    entity_id: sensor.powmr_10_2m_battery_soc
    below: 41
  - action: input_boolean.turn_on
    target:
      entity_id: input_boolean.energyhub_water_boiler_soc_lockout
  - if:
    - condition: state
      entity_id: switch.chuangmi_212a01_c91f_switch
      state: 'on'
    then:
    - action: switch.turn_off
      continue_on_error: true
      target:
        entity_id: switch.chuangmi_212a01_c91f_switch
    - delay:
        seconds: 3
  - action: persistent_notification.create
    data:
      title: EnergyHub - Water boiler locked
      notification_id: energyhub_water_boiler_soc_lockout
      message: >-
        Battery SOC is {{ states('sensor.powmr_10_2m_battery_soc') }}%.
        The boiler is locked OFF until fresh SOC reaches 60%. Current plug state:
        {{ states('switch.chuangmi_212a01_c91f_switch') }}.
  mode: restart
- id: '1786023000003'
  alias: EnergyHub - Enforce Water Boiler SOC Lockout
  description: Rejects boiler ON requests while the 40% SOC lockout is latched.
  triggers:
  - trigger: state
    entity_id: switch.chuangmi_212a01_c91f_switch
    to: 'on'
  conditions:
  - condition: state
    entity_id: input_boolean.energyhub_water_boiler_soc_lockout
    state: 'on'
  - condition: state
    entity_id: sensor.energyhub_telemetry_freshness
    state: fresh
  actions:
  - action: switch.turn_off
    continue_on_error: true
    target:
      entity_id: switch.chuangmi_212a01_c91f_switch
  - delay:
      seconds: 3
  - action: persistent_notification.create
    data:
      title: EnergyHub - Water boiler ON rejected
      notification_id: energyhub_water_boiler_soc_lockout
      message: >-
        The boiler SOC lockout is active. Battery SOC is
        {{ states('sensor.powmr_10_2m_battery_soc') }}%; unlock requires fresh SOC
        of at least 60%. Current plug state:
        {{ states('switch.chuangmi_212a01_c91f_switch') }}.
  mode: restart
- id: '1786023000004'
  alias: EnergyHub - Clear Water Boiler SOC Lockout
  description: Clears the latched boiler lockout at 60% fresh SOC without turning
    the boiler on.
  triggers:
  - trigger: numeric_state
    entity_id: sensor.powmr_10_2m_battery_soc
    above: 59
    id: recovered_soc
  - trigger: state
    entity_id: sensor.energyhub_telemetry_freshness
    to: fresh
    id: telemetry_recovered
  - trigger: homeassistant
    event: start
    id: startup
  actions:
  - if:
    - condition: trigger
      id: startup
    then:
    - delay:
        seconds: 10
  - condition: state
    entity_id: sensor.energyhub_telemetry_freshness
    state: fresh
  - condition: numeric_state
    entity_id: sensor.powmr_10_2m_battery_soc
    above: 59
  - action: input_boolean.turn_off
    target:
      entity_id: input_boolean.energyhub_water_boiler_soc_lockout
  - action: persistent_notification.dismiss
    data:
      notification_id: energyhub_water_boiler_soc_lockout
  - action: persistent_notification.dismiss
    data:
      notification_id: energyhub_water_boiler_reserve_shed
  mode: restart
- id: '1786023000011'
  alias: EnergyHub - Heat Pump Reserve Shed
  description: When the grid is not trusted, requests all running heat-pump plugs
    OFF once at the selected AHM minimum plus 30 percentage points. Manual override
    remains available until the mandatory lockout threshold.
  triggers:
  - trigger: template
    value_template: >-
      {% set soc = states('sensor.powmr_10_2m_battery_soc') | float(-1) %}
      {% set reserve = states('input_number.ahm_minimum_soc') | float(-1) %}
      {% set trusted_grid =
        states('sensor.energyhub_grid_confidence') | lower == 'normal'
        and states('sensor.powmr_10_2m_grid_voltage') | float(0) > 50
        and states('sensor.energyhub_telemetry_freshness') == 'fresh'
      %}
      {{ soc >= 0 and reserve >= 0 and not trusted_grid
         and soc <= reserve + 30 }}
  conditions:
  - condition: state
    entity_id: sensor.energyhub_telemetry_freshness
    state: fresh
  - condition: template
    value_template: >-
      {% set soc = states('sensor.powmr_10_2m_battery_soc') | float(-1) %}
      {% set reserve = states('input_number.ahm_minimum_soc') | float(-1) %}
      {{ soc >= 0 and reserve >= 0 and soc <= reserve + 30 }}
  actions:
  - if:
    - condition: state
      entity_id: switch.first_floor_heat_pump_plug
      state: 'on'
    then:
    - action: switch.turn_off
      continue_on_error: true
      target:
        entity_id: switch.first_floor_heat_pump_plug
  - if:
    - condition: state
      entity_id: switch.second_floor_heat_pump_plug
      state: 'on'
    then:
    - action: switch.turn_off
      continue_on_error: true
      target:
        entity_id: switch.second_floor_heat_pump_plug
  - if:
    - condition: state
      entity_id: switch.chuangmi_212a01_ea40_switch
      state: 'on'
    then:
    - action: switch.turn_off
      continue_on_error: true
      target:
        entity_id: switch.chuangmi_212a01_ea40_switch
  - delay:
      seconds: 3
  - action: persistent_notification.create
    data:
      title: EnergyHub - Heat-pump reserve shed
      notification_id: energyhub_heat_pump_reserve_shed
      message: >-
        {% set reserve = states('input_number.ahm_minimum_soc') | float(20) %}
        Battery SOC reached {{ states('sensor.powmr_10_2m_battery_soc') }}%.
        The reserve-shed threshold is {{ reserve + 30 }}% from the selected
        {{ reserve }}% AHM minimum.
        Grid Confidence is {{ states('sensor.energyhub_grid_confidence') }} with
        {{ states('sensor.energyhub_grid_availability_24h') }}% availability over
        24 hours and {{ states('sensor.energyhub_grid_available_48h') }} available
        hours over 48 hours. EnergyHub requested all running heat pumps OFF.
        Observed states: floor 1
        {{ states('switch.first_floor_heat_pump_plug') }}, floor 2
        {{ states('switch.second_floor_heat_pump_plug') }}, floor 3
        {{ states('switch.chuangmi_212a01_ea40_switch') }}. Manual overrides remain
        possible until the mandatory {{ reserve + 20 }}% lockout.
  mode: single
- id: '1786023000013'
  alias: EnergyHub - Heat Pump Critical SOC Lockout
  description: When the grid is not trusted, latches the global heat-pump lockout
    at the selected AHM minimum plus 20 percentage points and requests every running
    heat-pump plug OFF.
  triggers:
  - trigger: template
    value_template: >-
      {% set soc = states('sensor.powmr_10_2m_battery_soc') | float(-1) %}
      {% set reserve = states('input_number.ahm_minimum_soc') | float(-1) %}
      {% set trusted_grid =
        states('sensor.energyhub_grid_confidence') | lower == 'normal'
        and states('sensor.powmr_10_2m_grid_voltage') | float(0) > 50
        and states('sensor.energyhub_telemetry_freshness') == 'fresh'
      %}
      {{ soc >= 0 and reserve >= 0 and not trusted_grid
         and states('sensor.energyhub_telemetry_freshness') == 'fresh'
         and soc <= reserve + 20 }}
  actions:
  - condition: state
    entity_id: sensor.energyhub_telemetry_freshness
    state: fresh
  - condition: template
    value_template: >-
      {% set soc = states('sensor.powmr_10_2m_battery_soc') | float(-1) %}
      {% set reserve = states('input_number.ahm_minimum_soc') | float(-1) %}
      {{ soc >= 0 and reserve >= 0 and soc <= reserve + 20 }}
  - action: input_boolean.turn_on
    target:
      entity_id: input_boolean.energyhub_heat_pump_soc_lockout
  - if:
    - condition: state
      entity_id: switch.first_floor_heat_pump_plug
      state: 'on'
    then:
    - action: switch.turn_off
      continue_on_error: true
      target:
        entity_id: switch.first_floor_heat_pump_plug
  - if:
    - condition: state
      entity_id: switch.second_floor_heat_pump_plug
      state: 'on'
    then:
    - action: switch.turn_off
      continue_on_error: true
      target:
        entity_id: switch.second_floor_heat_pump_plug
  - if:
    - condition: state
      entity_id: switch.chuangmi_212a01_ea40_switch
      state: 'on'
    then:
    - action: switch.turn_off
      continue_on_error: true
      target:
        entity_id: switch.chuangmi_212a01_ea40_switch
  - delay:
      seconds: 3
  - action: persistent_notification.create
    data:
      title: EnergyHub - Heat pumps locked
      notification_id: energyhub_heat_pump_soc_lockout
      message: >-
        {% set reserve = states('input_number.ahm_minimum_soc') | float(20) %}
        {% set recovery_soc = reserve + 40 %}
        Battery SOC is {{ states('sensor.powmr_10_2m_battery_soc') }}%.
        All heat pumps are locked OFF until fresh SOC reaches
        {{ recovery_soc }}%. The mandatory threshold is {{ reserve + 20 }}%
        from the selected {{ reserve }}% AHM minimum.
        Observed states: floor 1
        {{ states('switch.first_floor_heat_pump_plug') }}, floor 2
        {{ states('switch.second_floor_heat_pump_plug') }}, floor 3
        {{ states('switch.chuangmi_212a01_ea40_switch') }}.
  mode: restart
- id: '1786023000014'
  alias: EnergyHub - Enforce Heat Pump SOC Lockout
  description: Rejects heat-pump ON requests while the reserve-relative lockout is
    latched and the grid is not trusted. A trusted present grid temporarily restores
    family control without clearing the remembered latch.
  triggers:
  - trigger: state
    entity_id: switch.first_floor_heat_pump_plug
    to: 'on'
    id: floor_1
  - trigger: state
    entity_id: switch.second_floor_heat_pump_plug
    to: 'on'
    id: floor_2
  - trigger: state
    entity_id: switch.chuangmi_212a01_ea40_switch
    to: 'on'
    id: floor_3
  - trigger: state
    entity_id: input_boolean.energyhub_heat_pump_soc_lockout
    to: 'on'
    id: lockout_latched
  - trigger: state
    entity_id: sensor.energyhub_operating_mode
    id: operating_mode_changed
  - trigger: state
    entity_id: sensor.energyhub_grid_confidence
    id: confidence_changed
  - trigger: state
    entity_id: input_number.ahm_minimum_soc
    id: reserve_changed
  - trigger: numeric_state
    entity_id: sensor.powmr_10_2m_grid_voltage
    below: 50
    id: current_grid_lost
  - trigger: state
    entity_id: sensor.energyhub_telemetry_freshness
    to: fresh
    id: telemetry_recovered
  conditions:
  - condition: state
    entity_id: input_boolean.energyhub_heat_pump_soc_lockout
    state: 'on'
  - condition: state
    entity_id: sensor.energyhub_telemetry_freshness
    state: fresh
  - condition: template
    value_template: >-
      {% set trusted_grid =
        states('sensor.energyhub_grid_confidence') | lower == 'normal'
        and states('sensor.powmr_10_2m_grid_voltage') | float(0) > 50
        and states('sensor.energyhub_telemetry_freshness') == 'fresh'
      %}
      {{ not trusted_grid }}
  actions:
  - if:
    - condition: state
      entity_id: switch.first_floor_heat_pump_plug
      state: 'on'
    then:
    - action: switch.turn_off
      continue_on_error: true
      target:
        entity_id: switch.first_floor_heat_pump_plug
  - if:
    - condition: state
      entity_id: switch.second_floor_heat_pump_plug
      state: 'on'
    then:
    - action: switch.turn_off
      continue_on_error: true
      target:
        entity_id: switch.second_floor_heat_pump_plug
  - if:
    - condition: state
      entity_id: switch.chuangmi_212a01_ea40_switch
      state: 'on'
    then:
    - action: switch.turn_off
      continue_on_error: true
      target:
        entity_id: switch.chuangmi_212a01_ea40_switch
  - delay:
      seconds: 3
  - action: persistent_notification.create
    data:
      title: >-
        {% if trigger.id in ['floor_1', 'floor_2', 'floor_3'] %}
          EnergyHub - Heat-pump ON rejected
        {% else %}
          EnergyHub - Heat-pump protection restored
        {% endif %}
      notification_id: energyhub_heat_pump_soc_lockout
      message: >-
        {% set reserve = states('input_number.ahm_minimum_soc') | float(20) %}
        {% set recovery_soc = reserve + 40 %}
        {% if trigger.id in ['floor_1', 'floor_2', 'floor_3'] %}
          A heat-pump ON request was rejected because the remembered SOC lockout
          is active.
        {% else %}
          Trusted-grid manual permission ended. EnergyHub requested every running
          heat pump OFF because the remembered SOC lockout is active.
        {% endif %}
        Battery SOC is
        {{ states('sensor.powmr_10_2m_battery_soc') }}%; unlock currently requires
        fresh SOC of at least {{ recovery_soc }}%. Current observed states: floor 1
        {{ states('switch.first_floor_heat_pump_plug') }}, floor 2
        {{ states('switch.second_floor_heat_pump_plug') }}, floor 3
        {{ states('switch.chuangmi_212a01_ea40_switch') }}.
  mode: restart
- id: '1786023000015'
  alias: EnergyHub - Clear Heat Pump SOC Lockout
  description: Clears the heat-pump lockout at the selected AHM minimum plus 40
    percentage points, without turning any heat pump on.
  triggers:
  - trigger: template
    value_template: >-
      {% set soc = states('sensor.powmr_10_2m_battery_soc') | float(-1) %}
      {% set reserve = states('input_number.ahm_minimum_soc') | float(-1) %}
      {{ is_state('input_boolean.energyhub_heat_pump_soc_lockout', 'on')
         and states('sensor.energyhub_telemetry_freshness') == 'fresh'
         and soc >= 0 and reserve >= 0 and soc >= reserve + 40 }}
  actions:
  - condition: state
    entity_id: sensor.energyhub_telemetry_freshness
    state: fresh
  - condition: template
    value_template: >-
      {% set soc = states('sensor.powmr_10_2m_battery_soc') | float(-1) %}
      {% set reserve = states('input_number.ahm_minimum_soc') | float(-1) %}
      {{ soc >= 0 and reserve >= 0 and soc >= reserve + 40 }}
  - action: input_boolean.turn_off
    target:
      entity_id: input_boolean.energyhub_heat_pump_soc_lockout
  - action: persistent_notification.dismiss
    data:
      notification_id: energyhub_heat_pump_soc_lockout
  - action: persistent_notification.dismiss
    data:
      notification_id: energyhub_heat_pump_reserve_shed
  mode: restart
- id: '1786023000016'
  alias: EnergyHub - Trusted Grid Heat Pump Manual Permission
  description: While Grid Confidence is Normal, the grid is present, and telemetry
    is fresh, allows family heat-pump control without clearing a remembered SOC
    lockout and without turning any heat pump on.
  triggers:
  - trigger: state
    entity_id: sensor.energyhub_grid_confidence
    id: confidence_changed
  - trigger: numeric_state
    entity_id: sensor.powmr_10_2m_grid_voltage
    above: 50
    id: current_grid_recovered
  - trigger: state
    entity_id: sensor.energyhub_telemetry_freshness
    to: fresh
    id: telemetry_recovered
  conditions:
  - condition: state
    entity_id: sensor.energyhub_telemetry_freshness
    state: fresh
  - condition: template
    value_template: >-
      {{ states('sensor.energyhub_grid_confidence') | lower == 'normal'
         and states('sensor.powmr_10_2m_grid_voltage') | float(0) > 50 }}
  actions:
  - action: persistent_notification.dismiss
    data:
      notification_id: energyhub_heat_pump_soc_lockout
  - action: persistent_notification.dismiss
    data:
      notification_id: energyhub_heat_pump_reserve_shed
  mode: restart
