- id: '1786023000014'
  alias: EnergyHub - Enforce Heat Pump SOC Lockout
  description: Rejects any heat-pump ON request while the 50% global lockout is
    latched and EnergyHub telemetry is fresh, except for temporary manual permission
    during confirmed grid-backed Hybrid/Panic. A mode or grid change re-enforces the
    remembered latch without automatically starting any heat pump.
  triggers:
  - trigger: state
