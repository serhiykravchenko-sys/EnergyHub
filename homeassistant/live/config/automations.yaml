                'context_id': states['switch.water_boiler_plug_switch'].context.id if states('switch.water_boiler_plug_switch') in ['on', 'off'] else none,
                'intent_revision': states('input_number.energyhub_intent_water_boiler') | int(-1),
                'power_w': states('sensor.water_boiler_plug_electric_power') | float(none),
                'power_observed_at': states['sensor.water_boiler_plug_electric_power'].last_reported.isoformat() if states('sensor.water_boiler_plug_electric_power') not in ['unknown', 'unavailable'] else none,
                'control_ready': bridge_ready,
