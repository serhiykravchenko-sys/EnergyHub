- id: '1783245343717'
  alias: EnergyHub - Publish Daily Summary Inputs
  description: Publishes decision inputs before 23:50 and one atomic Daily Summary
    snapshot at 23:51.
  triggers:
  - trigger: time
    at: '23:49:00'
    id: before_hybrid_decision
  - trigger: time
    at: '23:51:00'
    id: final_daily_snapshot
  conditions: []
  actions:
  - action: mqtt.publish
    data:
      topic: energyhub/input/ha/daily_house_consumption
      payload: '{{ states(''sensor.powmr_10_2m_daily_house_consumption'') }}'
      retain: true
  - action: mqtt.publish
    data:
      topic: energyhub/input/ha/solar_forecast_today
      payload: '{{ states(''sensor.solcast_pv_forecast_forecast_today'') }}'
      retain: true
  - action: mqtt.publish
    data:
      topic: energyhub/input/ha/solar_forecast_tomorrow
      payload: '{{ states(''sensor.solcast_pv_forecast_forecast_tomorrow'') }}'
      retain: true
  - action: mqtt.publish
    data:
      topic: energyhub/input/ha/adaptive_hybrid_plan
      payload: >-
        {% set hourly =
          state_attr('sensor.solcast_pv_forecast_forecast_tomorrow',
          'detailedHourly') or [] %}
        {% set morning_start = today_at('07:00') + timedelta(days=1) %}
        {% set day_end = morning_start + timedelta(hours=17) %}
        {% set ns = namespace(useful_solar_start=none, solar_after_07=0) %}
        {% for item in hourly %}
          {% set period = as_local(as_datetime(item.period_start)) %}
          {% if period >= morning_start and period < day_end %}
            {% set ns.solar_after_07 = ns.solar_after_07
              + (item.pv_estimate | float(0)) %}
          {% endif %}
          {% if ns.useful_solar_start is none
            and item.pv_estimate | float(0) >= 0.3 %}
            {% set ns.useful_solar_start = period %}
          {% endif %}
        {% endfor %}
        {% if ns.useful_solar_start is not none %}
          {% set morning_hours = [0,
            (as_timestamp(ns.useful_solar_start)
            - as_timestamp(morning_start)) / 3600] | max %}
          {{ {
            'morning_hours': morning_hours | round(2),
            'useful_solar_start':
              ns.useful_solar_start.strftime('%H:%M'),
            'solar_after_07_kwh': ns.solar_after_07 | round(2)
          } | tojson }}
        {% else %}
          {{ {
            'morning_hours': 5,
            'useful_solar_start': 'fallback 12:00',
            'solar_after_07_kwh': ns.solar_after_07 | round(2)
          } | tojson }}
        {% endif %}
      retain: true
  - action: mqtt.publish
    data:
      topic: energyhub/input/ha/daily_solar_surplus_estimated
      payload: '{{ states(''input_number.energyhub_daily_solar_surplus_estimated'')
        }}'
      retain: true
  - choose:
    - conditions:
      - condition: trigger
        id: final_daily_snapshot
      sequence:
      - action: mqtt.publish
        data:
          topic: energyhub/input/ha/daily_summary_snapshot
          payload: "{{ {\n  'date': now().strftime('%Y-%m-%d'),\n  'timestamp': as_timestamp(now())
            | int,\n  'daily_house_consumption': states('sensor.powmr_10_2m_daily_house_consumption'),\n
            \ 'solar_forecast_today': states('sensor.solcast_pv_forecast_forecast_today'),\n
            \ 'solar_forecast_tomorrow': states('sensor.solcast_pv_forecast_forecast_tomorrow'),\n
            \ 'daily_solar_surplus_estimated': states('input_number.energyhub_daily_solar_surplus_estimated')\n}
            | tojson }}"
          retain: true
  mode: single
- id: '1784300000001'
  alias: EnergyHub - Publish Live Solcast Forecasts
  description: Publishes live Solcast forecast changes for EnergyHub decision engines
    without creating Daily Summary snapshots.
  triggers:
  - trigger: state
