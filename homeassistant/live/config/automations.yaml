- id: '1781793005552'
  alias: EnergyHub Beacon
  description: 'Color shows battery reserve. Brightness and animation show the real
    electrical state. Smart Heating pulses white, or yellow in Solar-only mode. Solid
    white means EnergyHub telemetry has stopped.

    '
  triggers:
  - trigger: state
    entity_id:
    - sensor.powmr_10_2m_battery_soc
    - sensor.powmr_10_2m_grid_voltage
    - sensor.powmr_10_2m_output_power
    - sensor.energyhub_output_source_priority
    - sensor.energyhub_telemetry_freshness
    - timer.energyhub_smart_heating_beacon_pulse
  - trigger: time_pattern
    minutes: /1
  - trigger: homeassistant
    event: start
  actions:
  - variables:
      soc: '{{ states(''sensor.powmr_10_2m_battery_soc'') | float(-1) }}

        '
      grid_voltage: '{{ states(''sensor.powmr_10_2m_grid_voltage'') | float(0) }}

        '
      grid_available: '{{ grid_voltage > 180 }}

        '
      output_source_priority: '{{ states(''sensor.energyhub_output_source_priority'')
        | upper }}

        '
      using_grid_intentionally: '{{ output_source_priority == ''SUB'' }}

        '
      freshness_state: '{{ states(''sensor.energyhub_telemetry_freshness'') | lower
        }}

        '
      output_power_age_seconds: "{{\n  as_timestamp(now())\n  -\n  as_timestamp(\n
        \   states.sensor.powmr_10_2m_output_power.last_reported,\n    0\n  )\n}}\n"
      telemetry_ok: "{{\n  freshness_state == 'fresh'\n  and 0 <= soc <= 100\n  and
        output_power_age_seconds < 90\n}}\n"
      lamp_color: "{% if soc >= 95 %}\n  [0, 80, 255]\n{% elif soc >= 70 %}\n  [0,
        255, 0]\n{% elif soc > 40 %}\n  [255, 220, 0]\n{% else %}\n  [220, 20, 30]\n{%
        endif %}\n"
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ not telemetry_ok }}'
      sequence:
      - action: light.turn_on
        continue_on_error: true
        target:
          entity_id: light.battery_beacon
        data:
          brightness_pct: 40
          rgb_color:
          - 255
          - 255
          - 255
    - conditions:
      - condition: template
        value_template: "{{ telemetry_ok\n   and is_state('timer.energyhub_smart_heating_beacon_pulse',
          'active') }}"
      sequence:
      - action: light.turn_on
        continue_on_error: true
        target:
          entity_id: light.battery_beacon
        data:
          brightness_pct: 100
          rgb_color: "{{ [255, 220, 0]\n   if is_state('input_boolean.energyhub_solar_only_heating',
            'on')\n   else [255, 255, 255] }}"
    - conditions:
      - condition: template
        value_template: '{{ telemetry_ok and soc >= 0 and soc <= 30 and not grid_available
          }}

          '
      sequence:
      - repeat:
          while:
          - condition: template
            value_template: '{{ states(''sensor.powmr_10_2m_battery_soc'') | float(100)
              <= 30 }}'
          - condition: template
            value_template: '{{ states(''sensor.powmr_10_2m_grid_voltage'') | float(0)
              <= 180 }}'
          - condition: template
            value_template: '{{ states(''sensor.energyhub_telemetry_freshness'') |
              lower == ''fresh'' }}'
          sequence:
          - action: light.turn_on
            continue_on_error: true
            target:
              entity_id: light.battery_beacon
            data:
              brightness_pct: 50
              rgb_color:
              - 220
              - 20
              - 30
          - delay: 00:00:02
          - action: light.turn_on
            continue_on_error: true
            target:
              entity_id: light.battery_beacon
            data:
              brightness_pct: 50
              rgb_color:
              - 90
              - 0
              - 25
          - delay: 00:00:02
    - conditions:
      - condition: template
        value_template: '{{ telemetry_ok and soc > 30 and not grid_available }}'
      sequence:
      - repeat:
          while:
          - condition: template
            value_template: '{{ states(''sensor.powmr_10_2m_grid_voltage'') | float(0)
              <= 180 }}'
          - condition: template
            value_template: '{{ states(''sensor.powmr_10_2m_battery_soc'') | float(0)
              > 30 }}'
          - condition: template
            value_template: "{{\n  states('sensor.energyhub_telemetry_freshness')\n
              \ | lower == 'fresh'\n  and\n  (\n    as_timestamp(now())\n    -\n    as_timestamp(\n
              \     states.sensor.powmr_10_2m_output_power.last_reported,\n      0\n
              \   )\n  ) < 90\n}}\n"
          sequence:
          - repeat:
              for_each:
              - 20
              - 50
              - 80
              - 50
              sequence:
              - action: light.turn_on
                continue_on_error: true
                target:
                  entity_id: light.battery_beacon
                data:
                  brightness_pct: '{{ repeat.item }}'
                  rgb_color: '{{ lamp_color }}'
              - delay: 00:00:01
    - conditions:
      - condition: template
        value_template: '{{ telemetry_ok and using_grid_intentionally }}

          '
      sequence:
      - action: light.turn_on
        continue_on_error: true
        target:
          entity_id: light.battery_beacon
        data:
          brightness_pct: 100
          rgb_color: '{{ lamp_color }}'
    default:
    - condition: template
      value_template: '{{ telemetry_ok and soc >= 0 }}'
    - action: light.turn_on
      continue_on_error: true
      target:
        entity_id: light.battery_beacon
      data:
        brightness_pct: 30
        rgb_color: '{{ lamp_color }}'
  mode: restart
- id: energyhub_smart_heating_beacon_pulse
  alias: EnergyHub - Smart Heating Beacon Pulse
  description: Five-second pulse every 60 seconds while Smart Heating is enabled and
    telemetry is fresh; white normally and yellow in Solar-only mode.
  triggers:
  - trigger: time_pattern
    minutes: /1
  conditions:
  - condition: state
    entity_id: input_boolean.energyhub_smart_heating
    state: 'on'
  - condition: template
    value_template: "{{ is_state('sensor.energyhub_telemetry_freshness', 'fresh')\n
      \  and 0 <= now().timestamp()\n       - as_timestamp(states.sensor.powmr_10_2m_output_power.last_reported,
      0) < 90 }}"
  actions:
  - action: timer.start
    target:
      entity_id: timer.energyhub_smart_heating_beacon_pulse
    data:
      duration: 00:00:05
  mode: restart
- id: energyhub_smart_heating_first_floor
  alias: EnergyHub - First-floor Heating and Cooling
  description: Native first-floor heat-pump control only. Uses Normal, Quiet and Eco;
    pauses off-grid at 40% SOC and restores an owned pause at 50% SOC or grid return.
    Higher-priority load protection always wins.
  triggers:
  - trigger: time_pattern
    minutes: /1
  - trigger: time
    at:
    - input_datetime.energyhub_climate_quiet_start
    - input_datetime.energyhub_climate_quiet_end
  - trigger: state
    entity_id: input_boolean.energyhub_smart_heating
    to: 'on'
    id: smart_enabled
  - trigger: state
    entity_id: input_boolean.energyhub_smart_heating
    to: 'off'
    id: smart_disabled
  - trigger: state
    entity_id:
    - input_boolean.energyhub_solar_only_heating
    - input_boolean.energyhub_climate_quiet_enabled
    - input_number.energyhub_solar_start_power
    - input_number.energyhub_solar_pause_power
    - sensor.powmr_10_2m_battery_soc
    - sensor.powmr_10_2m_grid_voltage
    - sensor.powmr_10_2m_total_pv_power
    - binary_sensor.energyhub_grid_confirmed
  - trigger: state
    entity_id:
    - sensor.energyhub_telemetry_freshness
    - sensor.energyhub_operating_mode
    - sensor.powmr_10_2m_battery_soc
    - input_number.ahm_minimum_soc
    - sensor.powmr_10_2m_total_pv_power
    - sensor.powmr_10_2m_grid_voltage
    for: 00:01:00
  conditions:
  - condition: template
    value_template: "{{ states('input_boolean.energyhub_hp1_manual_hold') in ['on',
      'off']\n   and is_state('input_boolean.energyhub_330_initialized', 'on') }}"
  actions:
  - if:
    - condition: trigger
      id: smart_enabled
    then:
    - action: input_boolean.turn_on
      target:
        entity_id: input_boolean.energyhub_hp1_auto_resume
  - variables:
      enabled: '{{ is_state(''input_boolean.energyhub_smart_heating'', ''on'') }}'
      family_mode: '{{ states(''input_select.energyhub_hp1_family_mode'') }}'
      night_window: '{{ is_state(''binary_sensor.energyhub_hp_night_window'', ''on'')
        }}'
      night_overrides: '{{ states(''input_text.energyhub_hp1_night_overrides'') |
        from_json({}) }}'
      night_stop: '{{ night_window and is_state(''input_select.energyhub_climate_effective_policy'',
        ''Smart'') and is_state(''input_select.energyhub_climate_night_operation'',
        ''Off'') and now().timestamp() >= night_overrides.get(''on_until'', 0) }}'
      quiet_hours: "{% set start = states('input_datetime.energyhub_climate_quiet_start')
        %} {% set end = states('input_datetime.energyhub_climate_quiet_end') %} {%
        set clock = now().strftime('%H:%M:%S') %} {{ is_state('input_boolean.energyhub_climate_quiet_enabled',
        'on')\n   and family_mode in ['heat', 'cool']\n   and not is_state('input_boolean.energyhub_solar_only_heating',
        'on')\n   and start != end and start not in ['unknown', 'unavailable']\n   and
        end not in ['unknown', 'unavailable']\n   and ((start <= clock < end) if start
        < end else (clock >= start or clock < end)) }}"
      solar_only: '{{ is_state(''input_boolean.energyhub_solar_only_heating'', ''on'')
        }}'
      soc: '{{ states(''sensor.powmr_10_2m_battery_soc'') | float(none) }}'
      reserve: '{{ states(''input_number.ahm_minimum_soc'') | float(none) }}'
      pv: '{{ states(''sensor.powmr_10_2m_total_pv_power'') | float(none) }}'
      grid: '{{ states(''sensor.powmr_10_2m_grid_voltage'') | float(none) }}'
      load_pct: '{{ states(''sensor.powmr_10_2m_load'') | float(none) }}'
      hp_age: '{{ now().timestamp() - as_timestamp(states.climate.first_floor_heat_pump.last_changed,
        0) }}'
      battery_fresh: "{{ is_state('sensor.energyhub_telemetry_freshness', 'fresh')\n
        \  and soc is not none and 0 <= soc <= 100 }}"
      fresh: "{{ battery_fresh\n   and reserve is not none and 20 <= reserve <= 95\n
        \  and pv is not none and pv >= 0 and grid is not none and grid >= 0 }}"
      on_battery: '{{ fresh and grid <= 180 }}'
      confirmed_grid: '{{ states(''binary_sensor.energyhub_grid_confirmed'') }}'
      grid_confirmation_ready: "{{ fresh and confirmed_grid in ['on', 'off']\n   and
        state_attr('binary_sensor.energyhub_grid_confirmed', 'confirmation_seconds')
        | float(0) >= 180\n   and 0 <= now().timestamp() - (state_attr('binary_sensor.energyhub_grid_confirmed',
        'checked_at') | float(0)) <= 30\n   and state_attr('binary_sensor.energyhub_grid_confirmed',
        'transition_pending') == false }}"
      grid_ready: '{{ grid_confirmation_ready and confirmed_grid == ''on'' and grid
        > 180 }}'
      eco_needed: '{{ fresh and confirmed_grid == ''off'' }}'
      forecast_hp_start: "{% set e = 'sensor.energyhub_outage_preparation' %} {% set
        minimum = state_attr(e, 'predicted_minimum_soc') | float(-1) %} {{ fresh and
        not solar_only\n   and state_attr(e, 'hp_start_permitted') == true\n   and
        0 <= now().timestamp() - as_timestamp(state_attr(e, 'checked_at'), 0) <= 90\n
        \  and 0 <= now().timestamp() - as_timestamp(state_attr(e, 'forecast_source_at'),
        0) <= states('input_number.energyhub_forecast_max_age_hours') | float(0) *
        3600\n   and reserve is not none and minimum > [40, reserve] | max + 5\n   and
        soc is not none and soc > [40, reserve] | max + 5 }}"
      solar_start_w: '{{ states(''input_number.energyhub_solar_start_power'') | float(none)
        }}'
      solar_pause_w: '{{ states(''input_number.energyhub_solar_pause_power'') | float(none)
        }}'
      solar_thresholds_valid: '{{ solar_start_w is not none and solar_pause_w is not
        none and 0 <= solar_pause_w < solar_start_w <= 10000 }}'
      cycle: '{{ state_attr(''sensor.energyhub_peak_load_guard'', ''cycle'') or {}
        }}'
      pending: '{{ state_attr(''sensor.energyhub_peak_load_guard'', ''pending'') or
        {} }}'
      protected: "{{ states('sensor.energyhub_peak_load_guard') in ['unknown', 'unavailable']\n
        \  or not 0 <= now().timestamp() - as_timestamp(state_attr('sensor.energyhub_peak_load_guard',
        'load_snapshot_at'), 0) <= 90\n   or state_attr('sensor.energyhub_peak_load_guard',
        'fault') is not none\n   or cycle.get('shedding', false) or cycle.get('owned',
        {}) | length > 0\n   or cycle.get('blocked', {}) | length > 0 or pending |
        length > 0\n   or load_pct is none or load_pct >= 50 }}"
      hp_available: "{{ family_mode in ['heat', 'cool']\n   and states('climate.first_floor_heat_pump')
        in ['heat', 'cool', 'off']\n    }}"
      solar_allowed: "{{ fresh and states('sensor.energyhub_operating_mode') == 'solar'\n
        \  and is_state('sun.sun', 'above_horizon')\n   and solar_thresholds_valid\n
        \  and pv >= (solar_pause_w if states('climate.first_floor_heat_pump')
        in ['heat', 'cool'] else solar_start_w)\n   and soc > reserve }}"
      input_loss_age: "{% set ns = namespace(times=[]) %} {% for entity in ['sensor.energyhub_telemetry_freshness',\n
        \                 'sensor.powmr_10_2m_battery_soc',\n                  'input_number.ahm_minimum_soc',\n
        \                 'sensor.powmr_10_2m_total_pv_power',\n                  'sensor.powmr_10_2m_grid_voltage',\n
        \                 'sensor.energyhub_operating_mode'] %}\n  {% if states(entity)
        in ['unknown', 'unavailable'] or\n        (entity == 'sensor.energyhub_telemetry_freshness'
        and states(entity) != 'fresh') %}\n    {% set ns.times = ns.times + [as_timestamp(states[entity].last_changed,
        0)] %}\n  {% endif %}\n{% endfor %} {{ [0, now().timestamp() - (ns.times |
        min)] | max if ns.times else 60 }}"
      solar_inputs_ready: "{{ fresh and solar_thresholds_valid and states('sensor.energyhub_operating_mode')
        not in\n   ['unknown', 'unavailable', 'none', ''] }}"
  - choose:
    - conditions: '{{ is_state(''input_boolean.energyhub_hp1_manual_hold'', ''on'')
        }}'
      sequence:
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.energyhub_hp1_auto_resume
      - action: input_select.select_option
        target:
          entity_id: input_select.energyhub_smart_heating_status
        data:
          option: Manual
    - conditions: '{{ enabled and night_stop and hp_available and fresh and is_state(''input_boolean.energyhub_330_initialized'',
        ''on'') }}'
      sequence:
      - if:
        - condition: template
          value_template: '{{ states(''climate.first_floor_heat_pump'') in [''heat'',
            ''cool''] }}'
        then:
        - action: input_boolean.turn_on
          target:
            entity_id:
            - input_boolean.energyhub_hp1_night_paused
            - input_boolean.energyhub_hp1_auto_resume
        - action: climate.set_hvac_mode
          target:
            entity_id: climate.first_floor_heat_pump
          data:
            hvac_mode: 'off'
      - action: input_select.select_option
        target:
          entity_id: input_select.energyhub_smart_heating_status
        data:
          option: Waiting
    - conditions: '{{ not enabled }}'
      sequence:
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.energyhub_hp1_auto_resume
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.energyhub_hp1_battery_paused
      - action: input_select.select_option
        target:
          entity_id: input_select.energyhub_smart_heating_status
        data:
          option: Manual
    - conditions: "{{ is_state('climate.first_floor_heat_pump', 'off')\n   and
        not is_state('input_boolean.energyhub_hp1_auto_resume', 'on') }}"
      sequence:
      - action: input_select.select_option
        target:
          entity_id: input_select.energyhub_smart_heating_status
        data:
          option: Manual
    - conditions: '{{ on_battery and soc <= states(''input_number.energyhub_load_off_soc'')
        | float(-1) }}'
      sequence:
      - if:
        - condition: template
          value_template: '{{ states(''climate.first_floor_heat_pump'') in [''heat'',
            ''cool''] }}'
        then:
        - action: input_boolean.turn_on
          target:
            entity_id: input_boolean.energyhub_hp1_battery_paused
        - action: input_boolean.turn_on
          target:
            entity_id: input_boolean.energyhub_hp1_auto_resume
        - action: climate.set_hvac_mode
          target:
            entity_id: climate.first_floor_heat_pump
          data:
            hvac_mode: 'off'
      - action: input_select.select_option
        target:
          entity_id: input_select.energyhub_smart_heating_status
        data:
          option: Battery paused
    - conditions: "{{ battery_fresh and is_state('input_boolean.energyhub_hp1_battery_paused',
        'on')\n   and (not fresh or (not grid_ready and soc < states('input_number.energyhub_load_restore_soc')
        | float(101) and not forecast_hp_start)) }}"
      sequence:
      - action: input_select.select_option
        target:
          entity_id: input_select.energyhub_smart_heating_status
        data:
          option: Battery paused
    - conditions: "{{ solar_only and not solar_allowed\n   and ((not solar_inputs_ready
        and input_loss_age >= 60)\n        or (fresh and soc <= reserve)\n        or
        (solar_inputs_ready and (hp_age >= 300\n                       or states('sensor.energyhub_operating_mode')
        != 'solar'))\n        or is_state('sun.sun', 'below_horizon')) }}"
      sequence:
      - if:
        - condition: template
          value_template: '{{ states(''climate.first_floor_heat_pump'') in [''heat'',
            ''cool''] }}'
        then:
        - action: input_boolean.turn_on
          target:
            entity_id: input_boolean.energyhub_hp1_auto_resume
        - action: climate.set_hvac_mode
          target:
            entity_id: climate.first_floor_heat_pump
          data:
            hvac_mode: 'off'
      - action: input_select.select_option
        target:
          entity_id: input_select.energyhub_smart_heating_status
        data:
          option: Solar paused
    - conditions: "{{ night_stop or not hp_available or protected or not fresh\n   or
        (solar_only and not solar_inputs_ready)\n   or (is_state('climate.first_floor_heat_pump',
        'off')\n       and not solar_only and not grid_ready\n       and soc < states('input_number.energyhub_load_restore_soc')
        | float(101)\n       and not forecast_hp_start) }}"
      sequence:
      - action: input_select.select_option
        target:
          entity_id: input_select.energyhub_smart_heating_status
        data:
          option: Waiting
    - conditions: "{{ is_state('climate.first_floor_heat_pump', 'off')\n   and
        hp_age < 300 and trigger.id | default('') != 'smart_enabled' }}"
      sequence:
      - action: input_select.select_option
        target:
          entity_id: input_select.energyhub_smart_heating_status
        data:
          option: Waiting
    default:
    - if:
      - condition: state
        entity_id: climate.first_floor_heat_pump
        state: 'off'
      then:
      - action: climate.set_hvac_mode
        target:
          entity_id: climate.first_floor_heat_pump
        data:
          hvac_mode: '{{ family_mode }}'
      - wait_template: '{{ states(''climate.first_floor_heat_pump'') == family_mode
          }}'
        timeout: 00:00:10
        continue_on_timeout: true
      - if:
        - condition: template
          value_template: '{{ states(''climate.first_floor_heat_pump'') in [''heat'',
            ''cool''] }}'
        then:
        - action: input_boolean.turn_off
          target:
            entity_id: input_boolean.energyhub_hp1_auto_resume
      - condition: template
        value_template: '{{ states(''climate.first_floor_heat_pump'') in [''heat'',
          ''cool''] }}'
    - if:
      - condition: template
        value_template: '{{ states(''climate.first_floor_heat_pump'') in [''heat'',
          ''cool''] }}'
      then:
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.energyhub_hp1_auto_resume
    - action: input_boolean.turn_off
      target:
        entity_id:
        - input_boolean.energyhub_hp1_battery_paused
        - input_boolean.energyhub_hp1_night_paused
    - condition: template
      value_template: '{{ grid_confirmation_ready }}'
    - if: "{{ not (is_state('switch.first_floor_heat_pump_eco', 'on' if eco_needed
        else 'off')\n   and is_state('switch.first_floor_heat_pump_quiet', 'on'
        if quiet_hours and not eco_needed else 'off')) }}"
      then:
      - action: input_select.select_option
        target:
          entity_id: input_select.energyhub_smart_heating_status
        data:
          option: Waiting
    - action: input_text.set_value
      target:
        entity_id: input_text.energyhub_hp1_profile_expected
      data:
        value: '{{ {''quiet'': ''on'' if quiet_hours and not eco_needed else ''off'',
          ''eco'': ''on'' if eco_needed else ''off''} | to_json }}'
    - action: script.energyhub_apply_hp_profile
      data:
        profile: '{{ ''quiet'' if eco_needed else ''eco'' }}'
        desired: 'off'
    - wait_template: '{{ is_state(''switch.first_floor_heat_pump_'' ~ (''quiet''
        if eco_needed else ''eco''), ''off'') }}'
      timeout: 00:00:10
      continue_on_timeout: false
    - action: script.energyhub_apply_hp_profile
      data:
        profile: '{{ ''eco'' if eco_needed else ''quiet'' }}'
        desired: '{{ ''on'' if eco_needed or quiet_hours else ''off'' }}'
    - wait_template: "{{ is_state('switch.first_floor_heat_pump_eco', 'on' if
        eco_needed else 'off')\n   and is_state('switch.first_floor_heat_pump_quiet',
        'on' if quiet_hours and not eco_needed else 'off') }}"
      timeout: 00:00:10
      continue_on_timeout: true
    - action: input_select.select_option
      target:
        entity_id: input_select.energyhub_smart_heating_status
      data:
        option: '{% set eco_ok = is_state(''switch.first_floor_heat_pump_eco'',
          ''on'' if eco_needed else ''off'') %} {% set quiet_ok = is_state(''switch.first_floor_heat_pump_quiet'',
          ''on'' if quiet_hours and not eco_needed else ''off'') %} {{ (''Eco'' if
          eco_needed else (''Quiet'' if quiet_hours else ''Normal'')) if eco_ok and
          quiet_ok else ''Waiting'' }}'
  mode: single
- id: energyhub_battery_full_today
  alias: EnergyHub - Remember Battery Reached Full Today
  description: Tracks whether SOC reached 100% for conservative forecast accuracy
    and EV-potential reporting.
  triggers:
  - trigger: numeric_state
    entity_id: sensor.powmr_10_2m_battery_soc
    above: 99.4
    id: full
  - trigger: time
    at: 00:00:05
    id: reset
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: full
      sequence:
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.energyhub_battery_full_today
    default:
    - action: input_boolean.turn_off
      target:
        entity_id: input_boolean.energyhub_battery_full_today
  mode: single
- id: energyhub_battery_reserve_automatic_apply
  alias: EnergyHub - Apply Automatic Battery Reserve
  description: Applies only a fresh, complete EnergyHub Battery Reserve recommendation.
    Manual mode never writes the family-selected reserve.
  triggers:
  - trigger: state
    entity_id:
    - sensor.energyhub_ahm_weather_buffer
    - input_select.energyhub_ahm_weather_authority
  conditions:
  - condition: state
    entity_id: input_select.energyhub_ahm_weather_authority
    state: Automatic
  - condition: template
    value_template: "{% set e = 'sensor.energyhub_ahm_weather_buffer' %} {% set target
      = state_attr(e, 'recommended_soc') | float(none) %} {% set plan_date = state_attr(e,
      'date') %} {% set preliminary = state_attr(e, 'forecast_plan_stage') == 'preliminary'
      %} {% set evidence_age = now().timestamp() - as_timestamp(state_attr(e, 'control_evidence_at'),
      0) %} {{ states(e) not in ['unknown', 'unavailable']\n   and 0 <= evidence_age
      <= 90\n   and (plan_date == now().date().isoformat()\n        or (preliminary
      and now() >= today_at('23:50')\n            and plan_date == (now().date() +
      timedelta(days=1)).isoformat()))\n   and state_attr(e, 'automatic_control_available')
      == true\n   and state_attr(e, 'daily_plan_fresh') == true\n   and state_attr(e,
      'recommendation_status') == 'ready'\n   and target is not none and 20 <= target
      <= 95 and target % 5 == 0\n   and states('input_number.ahm_minimum_soc') | float(none)
      != target }}"
  actions:
  - action: input_number.set_value
    target:
      entity_id: input_number.ahm_minimum_soc
    data:
      value: '{{ state_attr(''sensor.energyhub_ahm_weather_buffer'', ''recommended_soc'')
        }}'
  mode: restart
- id: '1783245343717'
  alias: EnergyHub - Publish Daily Summary Inputs
  description: Publishes end-of-day forecast and consumption inputs at 23:49 and one
    atomic Daily Summary snapshot at 23:51.
  triggers:
  - trigger: time
    at: '23:49:00'
    id: before_daily_snapshot
  - trigger: time
    at: '23:51:00'
    id: final_daily_snapshot
  conditions: []
  actions:
  - wait_template: "{{ is_number(\n  states('sensor.powmr_10_2m_daily_house_consumption')\n)
      }}"
    timeout: 00:01:30
    continue_on_timeout: false
  - variables:
      daily_house_consumption: '{{ states(''sensor.powmr_10_2m_daily_house_consumption'')
        | float(none) }}'
      solar_forecast_today: '{{ states(''sensor.solcast_pv_forecast_forecast_today'')
        | float(0) }}'
      solar_actual_today: '{{ states(''sensor.total_solar_generated_today'') | float(none)
        }}'
      battery_full_today: '{{ true if is_state(''input_boolean.energyhub_battery_full_today'',
        ''on'') else false if is_state(''input_boolean.energyhub_battery_full_today'',
        ''off'') else none }}'
  - variables:
      battery_recharge_to_full: '{{ ([0, 100 - (states(''sensor.powmr_10_2m_battery_soc'')
        | float(0))] | max) / 100 * 16 / 0.9 }}'
      daily_solar_surplus_estimated: '{{ [0, solar_forecast_today - daily_house_consumption
        - battery_recharge_to_full] | max | round(1) }}'
  - action: mqtt.publish
    data:
      topic: energyhub/input/ha/daily_house_consumption
      payload: '{{ daily_house_consumption }}'
      retain: true
  - action: mqtt.publish
    data:
      topic: energyhub/input/ha/solar_forecast_today
      payload: '{{ solar_forecast_today }}'
      retain: true
  - action: mqtt.publish
    data:
      topic: energyhub/input/ha/solar_forecast_tomorrow
      payload: '{{ states(''sensor.solcast_pv_forecast_forecast_tomorrow'') }}'
      retain: true
  - action: mqtt.publish
    data:
      topic: energyhub/input/ha/daily_solar_surplus_estimated
      payload: '{{ daily_solar_surplus_estimated }}'
      retain: true
  - choose:
    - conditions:
      - condition: trigger
        id: final_daily_snapshot
      sequence:
      - action: mqtt.publish
        data:
          topic: energyhub/input/ha/daily_summary_snapshot
          payload: "{{ {\n  'date': now().strftime('%Y-%m-%d'),\n  'timestamp': as_timestamp(now())
            | int,\n  'daily_house_consumption': daily_house_consumption,\n  'solar_forecast_today':
            \ solar_forecast_today,\n  'solar_forecast_tomorrow': states('sensor.solcast_pv_forecast_forecast_tomorrow'),\n
            \ 'solar_actual_today': solar_actual_today,\n  'battery_full_today': battery_full_today,\n
            \ 'daily_solar_surplus_estimated': daily_solar_surplus_estimated\n} |
            tojson }}"
          retain: true
  mode: single
- id: '1784300000001'
  alias: EnergyHub - Publish Live Solcast Forecasts
  description: Publishes live Solcast forecast changes for EnergyHub decision engines
    without creating Daily Summary snapshots.
  triggers:
  - trigger: state
    entity_id:
    - sensor.solcast_pv_forecast_forecast_today
    - sensor.solcast_pv_forecast_forecast_tomorrow
  - trigger: homeassistant
    event: start
  conditions: []
  actions:
  - delay:
      seconds: 5
  - action: mqtt.publish
    data:
      topic: energyhub/input/ha/solar_forecast_today_live
      payload: '{{ states(''sensor.solcast_pv_forecast_forecast_today'') }}'
      retain: true
  - action: mqtt.publish
    data:
      topic: energyhub/input/ha/solar_forecast_tomorrow_live
      payload: '{{ states(''sensor.solcast_pv_forecast_forecast_tomorrow'') }}'
      retain: true
  mode: restart
- id: '1783697064742'
  alias: EnergyHub - Publish Autopilot State
  description: Publishes the EnergyHub Autopilot helper state to MQTT.
  triggers:
  - trigger: state
    entity_id:
    - input_boolean.energyhub_autopilot
