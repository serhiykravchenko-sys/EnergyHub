- id: '1783953087633'
  alias: EnergyHub - Inverter Transition Failure Alert
  description: Actionable failure only; current strategy is displayed on the dashboard.
  triggers:
  - trigger: mqtt
    topic: energyhub/event/notification
  conditions:
  - condition: template
    value_template: '{{ trigger.payload_json.type | default(''unknown'') == ''automatic_mode_activation_failed''
      and trigger.payload_json.mode | default(''unknown'') == ''panic'' }}'
  actions:
  - variables:
      event: '{{ trigger.payload_json }}'
  - action: persistent_notification.create
    data:
      notification_id: energyhub_panic
      title: 'EnergyHub: Strategy change not confirmed'
      message: 'Requested strategy: {{ event.requested_mode | default(''unknown'')
        }}. Reported strategy at failure: {{ event.current_mode | default(''unknown'')
        }}. Error: {{ event.error | default(''No error detail supplied'') }}. Check
        the current dashboard and inverter connection before retrying.'
  mode: queued
- id: energyhub_load_bridge_start
  alias: EnergyHub - Initialize Load Control Bridge
  triggers:
  - trigger: homeassistant
    event: start
  actions:
  - action: input_text.set_value
    target:
      entity_id: input_text.energyhub_load_bridge_session
    data:
      value: '{{ now().isoformat() }}'
  mode: single
- id: energyhub_load_control_snapshot
  alias: EnergyHub - Load Control Snapshot
  triggers:
  - trigger: time_pattern
    seconds: /10
  conditions:
  - condition: template
    value_template: "{% set cycle = state_attr('sensor.energyhub_peak_load_guard', 'cycle') or {} %} {% set pending\
      \ = state_attr('sensor.energyhub_peak_load_guard', 'pending') %} {{ now().second % 30 == 0\n   or pending\
      \ is mapping\n   or cycle.get('shedding', false)\n   or cycle.get('owned', {}) | count > 0 }}"
  actions:
  - variables:
      hp_settings: '{{ {''temperature'': state_attr(''climate.first_floor_heat_pump'', ''temperature''), ''fan_mode'':
        state_attr(''climate.first_floor_heat_pump'', ''fan_mode''), ''swing_mode'': state_attr(''climate.first_floor_heat_pump'',
        ''swing_mode''), ''eco'': states(''switch.first_floor_heat_pump_eco''), ''quiet'': states(''switch.first_floor_heat_pump_quiet''),
        ''super'': states(''switch.first_floor_heat_pump_super''), ''sleep'': states(''select.first_floor_heat_pump_sleep''),
        ''eight_degree'': states(''switch.first_floor_heat_pump_8_degree_heat'')} }}'
      hp_normal: "{{ hp_settings.eco == 'off' and hp_settings.quiet == 'off'\n   and hp_settings.super == 'off'\
        \ and hp_settings.sleep | lower == 'off'\n   and hp_settings.eight_degree == 'off'\n   and hp_settings.temperature\
        \ | float(-1) >= 16\n   and hp_settings.temperature | float(99) <= 30\n   and hp_settings.fan_mode in ['auto',\
        \ 'lower', 'low', 'medium', 'high', 'higher'] }}"
      bridge_ready: "{{ is_state('automation.energyhub_load_control_executor', 'on')\n   and is_state('automation.energyhub_load_control_external_intents',\
        \ 'on')\n   and states('input_text.energyhub_load_bridge_session') not in ['', 'unknown', 'unavailable']\
        \ }}"
  - action: mqtt.publish
    data:
      topic: energyhub/input/ha/peak_load_control_plugs
      retain: true
      payload: "{{ {\n  'control_schema': 6,\n  'hp1_battery_control_ready': bridge_ready,\n  'hp1_smart_heating_enabled':\
        \ is_state('input_boolean.energyhub_smart_heating', 'on'),\n  'automatic_requested': is_state('input_boolean.energyhub_load_control_armed',\
        \ 'on'),\n  'observed_at': now().isoformat(),\n  'bridge_session': states('input_text.energyhub_load_bridge_session'),\n\
        \  'armed': is_state('input_boolean.energyhub_load_control_armed', 'on') and bridge_ready,\n  'loads': [\n\
        {\n        'key': 'heat_pump_floor_1',\n        'availability': ('online' if states('climate.first_floor_heat_pump')\
        \ in ['heat', 'off'] else 'unavailable'),\n        'state': ('on' if states('climate.first_floor_heat_pump')\
        \ == 'heat' else 'off' if states('climate.first_floor_heat_pump') == 'off' else 'unavailable'),\n\
        \        'state_observed_at': states['climate.first_floor_heat_pump'].last_reported.isoformat() if\
        \ states('climate.first_floor_heat_pump') in ['heat', 'off'] else none,\n        'context_id': states['climate.first_floor_heat_pump'].context.id\
        \ if states('climate.first_floor_heat_pump') in ['heat', 'off'] else none,\n        'intent_revision':\
        \ states('input_number.energyhub_intent_heat_pump_floor_1') | int(-1),\n        'power_w': states('sensor.first_floor_heat_pump_plug_power')\
        \ | float(none),\n        'power_observed_at': states['sensor.first_floor_heat_pump_plug_power'].last_reported.isoformat()\
        \ if states('sensor.first_floor_heat_pump_plug_power') not in ['unknown', 'unavailable'] else none,\n  \
        \      'control_ready': bridge_ready\n            ,\n        'restore_allowed': true,\n        'settings':\
        \ {'temperature': state_attr('climate.first_floor_heat_pump', 'temperature'), 'fan_mode': state_attr('climate.first_floor_heat_pump',\
        \ 'fan_mode'), 'swing_mode': state_attr('climate.first_floor_heat_pump', 'swing_mode'), 'eco': states('switch.first_floor_heat_pump_eco'),\
        \ 'quiet': states('switch.first_floor_heat_pump_quiet'), 'super': states('switch.first_floor_heat_pump_super'),\
        \ 'sleep': states('select.first_floor_heat_pump_sleep'), 'eight_degree': states('switch.first_floor_heat_pump_8_degree_heat')}\n\
        \      }\n]\n} | tojson }}"
  mode: single
- id: energyhub_load_control_external_intents
  alias: EnergyHub - Load Control External Intents
  description: Records control requests including OFF on an already OFF load; no load switching.
  triggers:
  - trigger: event
    event_type: call_service
  conditions:
  - condition: template
    value_template: '{{ trigger.event.data.domain in [''switch'', ''climate'', ''homeassistant'', ''select'', ''number'']
      }}'
  actions:
  - variables:
      targets: "{{ trigger.event.data.get('target', {}).get('entity_id', [])\n   or trigger.event.data.service_data.get('entity_id',\
        \ []) }}"
      target_list: '{{ [targets] if targets is string else targets }}'
      mapping:
        heat_pump_floor_1: climate.first_floor_heat_pump
      keys: "{% set ns = namespace(keys=[]) %} {% for key, entity in mapping.items() %}\n  {% if 'all' in target_list\
        \ or entity in target_list\n     or (key == 'heat_pump_floor_1' and\n       (target_list | select('search',\
        \ 'first_floor_heat_pump') | list | length > 0)) %}\n    {% set ns.keys = ns.keys + [key] %}\n  {%\
        \ endif %}\n{% endfor %} {{ ns.keys }}"
  - condition: template
    value_template: '{{ keys | length > 0 }}'
  - repeat:
      for_each: '{{ keys }}'
      sequence:
      - action: input_number.increment
        target:
          entity_id: '{{ ''input_number.energyhub_intent_'' ~ repeat.item }}'
  - action: mqtt.publish
    data:
      topic: energyhub/input/ha/peak_load_guard_intent
      retain: false
      payload: "{{ {'context_id': trigger.event.context.id, 'keys': keys,\n    'observed_at': now().isoformat()}\
        \ | tojson }}"
  mode: queued
  max: 100
- id: energyhub_load_control_executor
  alias: EnergyHub - First-floor HP Protection Executor
  description: First-floor HP battery commands only; allow-listed, expiring and independently state-checked.
  triggers:
  - trigger: mqtt
    topic: energyhub/control/peak_load_guard
  actions:
  - variables:
      cmd: '{{ trigger.payload_json }}'
      mapping:
        heat_pump_floor_1: climate.first_floor_heat_pump
      entity: '{{ mapping.get(cmd.get(''key''), '''') }}'
      hp_settings: '{{ {''temperature'': state_attr(''climate.first_floor_heat_pump'', ''temperature''), ''fan_mode'':
        state_attr(''climate.first_floor_heat_pump'', ''fan_mode''), ''swing_mode'': state_attr(''climate.first_floor_heat_pump'',
        ''swing_mode''), ''eco'': states(''switch.first_floor_heat_pump_eco''), ''quiet'': states(''switch.first_floor_heat_pump_quiet''),
        ''super'': states(''switch.first_floor_heat_pump_super''), ''sleep'': states(''select.first_floor_heat_pump_sleep''),
        ''eight_degree'': states(''switch.first_floor_heat_pump_8_degree_heat'')} }}'
      load_pct: '{{ states(''sensor.powmr_10_2m_load'') | float(-1) }}'
      load_w: '{{ states(''sensor.powmr_10_2m_output_power'') | float(-1) }}'
      battery_soc: '{{ states(''sensor.powmr_10_2m_battery_soc'') | float(-1) }}'
      grid_voltage: '{{ states(''sensor.powmr_10_2m_grid_voltage'') | float(-1) }}'
      battery_evidence_fresh: "{{ is_state('sensor.energyhub_telemetry_freshness', 'fresh')\n   and 0 <= battery_soc <= 100\
        \ and grid_voltage >= 0\n   and 0 <= now().timestamp() - as_timestamp(states['sensor.powmr_10_2m_battery_soc'].last_reported,\
        \ 0) <= 30\n   and 0 <= now().timestamp() - as_timestamp(states['sensor.powmr_10_2m_grid_voltage'].last_reported,\
        \ 0) <= 30 }}"
      hp1_battery_recovered: "{{ battery_evidence_fresh and\n   (battery_soc >= states('input_number.energyhub_load_restore_soc')\
        \ | float(101)\n    or (grid_voltage > 180\n        and is_state('binary_sensor.energyhub_grid_confirmed', 'on')\n\
        \        and state_attr('binary_sensor.energyhub_grid_confirmed', 'confirmation_seconds') | float(0) >= 180\n    \
        \    and state_attr('binary_sensor.energyhub_grid_confirmed', 'transition_pending') == false\n        and 0 <= now().timestamp()\
        \ - (state_attr('binary_sensor.energyhub_grid_confirmed', 'checked_at') | float(0)) <= 30)\n    or (cmd.key == 'heat_pump_floor_1'\n\
        \        and cmd.get('restore_profile') == 'eco'\n        and is_state('input_boolean.energyhub_smart_heating', 'on')\n\
        \        and grid_voltage <= 180 and battery_soc >= 50)) }}"
  - condition: template
    value_template: "{{ cmd is mapping and cmd.get(\"reason\") == \"battery\" and cmd.get(\"key\") == \"heat_pump_floor_1\"\
      \ and cmd.get('control_schema') == 6 and cmd.get('action') in ['shed', 'restore']\n   and entity != ''\n   and cmd.get('command_id',\
      \ '') != '' and cmd.command_id != states('input_text.energyhub_load_last_command')\n   and cmd.get('bridge_session')\
      \ == states('input_text.energyhub_load_bridge_session')\n   and now().timestamp() <= cmd.get('expires_at', 0) | float(0)\n\
      \   and 0 <= now().timestamp() - as_timestamp(cmd.get('issued_at'), 0) <= 20\n   and is_state('sensor.energyhub_telemetry_freshness',\
      \ 'fresh')\n   and 0 <= now().timestamp() - as_timestamp(states['sensor.powmr_10_2m_load'].last_reported, 0) <= 30\n\
      \   and 0 <= now().timestamp() - as_timestamp(states['sensor.powmr_10_2m_output_power'].last_reported, 0) <= 30\n  \
      \ and states[entity].context.id == cmd.get('expected_context')\n   and states('input_number.energyhub_intent_' ~ cmd.key)\
      \ | int(-1) == cmd.get('expected_revision')\n   and (('off' if states(entity) == 'off' else 'on' if states(entity) in\
      \ ['on', 'heat', 'cool'] else 'unknown') == cmd.get('expected_state'))\n   and (cmd.key != 'heat_pump_floor_1' or (\n\
      \        (cmd.action == 'shed' or (states('input_select.energyhub_hp1_family_mode') in ['heat', 'cool']\n          \
      \ and is_state('input_boolean.energyhub_hp1_manual_hold', 'off')\n           and not (is_state('binary_sensor.energyhub_hp_night_window',\
      \ 'on')\n                    and is_state('input_select.energyhub_climate_night_operation', 'Off'))))\n        and hp_settings\
      \ == cmd.expected_settings\n        )) }}"
  - condition: template
    value_template: '{{ cmd.reason == ''battery'' and cmd.key == ''heat_pump_floor_1'' and ((cmd.action == ''shed'' and battery_evidence_fresh
      and grid_voltage <= 180 and (battery_soc <= states(''input_number.energyhub_load_off_soc'') | float(-1) or (cmd.get(''battery_locked'')
      == true and battery_soc < states(''input_number.energyhub_load_restore_soc'') | float(-1)))) or (cmd.action == ''restore''
      and load_pct >= 0 and load_pct < 50 and load_w >= 0 and hp1_battery_recovered)) }}'
  - action: input_text.set_value
    target:
      entity_id: input_text.energyhub_load_last_command
    data:
      value: '{{ cmd.command_id }}'
  - choose:
    - conditions: '{{ cmd.key == ''heat_pump_floor_1'' }}'
      sequence:
      - action: climate.set_hvac_mode
        target:
          entity_id: climate.first_floor_heat_pump
        data:
          hvac_mode: '{{ ''off'' if cmd.action == ''shed'' else states(''input_select.energyhub_hp1_family_mode'') }}'
      - if:
        - condition: template
          value_template: '{{ cmd.action == ''restore'' and cmd.get(''restore_profile'') == ''eco'' }}'
        then:
        - action: switch.turn_off
          target:
            entity_id: switch.first_floor_heat_pump_super
        - action: script.energyhub_apply_hp_profile
          data:
            profile: quiet
            desired: 'off'
        - wait_template: '{{ is_state(''switch.first_floor_heat_pump_quiet'', ''off'') }}'
          timeout: 00:00:10
          continue_on_timeout: false
        - action: script.energyhub_apply_hp_profile
          data:
            profile: eco
            desired: 'on'
  - wait_template: "{{ states(entity) == ('off' if cmd.action == 'shed' else states('input_select.energyhub_hp1_family_mode')\
      \ if cmd.key == 'heat_pump_floor_1' else 'on')\n   and (cmd.get('restore_profile') != 'eco'\n        or is_state('switch.first_floor_heat_pump_eco',\
      \ 'on')) }}"
    timeout:
      seconds: 8
    continue_on_timeout: true
  - action: mqtt.publish
    data:
      topic: energyhub/input/ha/peak_load_guard_ack
      retain: false
      payload: "{{ {'command_id': cmd.command_id, 'bridge_session': cmd.bridge_session,\n    'result': 'accepted' if wait.completed\
        \ else 'unconfirmed',\n    'context_id': states[entity].context.id, 'observed_at': now().isoformat()} | tojson }}"
  mode: single
- id: '1786023000017'
  alias: EnergyHub 2.4 - Publish Battery Reserve Forecast Inputs
  description: Publishes a preliminary next-day forecast plan at 23:52 after the completed
    Daily Summary, replaces it with the updated current-day forecast at 05:00, and
    republishes authority/current reserve changes without replacing the dated forecast.
    EnergyHub combines it with up to three valid completed consumption days, live
    Grid Confidence and official UHMC warnings.
  triggers:
  - trigger: time
    at: '23:52:00'
    id: preliminary_next_day
  - trigger: time
    at: 05:00:00
    id: morning_revision
  - trigger: homeassistant
    event: start
    id: startup
  - trigger: state
    entity_id:
    - input_select.energyhub_ahm_weather_authority
    - input_number.ahm_minimum_soc
    - input_boolean.energyhub_smart_heating
    - sensor.solcast_pv_forecast_forecast_today
    id: setting_changed
  actions:
  - if:
    - condition: trigger
      id: startup
    then:
    - delay:
        seconds: 15
  - variables:
      preliminary: '{{ trigger.id | default(''refresh'') == ''preliminary_next_day''
        }}'
      retained_preliminary: "{{ not preliminary\n   and state_attr('sensor.energyhub_ahm_weather_buffer',
        'forecast_plan_stage') == 'preliminary'\n   and state_attr('sensor.energyhub_ahm_weather_buffer',
        'date') ==\n     (now().date() + timedelta(days=1)).isoformat()\n   and now()
        >= today_at('23:50') }}"
      plan_stage: "{{ 'preliminary' if preliminary else\n   'morning' if trigger.id
        | default('refresh') == 'morning_revision'\n   else 'refresh' }}"
      plan_date: "{{ (now().date() + timedelta(days=1)).isoformat()\n   if preliminary
        or retained_preliminary else now().date().isoformat() }}"
      forecast_entity: "{{ 'sensor.solcast_pv_forecast_forecast_tomorrow'\n   if preliminary
        or retained_preliminary\n   else 'sensor.solcast_pv_forecast_forecast_today'
        }}"
  - action: mqtt.publish
    data:
      topic: energyhub/input/ha/weather_buffer_forecast
      retain: true
      payload: "{{ {\n  'date': plan_date,\n  'observed_at': now().isoformat(),\n
        \ 'mode': states('input_select.energyhub_ahm_weather_authority'),\n  'applied_minimum_soc':
        states('input_number.ahm_minimum_soc') | float(none),\n  'evaluation_reason':
        trigger.id | default('manual'),\n  'forecast_plan_stage': plan_stage,\n  'source_entity':
        forecast_entity,\n  'solar_forecast_kwh': states(forecast_entity) | float(none)\n}
        | tojson }}"
  mode: restart
- id: energyhub_battery_discharge_protection
  alias: EnergyHub Battery Discharge Protection (40-50%)
  description: Real grid/SOC events only. Save original plug states; shared HA overload interlock defers restoration
    without replaying manual OFF states. Fresh grid evidence, not unchanged-value timestamps; genuine events wait
    at most two minutes and recheck current conditions. No startup reconciliation.
  triggers:
  - trigger: numeric_state
    entity_id: sensor.powmr_10_2m_battery_soc
    below: 40
    id: low_soc
  - trigger: numeric_state
    entity_id: sensor.powmr_10_2m_battery_soc
    above: 50
    id: recovered_soc
  - trigger: state
    entity_id: binary_sensor.energyhub_grid_confirmed
    to: 'off'
    id: grid_lost
    from: 'on'
  - trigger: state
    entity_id: binary_sensor.energyhub_grid_confirmed
    to: 'on'
    id: grid_returned
    from: 'off'
  conditions:
  - condition: template
    value_template: "{% set cause = trigger.id | default('') if trigger is defined else '' %}\n{% set before = trigger.from_state.state\
      \ if trigger is defined and trigger.from_state is not none else '' %}\n{% set after = trigger.to_state.state\
      \ if trigger is defined and trigger.to_state is not none else '' %}\n{% set old = before | float(none) %}\n\
      {{ (cause == 'grid_lost' and before == 'on' and after == 'off')\n   or (cause == 'grid_returned' and before\
      \ == 'off' and after == 'on')\n   or (old is number and 0 <= old <= 100 and soc_valid\n       and ((cause\
      \ == 'low_soc' and old >= 40 and soc < 40)\n            or (cause == 'recovered_soc' and old <= 50 and soc\
      \ > 50))) }}"
  actions:
  - wait_template: "{% set voltage = states('sensor.powmr_10_2m_grid_voltage') | float(none) %}\n{{ is_state('sensor.energyhub_telemetry_freshness',\
      \ 'fresh')\n   and states('binary_sensor.energyhub_grid_confirmed') in ['on', 'off'] and voltage is number\
      \ and voltage >= 0\n   and ((states('binary_sensor.energyhub_grid_confirmed') == 'on' and voltage > 180) or\
      \ (states('binary_sensor.energyhub_grid_confirmed') == 'off' and voltage <= 180))\n   and state_attr('binary_sensor.energyhub_grid_confirmed',\
      \ 'confirmation_seconds') | float(0) >= 180\n   and state_attr('binary_sensor.energyhub_grid_confirmed', 'transition_pending')\
      \ == false\n   and 0 <= now().timestamp() - (state_attr('binary_sensor.energyhub_grid_confirmed', 'checked_at')\
      \ | float(0)) <= 30 }}"
    timeout: 00:02:00
    continue_on_timeout: false
  - variables:
      soc: '{{ states(''sensor.powmr_10_2m_battery_soc'') | float(none) }}'
      soc_valid: '{{ soc is number and 0 <= soc <= 100 }}'
      grid_state: '{{ states(''binary_sensor.energyhub_grid_confirmed'') }}'
      grid_valid: "{% set voltage = states('sensor.powmr_10_2m_grid_voltage') | float(none) %}\n{{ is_state('sensor.energyhub_telemetry_freshness',\
        \ 'fresh')\n   and grid_state in ['on', 'off'] and voltage is number and voltage >= 0\n   and ((grid_state\
        \ == 'on' and voltage > 180) or (grid_state == 'off' and voltage <= 180))\n   and state_attr('binary_sensor.energyhub_grid_confirmed',\
        \ 'confirmation_seconds') | float(0) >= 180\n   and state_attr('binary_sensor.energyhub_grid_confirmed',\
        \ 'transition_pending') == false\n   and 0 <= now().timestamp() - (state_attr('binary_sensor.energyhub_grid_confirmed',\
        \ 'checked_at') | float(0)) <= 30 }}"
  - condition: template
    value_template: '{{ grid_valid }}'
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ trigger.id in [''low_soc'', ''grid_lost''] and grid_state == ''off'' and soc_valid and
          soc < 40 }}'
      sequence:
      - action: script.energyhub_battery_save_and_stop
    - conditions:
      - condition: template
        value_template: '{{ (trigger.id == ''grid_returned'' and grid_state == ''on'') or (trigger.id == ''recovered_soc''
          and grid_state == ''off'' and soc_valid and soc > 50) }}'
      sequence:
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.energyhub_battery_plugs_blocked
      - action: script.energyhub_battery_restore_saved
  mode: restart
  variables:
    soc: '{{ states(''sensor.powmr_10_2m_battery_soc'') | float(none) }}'
    soc_valid: '{{ soc is number and 0 <= soc <= 100 }}'
    grid_state: '{{ states(''binary_sensor.energyhub_grid_confirmed'') }}'
    grid_valid: "{% set voltage = states('sensor.powmr_10_2m_grid_voltage') | float(none) %}\n{{ is_state('sensor.energyhub_telemetry_freshness',\
      \ 'fresh')\n   and grid_state in ['on', 'off'] and voltage is number and voltage >= 0\n   and ((grid_state\
      \ == 'on' and voltage > 180) or (grid_state == 'off' and voltage <= 180))\n   and state_attr('binary_sensor.energyhub_grid_confirmed',\
      \ 'confirmation_seconds') | float(0) >= 180\n   and state_attr('binary_sensor.energyhub_grid_confirmed', 'transition_pending')\
      \ == false\n   and 0 <= now().timestamp() - (state_attr('binary_sensor.energyhub_grid_confirmed', 'checked_at')\
      \ | float(0)) <= 30 }}"
- id: energyhub_fridge_battery_protection
  alias: EnergyHub Fridge Battery Protection (20-30%)
  description: Real grid/SOC crossings only. Restore the fridge only if this rule owned its OFF state; preserve
    pre-existing manual OFF and persist ownership across restart. Fresh grid evidence, not unchanged-value timestamps;
    genuine events wait at most two minutes and recheck current conditions. No startup reconciliation.
  triggers:
  - trigger: numeric_state
    entity_id: sensor.powmr_10_2m_battery_soc
    below: 20
    id: low_soc
  - trigger: numeric_state
    entity_id: sensor.powmr_10_2m_battery_soc
    above: 30
    id: recovered_soc
  - trigger: state
    entity_id: binary_sensor.energyhub_grid_confirmed
    to: 'off'
    id: grid_lost
    from: 'on'
  - trigger: state
    entity_id: binary_sensor.energyhub_grid_confirmed
    to: 'on'
    id: grid_returned
    from: 'off'
  conditions:
  - condition: template
    value_template: "{% set cause = trigger.id | default('') if trigger is defined else '' %}\n{% set before = trigger.from_state.state\
      \ if trigger is defined and trigger.from_state is not none else '' %}\n{% set after = trigger.to_state.state\
      \ if trigger is defined and trigger.to_state is not none else '' %}\n{% set old = before | float(none) %}\n\
      {{ (cause == 'grid_lost' and before == 'on' and after == 'off')\n   or (cause == 'grid_returned' and before\
      \ == 'off' and after == 'on')\n   or (old is number and 0 <= old <= 100 and soc_valid\n       and ((cause\
      \ == 'low_soc' and old >= 20 and soc < 20)\n            or (cause == 'recovered_soc' and old <= 30 and soc\
      \ > 30))) }}"
  actions:
  - wait_template: "{% set voltage = states('sensor.powmr_10_2m_grid_voltage') | float(none) %}\n{{ is_state('sensor.energyhub_telemetry_freshness',\
      \ 'fresh')\n   and states('binary_sensor.energyhub_grid_confirmed') in ['on', 'off'] and voltage is number\
      \ and voltage >= 0\n   and ((states('binary_sensor.energyhub_grid_confirmed') == 'on' and voltage > 180) or\
      \ (states('binary_sensor.energyhub_grid_confirmed') == 'off' and voltage <= 180))\n   and state_attr('binary_sensor.energyhub_grid_confirmed',\
      \ 'confirmation_seconds') | float(0) >= 180\n   and state_attr('binary_sensor.energyhub_grid_confirmed', 'transition_pending')\
      \ == false\n   and 0 <= now().timestamp() - (state_attr('binary_sensor.energyhub_grid_confirmed', 'checked_at')\
      \ | float(0)) <= 30 }}"
    timeout: 00:02:00
    continue_on_timeout: false
  - variables:
      soc: '{{ states(''sensor.powmr_10_2m_battery_soc'') | float(none) }}'
      soc_valid: '{{ soc is number and 0 <= soc <= 100 }}'
      grid_state: '{{ states(''binary_sensor.energyhub_grid_confirmed'') }}'
      grid_valid: "{% set voltage = states('sensor.powmr_10_2m_grid_voltage') | float(none) %}\n{{ is_state('sensor.energyhub_telemetry_freshness',\
        \ 'fresh')\n   and grid_state in ['on', 'off'] and voltage is number and voltage >= 0\n   and ((grid_state\
        \ == 'on' and voltage > 180) or (grid_state == 'off' and voltage <= 180))\n   and state_attr('binary_sensor.energyhub_grid_confirmed',\
        \ 'confirmation_seconds') | float(0) >= 180\n   and state_attr('binary_sensor.energyhub_grid_confirmed',\
        \ 'transition_pending') == false\n   and 0 <= now().timestamp() - (state_attr('binary_sensor.energyhub_grid_confirmed',\
        \ 'checked_at') | float(0)) <= 30 }}"
  - condition: template
    value_template: '{{ grid_valid }}'
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ trigger.id in [''low_soc'', ''grid_lost''] and grid_state == ''off'' and soc_valid and
          soc < 20 }}'
      - condition: switch.is_on
        target:
          entity_id: switch.first_floor_hp_meter
        options:
          behavior: any
          for: 00:00:00
      sequence:
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.energyhub_fridge_owned_off
      - action: switch.turn_off
        metadata: {}
        target:
          entity_id: switch.first_floor_hp_meter
        data: {}
        continue_on_error: true
      - action: notify.send_message
        metadata: {}
        target:
          entity_id: notify.energyhub_family_telegram
        data:
          message: 🔋 Батарея нижче 20%, ДТЕК недоступний. Надіслано команду вимкнути розетку холодильника.
        continue_on_error: true
    - conditions:
      - condition: template
        value_template: '{{ (trigger.id == ''grid_returned'' and grid_state == ''on'') or (trigger.id == ''recovered_soc''
          and grid_state == ''off'' and soc_valid and soc > 30) }}'
      - condition: state
        entity_id: input_boolean.energyhub_fridge_owned_off
        state: 'on'
      sequence:
      - if:
        - condition: state
          entity_id: switch.first_floor_hp_meter
          state: 'off'
        then:
        - action: switch.turn_on
          metadata: {}
          target:
            entity_id: switch.first_floor_hp_meter
          data: {}
          continue_on_error: true
        - action: notify.send_message
          metadata: {}
          data:
            message: '🔌 Відновлення після захисту батареї: надіслано команду увімкнути розетку холодильника.'
          target:
            entity_id: notify.energyhub_family_telegram
          continue_on_error: true
      - if:
        - condition: template
          value_template: '{{ states(''switch.first_floor_hp_meter'') in [''on'', ''off''] }}'
        then:
        - action: input_boolean.turn_off
          target:
            entity_id: input_boolean.energyhub_fridge_owned_off
  mode: restart
  variables:
    soc: '{{ states(''sensor.powmr_10_2m_battery_soc'') | float(none) }}'
    soc_valid: '{{ soc is number and 0 <= soc <= 100 }}'
    grid_state: '{{ states(''binary_sensor.energyhub_grid_confirmed'') }}'
    grid_valid: "{% set voltage = states('sensor.powmr_10_2m_grid_voltage') | float(none) %}\n{{ is_state('sensor.energyhub_telemetry_freshness',\
      \ 'fresh')\n   and grid_state in ['on', 'off'] and voltage is number and voltage >= 0\n   and ((grid_state\
      \ == 'on' and voltage > 180) or (grid_state == 'off' and voltage <= 180))\n   and state_attr('binary_sensor.energyhub_grid_confirmed',\
      \ 'confirmation_seconds') | float(0) >= 180\n   and state_attr('binary_sensor.energyhub_grid_confirmed', 'transition_pending')\
      \ == false\n   and 0 <= now().timestamp() - (state_attr('binary_sensor.energyhub_grid_confirmed', 'checked_at')\
      \ | float(0)) <= 30 }}"
