              if states('input_boolean.energyhub_water_boiler_soc_lockout') in ['on', 'off']
              and states('input_boolean.energyhub_heat_pump_soc_lockout') in ['on', 'off'] else none,
          'automatic_requested': is_state('input_boolean.energyhub_load_control_armed', 'on'),
          'smart_heating_enabled': is_state('input_boolean.energyhub_smart_heating', 'on'),
          'observed_at': now().isoformat(),
