          {% endif %}
          {% if ns.useful_solar_start is none
            and item.pv_estimate | float(0) >= 0.3 %}
            {% set ns.useful_solar_start = period %}
          {% endif %}
        {% endfor %}
        {% if ns.useful_solar_start is not none %}
          {% set morning_hours = [0,
            (as_timestamp(ns.useful_solar_start)
            - as_timestamp(morning_start)) / 3600] | max %}
          {{ {
            'morning_hours': morning_hours | round(2),
            'useful_solar_start':
              ns.useful_solar_start.strftime('%H:%M'),
            'solar_after_07_kwh': ns.solar_after_07 | round(2)
          } | tojson }}
        {% else %}
          {{ {
            'morning_hours': 5,
            'useful_solar_start': 'fallback 12:00',
            'solar_after_07_kwh': ns.solar_after_07 | round(2)
          } | tojson }}
        {% endif %}
      retain: true
  mode: restart
- id: '1783697064742'
  alias: EnergyHub - Publish Autopilot State
  description: Publishes the EnergyHub Autopilot helper state to MQTT.
  triggers:
