  mode: restart
- id: '1786500000001'
  alias: EnergyHub - Publish Battery Reserve Minimum SOC
  description: Publishes the selected Battery Reserve minimum SOC to EnergyHub.
  triggers:
  - trigger: state
    entity_id: input_number.ahm_minimum_soc
  - trigger: homeassistant
