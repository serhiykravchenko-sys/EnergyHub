- id: '1783245343717'
  alias: EnergyHub - Publish Daily Summary Inputs
  description: Publishes end-of-day forecast and consumption inputs at 23:49 and
    one atomic Daily Summary snapshot at 23:51.
  triggers:
  - trigger: time
    at: '23:49:00'
    id: before_daily_snapshot
  - trigger: time
    at: '23:51:00'
    id: final_daily_snapshot
  conditions: []
  actions:
  - wait_template: >-
      {{ is_number(
        states('sensor.powmr_10_2m_daily_house_consumption')
      ) }}
    timeout: 00:01:30
    continue_on_timeout: false
  - variables:
      daily_house_consumption: '{{ states(''sensor.powmr_10_2m_daily_house_consumption'')
        | float(none) }}'
      solar_forecast_today: '{{ states(''sensor.solcast_pv_forecast_forecast_today'')
        | float(0) }}'
      solar_actual_today: '{{ states(''sensor.energyhub_total_solar_generation_daily'')
        | float(none) }}'
      battery_full_today: '{{ is_state(''input_boolean.energyhub_battery_full_today'', ''on'') }}'
  - variables:
      battery_recharge_to_full: '{{ ([0, 100 - (states(''sensor.powmr_10_2m_battery_soc'') | float(0))] | max) / 100 * 16 / 0.9 }}'
      daily_solar_surplus_estimated: '{{ [0, solar_forecast_today - daily_house_consumption - battery_recharge_to_full]
        | max | round(1) }}'
  - action: mqtt.publish
    data:
      topic: energyhub/input/ha/daily_house_consumption
      payload: '{{ daily_house_consumption }}'
      retain: true
  - action: mqtt.publish
    data:
      topic: energyhub/input/ha/solar_forecast_today
      payload: '{{ solar_forecast_today }}'
      retain: true
  - action: mqtt.publish
    data:
      topic: energyhub/input/ha/solar_forecast_tomorrow
      payload: '{{ states(''sensor.solcast_pv_forecast_forecast_tomorrow'') }}'
      retain: true
  - action: mqtt.publish
    data:
      topic: energyhub/input/ha/daily_solar_surplus_estimated
      payload: '{{ daily_solar_surplus_estimated }}'
      retain: true
  - choose:
    - conditions:
      - condition: trigger
        id: final_daily_snapshot
      sequence:
      - action: mqtt.publish
        data:
          topic: energyhub/input/ha/daily_summary_snapshot
          payload: "{{ {\n  'date': now().strftime('%Y-%m-%d'),\n  'timestamp': as_timestamp(now())
            | int,\n  'daily_house_consumption': daily_house_consumption,\n  'solar_forecast_today':
            \ solar_forecast_today,\n
            \ 'solar_forecast_tomorrow': states('sensor.solcast_pv_forecast_forecast_tomorrow'),\n
            \ 'solar_actual_today': solar_actual_today,\n
            \ 'battery_full_today': battery_full_today,\n
            \ 'daily_solar_surplus_estimated': daily_solar_surplus_estimated\n}
            | tojson }}"
          retain: true
  mode: single
- id: '1784300000001'
  alias: EnergyHub - Publish Live Solcast Forecasts
  description: Publishes live Solcast forecast changes for EnergyHub decision engines
    without creating Daily Summary snapshots.
  triggers:
