- id: '1786100000101'
  alias: EnergyHub - Zigbee2MQTT Bridge Offline Alert
  description: Alert when the retained Zigbee2MQTT bridge state remains offline; never restart or toggle a device
  triggers:
  - trigger: state
    entity_id: binary_sensor.zigbee2mqtt_bridge_connection_state
    to: 'off'
    for: 00:02:00
  actions:
  - action: persistent_notification.create
    data:
      notification_id: energyhub_zigbee2mqtt_bridge_offline
      title: EnergyHub - Zigbee2MQTT bridge offline
      message: >-
        Zigbee2MQTT has remained offline for at least 2 minutes since
        {{ as_local(trigger.to_state.last_changed).strftime('%Y-%m-%d %H:%M:%S') }}.
        Smart-plug availability and electrical readings may be stale. No automatic
        restart or relay command was attempted. Inspect the Zigbee2MQTT and
        Supervisor logs before an attended recovery.
  mode: single
- id: '1786100000102'
  alias: EnergyHub - Zigbee2MQTT Bridge Recovery Alert
  description: Report bridge transport recovery without treating retained device telemetry as fresh
  triggers:
  - trigger: state
    entity_id: binary_sensor.zigbee2mqtt_bridge_connection_state
    from: 'off'
    to: 'on'
  actions:
  - action: persistent_notification.dismiss
    data:
      notification_id: energyhub_zigbee2mqtt_bridge_offline
  - if:
    - condition: template
      value_template: >-
        {{ trigger.from_state is not none
           and trigger.to_state is not none
           and as_timestamp(trigger.to_state.last_changed)
               - as_timestamp(trigger.from_state.last_changed) >= 120 }}
    then:
    - action: persistent_notification.create
      data:
        notification_id: energyhub_zigbee2mqtt_bridge_recovered
        title: EnergyHub - Zigbee2MQTT bridge online
        message: >-
          Zigbee2MQTT reported online at
          {{ as_local(trigger.to_state.last_changed).strftime('%Y-%m-%d %H:%M:%S') }}
          after an interruption of at least 2 minutes. Confirm each required
          device is available and has supplied fresh post-recovery telemetry
          before trusting measurements or resuming automation. No relay command
          was issued by this health automation.
  mode: single
- id: '1781793005552'
  alias: EnergyHub Beacon
  description: 'Color shows battery reserve. Brightness and animation show the real
    electrical state. Smart Heating pulses white, or yellow in Solar-only mode.
    Solid white means EnergyHub telemetry has stopped.

    '
  triggers:
  - trigger: state
    entity_id:
    - sensor.powmr_10_2m_battery_soc
    - sensor.powmr_10_2m_grid_voltage
    - sensor.powmr_10_2m_output_power
    - sensor.energyhub_output_source_priority
    - sensor.energyhub_telemetry_freshness
    - timer.energyhub_smart_heating_beacon_pulse
  - trigger: time_pattern
    minutes: /1
  - trigger: homeassistant
    event: start
  actions:
  - variables:
      soc: '{{ states(''sensor.powmr_10_2m_battery_soc'') | float(-1) }}

        '
      grid_voltage: '{{ states(''sensor.powmr_10_2m_grid_voltage'') | float(0) }}

        '
      grid_available: '{{ grid_voltage > 180 }}

        '
      output_source_priority: '{{ states(''sensor.energyhub_output_source_priority'')
        | upper }}

        '
      using_grid_intentionally: '{{ output_source_priority == ''SUB'' }}

        '
      freshness_state: '{{ states(''sensor.energyhub_telemetry_freshness'') | lower
        }}

        '
      output_power_age_seconds: "{{\n  as_timestamp(now())\n  -\n  as_timestamp(\n
        \   states.sensor.powmr_10_2m_output_power.last_reported,\n    0\n  )\n}}\n"
      telemetry_ok: "{{\n  freshness_state == 'fresh'\n  and output_power_age_seconds
        < 90\n}}\n"
      lamp_color: "{% if soc >= 95 %}\n  [0, 80, 255]\n{% elif soc >= 70 %}\n  [0,
        255, 0]\n{% elif soc > 40 %}\n  [255, 220, 0]\n{% else %}\n  [220,
        20, 30]\n{% endif %}\n"
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ not telemetry_ok }}'
      sequence:
      - action: light.turn_on
        continue_on_error: true
        target:
          entity_id: light.colorful_pir_night_light
        data:
          brightness_pct: 40
          rgb_color:
          - 255
          - 255
          - 255
    - conditions:
      - condition: template
        value_template: >-
          {{ telemetry_ok
             and is_state('timer.energyhub_smart_heating_beacon_pulse', 'active') }}
      sequence:
      - action: light.turn_on
        continue_on_error: true
        target:
          entity_id: light.colorful_pir_night_light
        data:
          brightness_pct: 100
          rgb_color: >-
            {{ [255, 220, 0]
               if is_state('input_boolean.energyhub_solar_only_heating', 'on')
               else [255, 255, 255] }}
    - conditions:
      - condition: template
        value_template: '{{ telemetry_ok and soc >= 0 and soc <= 30 and not grid_available }}

          '
      sequence:
      - repeat:
          while:
          - condition: template
            value_template: "{{ states('sensor.powmr_10_2m_battery_soc') | float(100) <= 30 }}"
          - condition: template
            value_template: "{{ states('sensor.powmr_10_2m_grid_voltage') | float(0) <= 180 }}"
          - condition: template
            value_template: "{{ states('sensor.energyhub_telemetry_freshness') | lower == 'fresh' }}"
          sequence:
          - action: light.turn_on
            continue_on_error: true
            target:
              entity_id: light.colorful_pir_night_light
            data:
              brightness_pct: 50
              rgb_color: [220, 20, 30]
          - delay: 00:00:02
          - action: light.turn_on
            continue_on_error: true
            target:
              entity_id: light.colorful_pir_night_light
            data:
              brightness_pct: 50
              rgb_color: [90, 0, 25]
          - delay: 00:00:02
    - conditions:
      - condition: template
        value_template: '{{ telemetry_ok and soc > 30 and not grid_available }}'
      sequence:
      - repeat:
          while:
          - condition: template
            value_template: "{{ states('sensor.powmr_10_2m_grid_voltage') | float(0) <= 180 }}"
          - condition: template
            value_template: "{{ states('sensor.powmr_10_2m_battery_soc') | float(0) > 30 }}"
          - condition: template
            value_template: "{{\n  states('sensor.energyhub_telemetry_freshness')\n
              \ | lower == 'fresh'\n  and\n  (\n    as_timestamp(now())\n    -\n    as_timestamp(\n
              \     states.sensor.powmr_10_2m_output_power.last_reported,\n      0\n
              \   )\n  ) < 90\n}}\n"
          sequence:
          - repeat:
              for_each:
              - 20
              - 50
              - 80
              - 50
              sequence:
              - action: light.turn_on
                continue_on_error: true
                target:
                  entity_id: light.colorful_pir_night_light
                data:
                  brightness_pct: '{{ repeat.item }}'
                  rgb_color: '{{ lamp_color }}'
              - delay: 00:00:01
    - conditions:
      - condition: template
        value_template: '{{ telemetry_ok and using_grid_intentionally }}

          '
      sequence:
      - action: light.turn_on
        continue_on_error: true
        target:
          entity_id: light.colorful_pir_night_light
        data:
          brightness_pct: 100
          rgb_color: '{{ lamp_color }}'
    default:
    - condition: template
      value_template: '{{ telemetry_ok and soc >= 0 }}'
    - action: light.turn_on
      continue_on_error: true
      target:
        entity_id: light.colorful_pir_night_light
      data:
        brightness_pct: 30
        rgb_color: '{{ lamp_color }}'
  mode: restart

- id: energyhub_smart_heating_beacon_pulse
  alias: EnergyHub - Smart Heating Beacon Pulse
  description: Two-second pulse every 20 seconds while Smart Heating is enabled and telemetry is fresh; white normally and yellow in Solar-only mode.
  triggers:
  - trigger: time_pattern
    seconds: /20
  conditions:
  - condition: state
    entity_id: input_boolean.energyhub_smart_heating
    state: 'on'
  - condition: template
    value_template: >-
      {{ is_state('sensor.energyhub_telemetry_freshness', 'fresh')
         and 0 <= now().timestamp()
             - as_timestamp(states.sensor.powmr_10_2m_output_power.last_reported, 0) < 90 }}
  actions:
  - action: timer.start
    target:
      entity_id: timer.energyhub_smart_heating_beacon_pulse
    data:
      duration: 00:00:02
  mode: restart

- id: energyhub_smart_heating_first_floor
  alias: EnergyHub 2.4 - First-floor Smart Heating
  description: >-
    Native first-floor heat-pump control only. Uses Normal, Quiet and Eco;
    pauses at 40% SOC and restores only a state it owned at 50% SOC.
    Higher-priority load protection always wins.
  triggers:
  - trigger: time_pattern
    minutes: /1
  - trigger: time
    at:
    - "23:00:00"
    - "08:00:00"
  - trigger: state
    entity_id: input_boolean.energyhub_smart_heating
    to: 'on'
    id: smart_enabled
  - trigger: state
    entity_id: input_boolean.energyhub_smart_heating
    to: 'off'
    id: smart_disabled
  - trigger: state
    entity_id:
    - input_boolean.energyhub_solar_only_heating
    - sensor.powmr_10_2m_battery_soc
    - sensor.powmr_10_2m_grid_voltage
    - sensor.powmr_10_2m_total_pv_power
  actions:
  - if:
    - condition: trigger
      id: smart_enabled
    then:
    - action: input_boolean.turn_on
      target:
        entity_id: input_boolean.energyhub_hp1_auto_resume
  - variables:
      enabled: "{{ is_state('input_boolean.energyhub_smart_heating', 'on') }}"
      quiet_hours: "{{ now().hour >= 23 or now().hour < 8 }}"
      solar_only: "{{ is_state('input_boolean.energyhub_solar_only_heating', 'on') }}"
      soc: "{{ states('sensor.powmr_10_2m_battery_soc') | float(none) }}"
      reserve: "{{ states('input_number.ahm_minimum_soc') | float(none) }}"
      pv: "{{ states('sensor.powmr_10_2m_total_pv_power') | float(none) }}"
      grid: "{{ states('sensor.powmr_10_2m_grid_voltage') | float(none) }}"
      load_pct: "{{ states('sensor.powmr_10_2m_load') | float(none) }}"
      hp_age: >-
        {{ now().timestamp() - as_timestamp(states.climate.first_floor_heat_pump.last_changed, 0) }}
      battery_fresh: >-
        {{ is_state('sensor.energyhub_telemetry_freshness', 'fresh')
           and soc is not none and 0 <= soc <= 100 }}
      fresh: >-
        {{ battery_fresh
           and reserve is not none and 20 <= reserve <= 95
           and pv is not none and pv >= 0 and grid is not none and grid >= 0 }}
      on_battery: "{{ fresh and grid <= 180 }}"
      cycle: "{{ state_attr('sensor.energyhub_peak_load_guard', 'cycle') or {} }}"
      pending: "{{ state_attr('sensor.energyhub_peak_load_guard', 'pending') or {} }}"
      protected: >-
        {{ states('sensor.energyhub_peak_load_guard') in ['unknown', 'unavailable']
           or not 0 <= now().timestamp() - as_timestamp(state_attr('sensor.energyhub_peak_load_guard', 'load_snapshot_at'), 0) <= 90
           or state_attr('sensor.energyhub_peak_load_guard', 'fault') is not none
           or cycle.get('shedding', false) or cycle.get('owned', {}) | length > 0
           or cycle.get('blocked', {}) | length > 0 or pending | length > 0
           or load_pct is none or load_pct >= 50 }}
      hp_available: >-
        {{ states('climate.first_floor_heat_pump') in ['heat', 'off']
           and is_state('switch.first_floor_heat_pump_plug', 'on') }}
      solar_allowed: >-
        {{ fresh and states('sensor.energyhub_operating_mode') == 'solar'
           and is_state('sun.sun', 'above_horizon')
           and pv >= (400 if is_state('climate.first_floor_heat_pump', 'heat') else 600)
           and soc > reserve }}
  - choose:
    - conditions: "{{ not enabled }}"
      sequence:
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.energyhub_hp1_auto_resume
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.energyhub_hp1_battery_paused
      - action: input_select.select_option
        target:
          entity_id: input_select.energyhub_smart_heating_status
        data:
          option: Manual
    - conditions: >-
        {{ is_state('climate.first_floor_heat_pump', 'off')
           and not is_state('input_boolean.energyhub_hp1_auto_resume', 'on') }}
      sequence:
      - action: input_select.select_option
        target:
          entity_id: input_select.energyhub_smart_heating_status
        data:
          option: Manual
    - conditions: "{{ battery_fresh and soc <= 40 }}"
      sequence:
      - if:
        - condition: state
          entity_id: climate.first_floor_heat_pump
          state: heat
        then:
        - action: input_boolean.turn_on
          target:
            entity_id: input_boolean.energyhub_hp1_battery_paused
        - action: input_boolean.turn_on
          target:
            entity_id: input_boolean.energyhub_hp1_auto_resume
        - action: climate.set_hvac_mode
          target:
            entity_id: climate.first_floor_heat_pump
          data:
            hvac_mode: 'off'
      - action: input_select.select_option
        target:
          entity_id: input_select.energyhub_smart_heating_status
        data:
          option: Battery paused
    - conditions: >-
        {{ battery_fresh and is_state('input_boolean.energyhub_hp1_battery_paused', 'on')
           and soc < 50 }}
      sequence:
      - action: input_select.select_option
        target:
          entity_id: input_select.energyhub_smart_heating_status
        data:
          option: Battery paused
    - conditions: >-
        {{ solar_only and not solar_allowed
           and (not fresh or soc <= reserve or hp_age >= 300
                or states('sensor.energyhub_operating_mode') != 'solar'
                or not is_state('sun.sun', 'above_horizon')) }}
      sequence:
      - if:
        - condition: state
          entity_id: climate.first_floor_heat_pump
          state: heat
        then:
        - action: input_boolean.turn_on
          target:
            entity_id: input_boolean.energyhub_hp1_auto_resume
        - action: climate.set_hvac_mode
          target:
            entity_id: climate.first_floor_heat_pump
          data:
            hvac_mode: 'off'
      - action: input_select.select_option
        target:
          entity_id: input_select.energyhub_smart_heating_status
        data:
          option: Solar paused
    - conditions: "{{ not hp_available or protected or not fresh }}"
      sequence:
      - action: input_select.select_option
        target:
          entity_id: input_select.energyhub_smart_heating_status
        data:
          option: Waiting
    - conditions: >-
        {{ is_state('climate.first_floor_heat_pump', 'off')
           and hp_age < 300 and trigger.id | default('') != 'smart_enabled' }}
      sequence:
      - action: input_select.select_option
        target:
          entity_id: input_select.energyhub_smart_heating_status
        data:
          option: Waiting
    default:
    - if:
      - condition: state
        entity_id: climate.first_floor_heat_pump
        state: 'off'
      then:
      - action: climate.set_hvac_mode
        target:
          entity_id: climate.first_floor_heat_pump
        data:
          hvac_mode: heat
      - wait_template: "{{ is_state('climate.first_floor_heat_pump', 'heat') }}"
        timeout: 00:00:10
        continue_on_timeout: true
      - if:
        - condition: state
          entity_id: climate.first_floor_heat_pump
          state: heat
        then:
        - action: input_boolean.turn_off
          target:
            entity_id: input_boolean.energyhub_hp1_auto_resume
      - condition: state
        entity_id: climate.first_floor_heat_pump
        state: heat
    - if:
      - condition: state
        entity_id: climate.first_floor_heat_pump
        state: heat
      then:
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.energyhub_hp1_auto_resume
    - action: input_boolean.turn_off
      target:
        entity_id: input_boolean.energyhub_hp1_battery_paused
    - action: "{{ 'switch.turn_on' if quiet_hours else 'switch.turn_off' }}"
      target:
        entity_id: switch.first_floor_heat_pump_quiet
    - action: "{{ 'switch.turn_on' if on_battery else 'switch.turn_off' }}"
      target:
        entity_id: switch.first_floor_heat_pump_eco
    - action: input_select.select_option
      target:
        entity_id: input_select.energyhub_smart_heating_status
      data:
        option: "{{ 'Eco' if on_battery else ('Quiet' if quiet_hours else 'Normal') }}"
  mode: single

- id: energyhub_smart_heating_manual_off
  alias: EnergyHub 2.4 - Respect Manual First-floor Heating OFF
  triggers:
  - trigger: state
    entity_id: climate.first_floor_heat_pump
    to: 'off'
    id: manual_state
  - trigger: event
    event_type: call_service
    id: manual_request
  conditions:
  - condition: state
    entity_id: input_boolean.energyhub_smart_heating
    state: 'on'
  - condition: template
    value_template: >-
      {% set target = (trigger.event.data.get('target', {}).get('entity_id', [])
         or trigger.event.data.get('service_data', {}).get('entity_id', []))
         if trigger.id == 'manual_request' else [] %}
      {{ (trigger.id == 'manual_state'
          and trigger.to_state.context.user_id is not none)
         or (trigger.id == 'manual_request'
             and trigger.event.context.user_id is not none
             and trigger.event.data.domain == 'climate'
             and trigger.event.data.service in ['turn_off', 'set_hvac_mode']
              and (trigger.event.data.service == 'turn_off'
                   or trigger.event.data.service_data.get('hvac_mode') == 'off')
              and 'climate.first_floor_heat_pump' in
                  ([target] if target is string else target)) }}
  actions:
  - action: input_boolean.turn_off
    target:
      entity_id:
      - input_boolean.energyhub_hp1_auto_resume
      - input_boolean.energyhub_hp1_battery_paused
  - action: input_select.select_option
    target:
      entity_id: input_select.energyhub_smart_heating_status
    data:
      option: Manual
  mode: restart

- id: energyhub_battery_full_today
  alias: EnergyHub - Remember Battery Reached Full Today
  description: Tracks whether SOC reached 100% for conservative forecast accuracy and EV-potential reporting.
  triggers:
  - trigger: numeric_state
    entity_id: sensor.powmr_10_2m_battery_soc
    above: 99.4
    id: full
  - trigger: time
    at: "00:00:05"
    id: reset
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: full
      sequence:
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.energyhub_battery_full_today
    default:
    - action: input_boolean.turn_off
      target:
        entity_id: input_boolean.energyhub_battery_full_today
  mode: single

- id: energyhub_battery_reserve_automatic_apply
  alias: EnergyHub - Apply Automatic Battery Reserve
  description: >-
    Applies only a fresh, complete EnergyHub Battery Reserve recommendation.
    Manual mode never writes the family-selected reserve.
  triggers:
  - trigger: state
    entity_id:
    - sensor.energyhub_ahm_weather_buffer
    - input_select.energyhub_ahm_weather_authority
  conditions:
  - condition: state
    entity_id: input_select.energyhub_ahm_weather_authority
    state: Automatic
  - condition: template
    value_template: >-
      {% set e = 'sensor.energyhub_ahm_weather_buffer' %}
      {% set target = state_attr(e, 'recommended_soc') | float(none) %}
      {% set plan_date = state_attr(e, 'date') %}
      {% set preliminary = state_attr(e, 'forecast_plan_stage') == 'preliminary' %}
      {% set evidence_age = now().timestamp() - as_timestamp(state_attr(e, 'control_evidence_at'), 0) %}
      {{ states(e) not in ['unknown', 'unavailable']
         and 0 <= evidence_age <= 90
         and (plan_date == now().date().isoformat()
              or (preliminary and now() >= today_at('23:50')
                  and plan_date == (now().date() + timedelta(days=1)).isoformat()))
         and state_attr(e, 'automatic_control_available') == true
         and state_attr(e, 'daily_plan_fresh') == true
         and state_attr(e, 'recommendation_status') == 'ready'
         and target is not none and 20 <= target <= 95 and target % 5 == 0
         and states('input_number.ahm_minimum_soc') | float(none) != target }}
  actions:
  - action: input_number.set_value
    target:
      entity_id: input_number.ahm_minimum_soc
    data:
      value: "{{ state_attr('sensor.energyhub_ahm_weather_buffer', 'recommended_soc') }}"
  mode: restart
- id: '1783102330433'
  alias: EnergyHub - Daily Solar Surplus Estimated Snapshot
  description: Store estimated unused solar energy before daily sensors reset
  triggers:
  - at: '23:50:00'
    trigger: time
  actions:
  - target:
      entity_id: input_number.daily_solar_surplus_estimated
    data:
      value: '{{ surplus }}'
    action: input_number.set_value
  variables:
    forecast: '{{ states(''sensor.solcast_pv_forecast_forecast_today'') | float(0)
      }}'
    consumption: '{{ states(''sensor.powmr_10_2m_daily_house_consumption'') | float(0)
      }}'
    soc: '{{ states(''sensor.powmr_10_2m_battery_soc'') | float(0) }}'
    battery_recharge: '{{ ([0, 100 - soc] | max) / 100 * 16 / 0.9 }}'
    surplus: '{{ [0, forecast - consumption - battery_recharge] | max | round(1) }}'
  mode: single
- id: energyhub_heat_pump_manual_state_memory
  alias: EnergyHub - Remember Manual Heat Pump Plug States
  description: >-
    Remembers explicit HA-user ON/OFF choices for the two Zigbee heat-pump
    plugs. Device, integration, startup and EnergyHub state changes do not
    overwrite the remembered family choice.
  triggers:
  - trigger: state
    entity_id:
    - switch.first_floor_heat_pump_plug
    - switch.second_floor_heat_pump_plug
    to:
    - 'on'
    - 'off'
  conditions:
  - condition: template
    value_template: >-
      {{ trigger.to_state is not none
         and trigger.to_state.context.user_id is not none }}
  actions:
  - variables:
      remembered: >-
        {% set value = states('input_text.energyhub_heat_pump_manual_states') %}
        {{ value | from_json({})
           if value not in ['', 'unknown', 'unavailable'] else {} }}
      first: >-
        {{ trigger.to_state.state
           if trigger.entity_id == 'switch.first_floor_heat_pump_plug'
           else remembered.get('f1', states('switch.first_floor_heat_pump_plug')) }}
      second: >-
        {{ trigger.to_state.state
           if trigger.entity_id == 'switch.second_floor_heat_pump_plug'
           else remembered.get('f2', states('switch.second_floor_heat_pump_plug')) }}
  - action: input_text.set_value
    target:
      entity_id: input_text.energyhub_heat_pump_manual_states
    data:
      value: "{{ {'f1': first, 'f2': second} | tojson }}"
  mode: restart
- id: energyhub_heat_pump_grid_recovery_timer
  alias: EnergyHub - Start Heat Pump Grid Recovery Timer
  triggers:
  - trigger: homeassistant
    event: start
  - trigger: numeric_state
    entity_id: sensor.powmr_10_2m_grid_voltage
    below: 180.1
  - trigger: numeric_state
    entity_id: sensor.powmr_10_2m_grid_voltage
    above: 180
  - trigger: state
    entity_id: sensor.powmr_10_2m_grid_voltage
    to:
    - unknown
    - unavailable
  actions:
  - action: input_datetime.set_datetime
    target:
      entity_id: input_datetime.energyhub_heat_pump_grid_recovery_started
    data:
      timestamp: "{{ now().timestamp() }}"
  mode: restart

- id: energyhub_heat_pump_restart_restore
  alias: EnergyHub - Restore Heat Pump Plugs After Restart
  description: >-
    After a stable HA restart, restores only remembered-ON Zigbee heat-pump
    plugs that returned OFF. Requires fresh telemetry, reliable grid voltage,
    ready plug states and no EnergyHub ownership. Reports confirmed power after
    a one-minute appliance startup window.
  triggers:
  - trigger: homeassistant
    event: start
  - trigger: time_pattern
    minutes: /1
  conditions:
  - condition: template
    value_template: >-
      {% set session = states('input_text.energyhub_load_bridge_session') %}
      {{ session not in ['', 'unknown', 'unavailable']
         and session != states('input_text.energyhub_heat_pump_restart_completed_session')
         and now().timestamp() - as_timestamp(session, now().timestamp()) >= 90 }}
  - condition: state
    entity_id: sensor.energyhub_telemetry_freshness
    state: fresh
  - condition: numeric_state
    entity_id: sensor.powmr_10_2m_grid_voltage
    above: 180
  - condition: template
    value_template: >-
      {% set guard = 'sensor.energyhub_peak_load_guard' %}
      {% set cycle = state_attr(guard, 'cycle') %}
      {{ states(guard) not in ['unknown', 'unavailable']
         and 0 <= now().timestamp() - as_timestamp(state_attr(guard, 'load_snapshot_at'), 0) <= 90
         and state_attr(guard, 'fault') is none
         and not state_attr(guard, 'pending')
         and not cycle
         and states('sensor.powmr_10_2m_load') | float(100) < 50
         and states('sensor.powmr_10_2m_output_power') | float(10000) < 5000
         and 0 <= now().timestamp() - as_timestamp(states['sensor.powmr_10_2m_load'].last_reported, 0) <= 30
         and 0 <= now().timestamp() - as_timestamp(states['sensor.powmr_10_2m_grid_voltage'].last_reported, 0) <= 30
         and states('input_datetime.energyhub_heat_pump_grid_recovery_started') not in ['unknown', 'unavailable']
         and now().timestamp() - as_timestamp(states('input_datetime.energyhub_heat_pump_grid_recovery_started'), 0) >= 300
         and now().timestamp() - as_timestamp(states('input_text.energyhub_heat_pump_restart_attempt'), 0) >= 300 }}
  - condition: template
    value_template: >-
      {{ states('switch.first_floor_heat_pump_plug') in ['on', 'off']
         and states('switch.second_floor_heat_pump_plug') in ['on', 'off'] }}
  actions:
  - variables:
      session: "{{ states('input_text.energyhub_load_bridge_session') }}"
      remembered_raw: "{{ states('input_text.energyhub_heat_pump_manual_states') }}"
      remembered: >-
        {{ remembered_raw | from_json({})
           if remembered_raw not in ['', 'unknown', 'unavailable'] else {} }}
      cycle: "{{ state_attr('sensor.energyhub_peak_load_guard', 'cycle') or {} }}"
      pending: "{{ state_attr('sensor.energyhub_peak_load_guard', 'pending') or {} }}"
      controller_busy: >-
        {{ cycle.get('shedding', false) or pending | length > 0 }}
      blocked_keys: >-
        {{ (cycle.get('owned', {}).keys() | list)
           + (cycle.get('blocked', {}).keys() | list)
           + ([pending.get('key')] if pending.get('key') else []) }}
      candidates: >-
        {% set ns = namespace(items=[]) %}
        {% if remembered.get('f1') == 'on'
              and is_state('switch.first_floor_heat_pump_plug', 'off')
              and not controller_busy
              and 'heat_pump_floor_1' not in blocked_keys %}
          {% set ns.items = ns.items + [{
            'entity': 'switch.first_floor_heat_pump_plug',
            'floor': '1-й',
            'power': 'sensor.first_floor_heat_pump_plug_power'
          }] %}
        {% endif %}
        {% if remembered.get('f2') == 'on'
              and is_state('switch.second_floor_heat_pump_plug', 'off')
              and not controller_busy
              and 'heat_pump_floor_2' not in blocked_keys %}
          {% set ns.items = ns.items + [{
            'entity': 'switch.second_floor_heat_pump_plug',
            'floor': '2-й',
            'power': 'sensor.second_floor_heat_pump_plug_power'
          }] %}
        {% endif %}
        {{ ns.items[:1] }}
  - choose:
    - conditions: "{{ remembered | length == 0 }}"
      sequence:
      - action: input_text.set_value
        target:
          entity_id: input_text.energyhub_heat_pump_manual_states
        data:
          value: >-
            {{ {
              'f1': states('switch.first_floor_heat_pump_plug'),
              'f2': states('switch.second_floor_heat_pump_plug')
            } | tojson }}
    - conditions: "{{ candidates | length > 0 }}"
      sequence:
      - action: input_text.set_value
        target:
          entity_id: input_text.energyhub_heat_pump_restart_attempt
        data:
          value: "{{ now().isoformat() }}"
      - action: switch.turn_on
        target:
          entity_id: "{{ candidates[0].entity }}"
      - wait_template: >-
          {% set ns = namespace(confirmed=true) %}
          {% for item in candidates %}
            {% if not is_state(item.entity, 'on') %}
              {% set ns.confirmed = false %}
            {% endif %}
          {% endfor %}
          {{ ns.confirmed }}
        timeout: 00:00:10
        continue_on_timeout: true
      - delay: 00:01:00
      - variables:
          restored: >-
            {% set ns = namespace(items=[]) %}
            {% for item in candidates %}
              {% if is_state(item.entity, 'on') %}
                {% set watts = states(item.power) | float(none) %}
                {% set ns.items = ns.items + [{
                  'floor': item.floor,
                  'power_w': watts
                }] %}
              {% endif %}
            {% endfor %}
            {{ ns.items }}
      - if:
        - condition: template
          value_template: "{{ restored | length > 0 }}"
        then:
        - action: input_text.set_value
          target:
            entity_id: input_text.energyhub_heat_pump_restart_event
          data:
            value: >-
              {{ {
                'id': session ~ ':' ~ now().timestamp() | int,
                'restored': restored
              } | tojson }}
  - variables:
      remaining: >-
        {{ (remembered.get('f1') == 'on'
             and is_state('switch.first_floor_heat_pump_plug', 'off')
             and 'heat_pump_floor_1' not in blocked_keys)
           or (remembered.get('f2') == 'on'
             and is_state('switch.second_floor_heat_pump_plug', 'off')
             and 'heat_pump_floor_2' not in blocked_keys) }}
  - if:
    - condition: template
      value_template: "{{ not remaining }}"
    then:
    - action: input_text.set_value
      target:
        entity_id: input_text.energyhub_heat_pump_restart_completed_session
      data:
        value: "{{ session }}"
  mode: single
- id: '1784300000101'
  alias: EnergyHub - Floor 1 Heat Pump Auto Off
  description: Auto-off timer for the 1st floor heat pump plug
  triggers:
  - entity_id: switch.first_floor_heat_pump_plug
    to: 'on'
    id: pump_on
    trigger: state
  - entity_id: switch.first_floor_heat_pump_plug
    to: 'off'
    id: pump_off
    trigger: state
  - entity_id: input_number.input_number_floor1_heat_pump_timer_hours
    id: timer_changed
    trigger: state
  - event_type: timer.finished
    event_data:
      entity_id: timer.floor_1_heat_pump_auto_off
    id: timer_finished
    trigger: event
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ trigger.id in [''pump_on'', ''timer_changed''] }}

          '
      - condition: state
        entity_id: switch.first_floor_heat_pump_plug
        state: 'on'
      - condition: template
        value_template: "{{\n  states(\n    'input_number.input_number_floor1_heat_pump_timer_hours'\n
          \ ) | int(0) > 0\n}}\n"
      sequence:
      - target:
          entity_id: timer.floor_1_heat_pump_auto_off
        data:
          duration: "{{\n  '%02d:00:00' %\n  (\n    states(\n      'input_number.input_number_floor1_heat_pump_timer_hours'\n
            \   ) | int(0)\n  )\n}}\n"
        action: timer.start
    - conditions:
      - condition: trigger
        id: timer_changed
      - condition: template
        value_template: "{{\n  states(\n    'input_number.input_number_floor1_heat_pump_timer_hours'\n
          \ ) | int(0) == 0\n}}\n"
      sequence:
      - target:
          entity_id: timer.floor_1_heat_pump_auto_off
        action: timer.cancel
    - conditions:
      - condition: trigger
        id: pump_off
      sequence:
      - target:
          entity_id: timer.floor_1_heat_pump_auto_off
        action: timer.cancel
      - if:
        - condition: template
          value_template: "{{ trigger.to_state.context.user_id is not none }}"
        then:
        - target:
            entity_id: input_number.input_number_floor1_heat_pump_timer_hours
          data:
            value: 0
          action: input_number.set_value
    - conditions:
      - condition: trigger
        id: timer_finished
      sequence:
      - target:
          entity_id: switch.first_floor_heat_pump_plug
        action: switch.turn_off
      - target:
          entity_id: input_number.input_number_floor1_heat_pump_timer_hours
        data:
          value: 0
        action: input_number.set_value
  mode: queued
