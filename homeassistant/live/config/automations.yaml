          ['hybrid_charging', 'hybrid_grid_hold', 'panic', 'panic_grid_hold']
        and states('sensor.powmr_10_2m_grid_voltage') | float(0) > 50
      %}
      {{ not hybrid_grid_permission }}
  - if:
    - condition: state
      entity_id: switch.first_floor_heat_pump_plug
      state: 'on'
    then:
    - action: switch.turn_off
      continue_on_error: true
      target:
        entity_id: switch.first_floor_heat_pump_plug
  - if:
    - condition: state
      entity_id: switch.second_floor_heat_pump_plug
      state: 'on'
    then:
    - action: switch.turn_off
      continue_on_error: true
      target:
        entity_id: switch.second_floor_heat_pump_plug
  - if:
    - condition: state
      entity_id: switch.chuangmi_212a01_ea40_switch
      state: 'on'
    then:
    - action: switch.turn_off
      continue_on_error: true
      target:
        entity_id: switch.chuangmi_212a01_ea40_switch
  - delay:
      seconds: 3
  - action: persistent_notification.create
    data:
      title: EnergyHub - Heat pumps locked
      notification_id: energyhub_heat_pump_soc_lockout
      message: >-
        {% set trusted_grid =
          states('sensor.energyhub_grid_confidence') | lower == 'normal'
          and states('sensor.energyhub_grid_availability_24h') | float(-1) >= 100
          and states('sensor.energyhub_grid_available_48h') | float(-1) >= 48
          and states('sensor.powmr_10_2m_grid_voltage') | float(0) > 50
        %}
        {% set recovery_soc = 60 if trusted_grid else 90 %}
        Battery SOC is {{ states('sensor.powmr_10_2m_battery_soc') }}%.
        All heat pumps are locked OFF until fresh SOC reaches
        {{ recovery_soc }}% under the current
        {{ 'fully trusted' if trusted_grid else 'conservative' }} grid policy.
        Observed states: floor 1
        {{ states('switch.first_floor_heat_pump_plug') }}, floor 2
        {{ states('switch.second_floor_heat_pump_plug') }}, floor 3
        {{ states('switch.chuangmi_212a01_ea40_switch') }}.
