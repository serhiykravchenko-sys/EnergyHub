- id: '1783245343717'
  alias: EnergyHub - Publish Daily Summary Inputs
  description: Publishes decision inputs before 23:50 and one atomic Daily Summary
    snapshot at 23:51.
  triggers:
  - trigger: time
    at: '23:49:00'
    id: before_hybrid_decision
  - trigger: time
    at: '23:51:00'
    id: final_daily_snapshot
  conditions: []
  actions:
  - variables:
      daily_house_consumption: '{{ states(''sensor.powmr_10_2m_daily_house_consumption'')
        | float(0) }}'
      solar_forecast_today: '{{ states(''sensor.solcast_pv_forecast_forecast_today'')
        | float(0) }}'
  - variables:
      daily_solar_surplus_estimated: '{{ [0, solar_forecast_today - daily_house_consumption]
        | max | round(1) }}'
  - action: mqtt.publish
    data:
      topic: energyhub/input/ha/daily_house_consumption
      payload: '{{ daily_house_consumption }}'
      retain: true
  - action: mqtt.publish
    data:
      topic: energyhub/input/ha/solar_forecast_today
      payload: '{{ solar_forecast_today }}'
      retain: true
  - action: mqtt.publish
    data:
      topic: energyhub/input/ha/solar_forecast_tomorrow
      payload: '{{ states(''sensor.solcast_pv_forecast_forecast_tomorrow'') }}'
      retain: true
  - action: mqtt.publish
    data:
      topic: energyhub/input/ha/adaptive_hybrid_plan
      payload: >-
        {% set hourly =
          state_attr('sensor.solcast_pv_forecast_forecast_tomorrow',
          'detailedHourly') or [] %}
        {% set morning_start = today_at('07:00') + timedelta(days=1) %}
        {% set day_end = morning_start + timedelta(hours=17) %}
        {% set learning_end = morning_start + timedelta(hours=5) %}
        {% set ns = namespace(
          useful_solar_start=none,
          ramp_start_power=none,
          ramp_next_power=none,
          ramp_confirmed=false,
          hourly_solar=[],
          solar_after_07=0) %}
        {% for item in hourly %}
          {% set period = as_local(as_datetime(item.period_start)) %}
          {% set power = item.pv_estimate | float(0) %}
          {% if period >= morning_start and period < day_end %}
            {% set ns.solar_after_07 = ns.solar_after_07
              + power %}
          {% endif %}
          {% if period >= morning_start and period < learning_end %}
            {% set ns.hourly_solar = ns.hourly_solar + [{
              'hour': period.hour,
              'power_w': (power * 1000) | round(1)
            }] %}
          {% endif %}
          {% if period >= morning_start and period < day_end
            and ns.useful_solar_start is none
            and power >= 0.3 %}
            {% set ns.useful_solar_start = period %}
            {% set ns.ramp_start_power = power %}
          {% elif period >= morning_start and period < day_end
            and ns.useful_solar_start is not none
            and ns.ramp_next_power is none
            and period > ns.useful_solar_start %}
            {% set ns.ramp_next_power = power %}
            {% set interval_seconds = as_timestamp(period)
              - as_timestamp(ns.useful_solar_start) %}
            {% set ns.ramp_confirmed = power >= 0.6
              and interval_seconds >= 3500
              and interval_seconds <= 3700 %}
          {% endif %}
        {% endfor %}
        {% if ns.useful_solar_start is not none %}
          {% set raw_morning_hours = [0,
            (as_timestamp(ns.useful_solar_start)
            - as_timestamp(morning_start)) / 3600] | max %}
          {% set ramp_credit_hours = 1
            if ns.ramp_confirmed and raw_morning_hours >= 1 else 0 %}
          {% set morning_hours = [0,
            raw_morning_hours - ramp_credit_hours] | max %}
          {% set effective_solar_start = ns.useful_solar_start
            - timedelta(hours=ramp_credit_hours) %}
          {{ {
            'raw_morning_hours': raw_morning_hours | round(2),
            'morning_hours': morning_hours | round(2),
            'useful_solar_start':
              ns.useful_solar_start.strftime('%H:%M'),
            'effective_solar_start':
              effective_solar_start.strftime('%H:%M'),
            'ramp_confirmed': ns.ramp_confirmed,
            'ramp_credit_hours': ramp_credit_hours,
            'ramp_start_power_w':
              (ns.ramp_start_power * 1000) | round(1),
            'ramp_next_power_w':
              ((ns.ramp_next_power * 1000) | round(1))
              if ns.ramp_next_power is not none else none,
            'hourly_solar': ns.hourly_solar,
            'solar_after_07_kwh': ns.solar_after_07 | round(2)
          } | tojson }}
        {% else %}
          {{ {
            'raw_morning_hours': 5,
            'morning_hours': 5,
            'useful_solar_start': 'fallback 12:00',
            'effective_solar_start': 'fallback 12:00',
            'ramp_confirmed': false,
            'ramp_credit_hours': 0,
            'ramp_start_power_w': none,
            'ramp_next_power_w': none,
            'hourly_solar': ns.hourly_solar,
            'solar_after_07_kwh': ns.solar_after_07 | round(2)
          } | tojson }}
        {% endif %}
      retain: true
  - action: mqtt.publish
    data:
      topic: energyhub/input/ha/daily_solar_surplus_estimated
      payload: '{{ daily_solar_surplus_estimated }}'
      retain: true
  - choose:
    - conditions:
      - condition: trigger
        id: final_daily_snapshot
      sequence:
      - action: mqtt.publish
        data:
          topic: energyhub/input/ha/daily_summary_snapshot
          payload: "{{ {\n  'date': now().strftime('%Y-%m-%d'),\n  'timestamp': as_timestamp(now())
            | int,\n  'daily_house_consumption': daily_house_consumption,\n  'solar_forecast_today':
            \ solar_forecast_today,\n
            \ 'solar_forecast_tomorrow': states('sensor.solcast_pv_forecast_forecast_tomorrow'),\n
            \ 'daily_solar_surplus_estimated': daily_solar_surplus_estimated\n}
            | tojson }}"
          retain: true
  mode: single
- id: '1784300000001'
  alias: EnergyHub - Publish Live Solcast Forecasts
  description: Publishes live Solcast forecast changes for EnergyHub decision engines
    without creating Daily Summary snapshots.
  triggers:
  - trigger: state
