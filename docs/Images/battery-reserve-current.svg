<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8fbff"/><stop offset="1" stop-color="#eef7f5"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-opacity="0.12"/></filter>
    <style>
      .title{font:700 58px 'Segoe UI',Arial,sans-serif;fill:#102a43}.sub{font:400 25px 'Segoe UI',Arial,sans-serif;fill:#486581}
      .h{font:700 30px 'Segoe UI',Arial,sans-serif;fill:#102a43}.k{font:700 24px 'Segoe UI',Arial,sans-serif;fill:#0b7285}
      .b{font:400 22px 'Segoe UI',Arial,sans-serif;fill:#243b53}.small{font:400 19px 'Segoe UI',Arial,sans-serif;fill:#486581}
      .white{fill:#fff}.red{fill:#c44536}
    </style>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg)"/>
  <text x="80" y="85" class="title">EnergyHub — One Continuous Battery Reserve</text>
  <text x="82" y="126" class="sub">One applied floor, 24/7 · transparent evidence · guarded inverter control</text>
  <g filter="url(#shadow)">
    <rect x="70" y="175" rx="24" width="440" height="305" fill="#fff" stroke="#1565c0" stroke-width="3"/>
    <rect x="70" y="175" rx="24" width="440" height="72" fill="#1565c0"/>
    <text x="290" y="221" text-anchor="middle" class="h white">WHO SETS THE FLOOR?</text>
    <circle cx="135" cy="302" r="28" fill="#e7f1ff"/><text x="135" y="312" text-anchor="middle" class="k">M</text>
    <text x="182" y="294" class="k">Manual</text><text x="182" y="325" class="b">Family selects 20–95%</text>
    <text x="182" y="350" class="small">Five-point steps;</text><text x="182" y="374" class="small">manual choice stays applied</text>
    <line x1="105" y1="390" x2="475" y2="390" stroke="#d7e3f0" stroke-width="2"/>
    <circle cx="135" cy="429" r="28" fill="#e5faf6"/><text x="135" y="439" text-anchor="middle" class="k">A</text>
    <text x="182" y="421" class="k">Automatic</text><text x="182" y="448" class="small">Available, dated plan; fresh</text>
    <text x="182" y="465" class="small">control check within 90 seconds</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="545" y="175" rx="24" width="985" height="305" fill="#fff" stroke="#0f8b8d" stroke-width="3"/>
    <rect x="545" y="175" rx="24" width="985" height="72" fill="#0f8b8d"/>
    <text x="1038" y="221" text-anchor="middle" class="h white">HOW THE RECOMMENDATION IS BUILT</text>
    <text x="590" y="292" class="k">20% base</text><text x="748" y="292" class="h">+</text>
    <text x="785" y="292" class="k">Forecast</text><text x="785" y="324" class="small">+0 / +20</text>
    <text x="972" y="292" class="h">+</text><text x="1010" y="292" class="k">Grid</text><text x="1010" y="324" class="small">+0 / +20 / +40 / +60</text>
    <text x="1280" y="292" class="h">+</text><text x="1318" y="292" class="k">Weather</text><text x="1318" y="324" class="small">+20 when eligible</text>
    <text x="590" y="380" class="h">+</text><text x="628" y="380" class="k">Smart Heating enabled: +20</text>
    <rect x="1010" y="350" rx="18" width="455" height="78" fill="#e8f7f4"/>
    <text x="1237" y="382" text-anchor="middle" class="h">Result capped at 95%</text>
    <text x="1237" y="412" text-anchor="middle" class="small">Unknown/stale evidence cannot authorize a release</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="70" y="525" rx="24" width="1460" height="255" fill="#fff" stroke="#f28c28" stroke-width="3"/>
    <text x="800" y="578" text-anchor="middle" class="h">WHAT THE INVERTER CONTROLLER DOES</text>
    <rect x="115" y="620" rx="18" width="360" height="105" fill="#fff5e8" stroke="#f28c28" stroke-width="2"/>
    <text x="295" y="660" text-anchor="middle" class="k">SOC below reserve</text><text x="295" y="696" text-anchor="middle" class="b">Grid available → charge</text>
    <path d="M485 673 H575" stroke="#8aa4b8" stroke-width="5"/><path d="M565 661 l18 12 -18 12" fill="#8aa4b8"/>
    <rect x="585" y="620" rx="18" width="410" height="105" fill="#edf6ff" stroke="#1565c0" stroke-width="2"/>
    <text x="790" y="660" text-anchor="middle" class="k">SOC at reserve</text><text x="790" y="696" text-anchor="middle" class="b">Grid Hold preserves the battery</text>
    <path d="M1005 673 H1095" stroke="#8aa4b8" stroke-width="5"/><path d="M1085 661 l18 12 -18 12" fill="#8aa4b8"/>
    <rect x="1105" y="620" rx="18" width="380" height="105" fill="#eaf8ef" stroke="#2a9d5b" stroke-width="2"/>
    <text x="1295" y="660" text-anchor="middle" class="k">SOC reaches reserve +10</text><text x="1295" y="696" text-anchor="middle" class="b">Return to Solar First</text>
    <text x="800" y="758" text-anchor="middle" class="small">Grid absent: wait for return. At the 95% cap, hold until the applied reserve decreases.</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="70" y="825" rx="24" width="1460" height="115" fill="#fff" stroke="#c44536" stroke-width="3"/>
    <text x="110" y="870" class="h red">Separate outage load protection</text>
    <text x="650" y="870" class="small">Grid absent: warn 50% · pause 40% · restore 60% or grid return</text>
    <text x="110" y="910" class="small">Separate from reserve: microwave is excluded; owned Smart Heating may restore in Eco at 50%.</text>
  </g>
</svg>
