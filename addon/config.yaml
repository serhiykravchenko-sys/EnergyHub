name: Energy Hub
version: "2.4.12"
slug: energy_hub
description: Local home energy management for PowMr PI30MAX and Home Assistant
url: https://github.com/serhiykravchenko-sys/EnergyHub

arch:
  - aarch64

startup: services
boot: auto
init: false

hassio_api: false
homeassistant_api: false
host_network: false

uart: true
udev: true

options:
  powmr_enabled: true
  mqtt_host: core-mosquitto
  mqtt_port: 1883
  mqtt_user: null
  mqtt_password: null
  serial_port: /dev/serial/by-id/REPLACE_WITH_YOUR_FTDI_DEVICE_ID
  protocol: PI30MAX
  command: QPIGS
  poll_interval: 10
  pv2_modbus_enabled: false
  pv2_poll_interval: 30
  device_name: PowMr 10.2M
  timezone: Europe/Kyiv

schema:
  peak_load_control_enabled: bool?
  powmr_enabled: bool
  mqtt_host: str
  mqtt_port: int
  mqtt_user: str
  mqtt_password: password
  serial_port: str
  protocol: str
  command: str
  poll_interval: int
  pv2_modbus_enabled: bool
  pv2_poll_interval: int
  device_name: str
  timezone: str
