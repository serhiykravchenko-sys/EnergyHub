name: Telegram Family Assistant
version: "1.3.14"
slug: telegram_family_assistant
description: Sends a Ukrainian morning weather and EnergyHub summary to the family Telegram group
url: https://github.com/serhiykravchenko-sys/EnergyHub

arch:
  - aarch64
  - amd64

startup: services
boot: auto
init: false
host_network: false
homeassistant_api: true

options:
  bot_token: null
  destination_chat_id: null
  weather_entity: auto
  send_time: "08:00"
  soc_snapshot_time: "07:00"
  night_start_time: "23:00"
  timezone: Europe/Kyiv
  useful_solar_threshold_w: 300
  strong_wind_threshold_ms: 15
  test_mode: true
  battery_soc_entity: sensor.powmr_10_2m_battery_soc
  target_soc_entity: sensor.energyhub_hybrid_target_soc
  ahm_minimum_soc_entity: input_number.ahm_minimum_soc
  reserve_advice_entity: sensor.energyhub_ahm_reserve_advice
  reserve_advice_current_soc_entity: sensor.energyhub_ahm_reserve_advice_current_soc
  reserve_advice_suggested_soc_entity: sensor.energyhub_ahm_reserve_advice_suggested_soc
  reserve_advice_sample_count_entity: sensor.energyhub_ahm_reserve_advice_sample_count
  operating_mode_entity: sensor.energyhub_operating_mode
  yesterday_consumption_entity: sensor.energyhub_daily_house_consumption
  solar_forecast_entity: sensor.solcast_pv_forecast_forecast_today
  sun_entity: sun.sun
  moon_entity: moon.moon
  daily_grid_import_entity: sensor.energyhub_daily_grid_import_estimated
  yesterday_grid_import_entity: sensor.energyhub_grid_import_yesterday_estimated
  yesterday_night_grid_import_entity: sensor.energyhub_grid_import_night_yesterday_estimated
  yesterday_normal_grid_import_entity: sensor.energyhub_grid_import_normal_yesterday_estimated
  yesterday_grid_import_cost_entity: sensor.energyhub_grid_import_cost_yesterday_estimated
  month_night_grid_import_entity: sensor.energyhub_grid_import_night_month_estimated
  month_normal_grid_import_entity: sensor.energyhub_grid_import_normal_month_estimated
  month_grid_import_entity: sensor.energyhub_grid_import_month_estimated
  month_grid_import_cost_entity: sensor.energyhub_grid_import_cost_month_estimated
  night_grid_import_price_entity: sensor.energyhub_grid_import_night_price
  normal_grid_import_price_entity: sensor.energyhub_grid_import_normal_price
  grid_voltage_entity: sensor.powmr_10_2m_grid_voltage
  grid_confidence_entity: sensor.energyhub_grid_confidence
  telemetry_freshness_entity: sensor.energyhub_telemetry_freshness
  inverter_message_entities: >-
    sensor.energyhub_inverter_fault_recent_1;
    sensor.energyhub_inverter_fault_recent_2;
    sensor.energyhub_inverter_fault_recent_3
  environment_sensor_entities: >-
    1st floor|sensor.energyhub_floor_1_temperature|sensor.energyhub_floor_1_humidity|indoor;
    2nd floor Kids room|sensor.energyhub_floor_2_temperature|sensor.energyhub_floor_2_humidity|indoor;
    3rd floor|sensor.energyhub_floor_3_temperature|sensor.energyhub_floor_3_humidity|indoor;
    Main entrance|sensor.energyhub_entrance_temperature|sensor.energyhub_entrance_humidity|indoor;
    1st floor bathroom|sensor.energyhub_bathroom_temperature|sensor.energyhub_bathroom_humidity|indoor||sensor.energyhub_bathroom_pressure;
    2nd floor toilet|sensor.energyhub_utility_room_temperature|sensor.energyhub_utility_room_humidity|indoor|sensor.energyhub_utility_room_sensor_battery;
    Basement|sensor.energyhub_basement_temperature|sensor.energyhub_basement_humidity|basement||sensor.energyhub_basement_pressure
  environment_stale_hours: 24
  environment_temperature_deviation_c: 5
  environment_humidity_deviation_percent: 20
  environment_persistence_minutes: 60
  device_low_battery_percent: 10
  doorbell_battery_entity: ""

schema:
  bot_token: password
  destination_chat_id: "str?"
  weather_entity: str
  send_time: str
  soc_snapshot_time: str
  night_start_time: str
  timezone: str
  useful_solar_threshold_w: "int(50,5000)"
  strong_wind_threshold_ms: "float(5,40)"
  test_mode: bool
  battery_soc_entity: str
  target_soc_entity: str
  ahm_minimum_soc_entity: str
  reserve_advice_entity: str
  reserve_advice_current_soc_entity: str
  reserve_advice_suggested_soc_entity: str
  reserve_advice_sample_count_entity: str
  operating_mode_entity: str
  yesterday_consumption_entity: str
  solar_forecast_entity: str
  sun_entity: str
  moon_entity: str
  daily_grid_import_entity: str
  yesterday_grid_import_entity: str
  yesterday_night_grid_import_entity: str
  yesterday_normal_grid_import_entity: str
  yesterday_grid_import_cost_entity: str
  month_night_grid_import_entity: str
  month_normal_grid_import_entity: str
  month_grid_import_entity: str
  month_grid_import_cost_entity: str
  night_grid_import_price_entity: str
  normal_grid_import_price_entity: str
  grid_voltage_entity: str
  grid_confidence_entity: str
  telemetry_freshness_entity: str
  inverter_message_entities: str
  environment_sensor_entities: str
  environment_stale_hours: "float(1,168)"
  environment_temperature_deviation_c: "float(0.5,20)"
  environment_humidity_deviation_percent: "float(1,100)"
  environment_persistence_minutes: "int(0,1440)"
  device_low_battery_percent: "float(1,100)"
  doorbell_battery_entity: "str?"
  heat_pump_active_threshold_w: "float?"
  heat_pump_floor_1_power_entity: "str?"
  heat_pump_floor_2_power_entity: "str?"
  heat_pump_floor_3_power_entity: "str?"
