configuration:
  automation_notifications_enabled:
    name: Native HA automation notifications
    description: Discover an EnergyHub Telegram notify target over MQTT. Opt-in; existing automations are not modified. Configure broker credentials below once.
  notification_mqtt_host:
    name: Notification MQTT broker host
    description: Broker reachable from this app; core-mosquitto for the local Mosquitto app. Uses the default homeassistant discovery prefix.
  notification_mqtt_port:
    name: Notification MQTT broker port
    description: Local trusted-network MQTT port. This release does not support external TLS brokers.
  notification_mqtt_user:
    name: Notification MQTT username
    description: Broker account with access to this bridge's notification and discovery topics.
  notification_mqtt_password:
    name: Notification MQTT password
    description: Stored in app options, never in automation messages.
  solcast_last_success_entity:
    name: Verified Solcast successful source refresh
    description: Optional timestamp entity. Commission only after verifying its successful-refresh meaning for the installed integration. HA entity update times are not source freshness.
  beacon_recovery_enabled:
    name: Automatic Beacon recovery
    description: Reload only an isolated Tuya lamp entry after sustained current failure. Three persisted attempts; authentication or shared entries require manual action.
  apartment_grid_cloud_enabled:
    name: Fresh Xiaomi cloud availability
    description: Read the existing Xiaomi Miot cloud session from the read-only HA configuration mount. No login, session renewal or device control. Failed reads are unknown; hub offline is an indirect power indicator.
  apartment_grid_proxy_entity:
    name: Apartment grid proxy entity
    description: Powered hub light entity; availability is an indirect electricity indicator.
  dtek_dacha_district:
    name: House emergency-outage district
    description: Kyiv region district. Supported names are Obukhiv, Fastiv, Brovary, Bucha, Vyshhorod, Boryspil and Bila Tserkva. Empty means district-specific notices cannot be matched.
  dtek_apartment_district:
    name: Apartment emergency-outage district
    description: Kyiv region district, using the same supported names as the house district. District notices affect only the matching location.
  dtek_solar_forecast_tomorrow_entity:
    name: Tomorrow hourly solar forecast
    description: Optional Solcast entity with detailedHourly periods for advance outage preparation. Missing data uses the conservative grid fallback.
  dtek_schedule_enabled:
    name: DTEK daily schedule monitoring
    description: Read Pro Kyiv regional schedules and notices every 30 minutes, with Alerts.energy as schedule backup. Official website and Telegram polling are disabled. Tomorrow checkpoints are 20:00, 20:30 and 21:00. No direct hardware commands.
  dtek_dacha_group:
    name: House outage group
    description: Exact Kyiv-region queue and subqueue, for example 1.1. Match Energy Hub outage_group.
  dtek_apartment_group:
    name: Apartment outage group
    description: Informational Kyiv-region queue and subqueue, for example 2.2.
  co_alarm_entities:
    name: CO alarm sensors
    description: Semicolon-separated label|binary_sensor[|Zigbee_parent] entries. An active alarm is sent immediately, including quiet hours; acknowledged episodes are not repeated.
  co2_sensor_entities:
    name: CO2 sensors
    description: Semicolon-separated label|entity[|Zigbee_parent] entries. Advisory at 1200 ppm for 10 minutes, urgent at 2000 ppm for 3 minutes, recovery below 1000 ppm for 5 minutes. Urgent notices bypass overnight quiet hours.
  log_monitor_enabled:
    name: Core log attention monitoring
    description: Read the bounded HA warning/error buffer every five minutes. Repeated warnings and errors go to the technical chat, with startup grace and duplicate suppression. Does not grant Supervisor access.
  house_monitor_enabled:
    name: Household availability monitoring
    description: Check the selected devices every 30 seconds. Alert after three observed minutes and recover after five stable minutes.
  monitored_device_entities:
    name: Additional monitored devices
    description: Semicolon-separated label|entity[|parent_entity] entries. Smart plugs and environmental sensors are included automatically; off is available.
  bms_entity_mapping:
    name: BMS evidence mapping
    description: Optional semicolon-separated field|entity entries. Requires soc, current, voltage; optional cells, temperature, health, capacity, cycles, problem, charging, energy, power. Saves a bounded diagnostic journal without changing BMS settings.
  bot_token:
    name: Telegram bot token
    description: Secret token issued by BotFather. Never commit or share it.
  destination_chat_id:
    name: Family group chat ID
    description: Negative Telegram group ID. Keep the real destination ID only in the app configuration.
  technical_chat_id:
    name: Technical chat ID
    description: Optional private Telegram chat ID for diagnostics and recovery notices. The family chat is used when this is empty.
  weather_entity:
    name: Weather entity
    description: Use auto to select weather.forecast_home or the first available weather entity, or enter an explicit entity ID.
  uhmc_weather_source:
    name: UHMC Telegram source
    description: Public official Ukrainian Hydrometeorological Center channel used for read-only warning evidence.
  uhmc_weather_mqtt_topic:
    name: UHMC evidence MQTT topic
    description: Retained topic through which normalized warnings are supplied to EnergyHub.
  family_calendar_ical_url:
    name: Private Family Calendar iCal URL
    description: Optional secret HTTPS address for today's read-only Google Calendar events. It is masked and must never be shared or committed.
  send_time:
    name: Morning delivery time
    description: Daily family report time in local 24-hour HH:MM format. The scheduled report is allowed during quiet hours.
  family_quiet_start:
    name: Family Telegram quiet hours start
    description: Local 24-hour HH:MM. Routine family messages are collected for the morning report. Independent of heat-pump Quiet/night settings; CO and urgent CO2 alarms still arrive immediately.
  family_quiet_end:
    name: Family Telegram quiet hours end
    description: Local 24-hour HH:MM, exclusive end. Equal start/end disables the quiet window. A brief buffer at the report time keeps the morning report first.
  soc_snapshot_time:
    name: Deprecated SOC snapshot time
    description: Compatibility-only retired option; it is accepted but ignored.
  night_start_time:
    name: Deprecated night tariff start
    description: Compatibility-only retired option; it is accepted but ignored.
  timezone:
    name: Time zone
    description: IANA time zone used for scheduling and forecast periods.
  useful_solar_threshold_w:
    name: Useful solar threshold
    description: Forecast PV power in watts considered useful generation.
  battery_capacity_kwh:
    name: Battery capacity
    description: Usable nominal battery capacity used only for morning energy estimates.
  battery_nominal_voltage_v:
    name: Battery nominal voltage
    description: Nominal DC battery voltage used only for morning charging-time estimates.
  battery_grid_charge_current_a:
    name: Grid battery charge current
    description: Legacy option retained for compatibility. Planning uses the dashboard grid DC charging reference; this option no longer supplies a fallback.
  battery_charge_efficiency:
    name: Battery charge efficiency
    description: Conservative conversion factor used for estimated battery recharge energy.
  house_grid_reference_current_a:
    name: House grid reference current
    description: AC current used for rough support-time estimates; this is not a physical limit.
  strong_wind_threshold_ms:
    name: Strong wind threshold
    description: Wind or gust speed in m/s that adds a bad-weather warning.
  weather_humidity_low_percent:
    name: Low forecast humidity
    description: Forecast humidity at or below this percentage adds a weather attention note.
  weather_humidity_high_percent:
    name: High forecast humidity
    description: Forecast humidity at or above this percentage adds a weather attention note.
  weather_humidity_change_percent:
    name: Forecast humidity change
    description: Daily humidity range in percentage points that adds a weather attention note.
  battery_soc_entity:
    name: Battery SOC entity
    description: Home Assistant entity containing actual battery SOC.
  ahm_minimum_soc_entity:
    name: Battery Reserve minimum SOC entity
    description: User-selected minimum Battery Reserve.
  operating_mode_entity:
    name: EnergyHub mode entity
    description: Entity used to summarize the observed night mode.
  yesterday_consumption_entity:
    name: Yesterday consumption entity
    description: EnergyHub completed daily house-consumption snapshot.
  solar_forecast_entity:
    name: Solcast today entity
    description: Solcast entity with today's kWh state and detailedHourly attribute.
  sun_entity:
    name: Sun entity
    description: Home Assistant Sun entity used for today's sunrise and sunset.
  moon_entity:
    name: Moon entity
    description: Moon phase entity; only new moon and full moon are shown.
  daily_grid_import_entity:
    name: Current daily grid import
    description: EnergyHub grid-import estimate that resets at midnight.
  yesterday_grid_import_entity:
    name: Yesterday grid import
    description: EnergyHub completed previous-day grid-import estimate.
  yesterday_night_grid_import_entity:
    name: Yesterday night-tariff import
    description: EnergyHub previous-day grid-import estimate assigned to the configured night tariff.
  yesterday_normal_grid_import_entity:
    name: Yesterday normal-tariff import
    description: EnergyHub previous-day grid-import estimate assigned to the normal tariff.
  yesterday_grid_import_cost_entity:
    name: Yesterday estimated import cost
    description: EnergyHub informational previous-day grid-import cost estimate.
  month_night_grid_import_entity:
    name: Month night-tariff import
    description: EnergyHub current-month import estimate assigned to the configured night tariff.
  month_normal_grid_import_entity:
    name: Month normal-tariff import
    description: EnergyHub current-month import estimate assigned to the normal tariff.
  month_grid_import_entity:
    name: Month total grid import
    description: EnergyHub current-month total grid-import estimate.
  month_grid_import_cost_entity:
    name: Month estimated import cost
    description: EnergyHub informational current-month grid-import cost estimate.
  night_grid_import_price_entity:
    name: Night import price
    description: EnergyHub configured price per kWh for night-tariff import.
  normal_grid_import_price_entity:
    name: Normal import price
    description: EnergyHub configured price per kWh for normal-tariff import.
  grid_voltage_entity:
    name: Grid voltage entity
    description: Inverter AC-input voltage used to detect external-grid loss and recovery.
  grid_confidence_entity:
    name: Grid Reliability entity
    description: EnergyHub reliability classification used for daytime reserve-target notifications.
  grid_available_24h_entity:
    name: Grid available-hours entity
    description: EnergyHub rolling 24-hour available-grid duration used by the morning report.
  grid_outage_24h_entity:
    name: Grid outage-hours entity
    description: EnergyHub rolling 24-hour outage duration used by the morning report.
  telemetry_freshness_entity:
    name: Telemetry freshness entity
    description: EnergyHub freshness state used before describing heat-pump management ownership.
  soc_anomaly_latest_entity:
    name: Latest SOC anomaly entity
    description: EnergyHub diagnostic journal entity used for immediate Ukrainian SOC-jump notifications and the next morning summary.
  peak_load_guard_event_entity:
    name: Peak Load Guard event entity
    description: EnergyHub protection event consumed for confirmed appliance shedding, restoration, and attention messages.
  weather_buffer_entity:
    name: Battery Reserve entity
    description: EnergyHub Battery Reserve policy used for forecast, grid, official weather, and scheduled morning-report context.
  inverter_message_entities:
    name: Inverter message entities
    description: Semicolon-separated EnergyHub recent inverter-message entities used by the morning report.
  environment_sensor_entities:
    name: Environmental sensor registry
    description: Semicolon-separated label, temperature entity, humidity entity, indoor/basement group, optional battery entity, and optional pressure entity records.
  environment_stale_hours:
    name: Sensor stale interval
    description: Hours without a fresh report, or with both temperature and humidity unchanged, before a sensor is reported as suspected stale or offline.
  environment_temperature_deviation_c:
    name: Temperature change threshold
    description: Degrees Celsius from the same-hour previous-day reading that starts a persistent change candidate.
  environment_humidity_deviation_percent:
    name: Humidity change threshold
    description: Percentage points from the same-hour previous-day reading that starts a persistent change candidate.
  environment_persistence_minutes:
    name: Environmental change persistence
    description: Minutes a temperature or humidity change must persist before appearing once in the morning report.
  device_low_battery_percent:
    name: Device low-battery threshold
    description: Battery percentage at or below which a configured household sensor or doorbell is reported.
  doorbell_battery_entity:
    name: Doorbell battery entity
    description: Optional Home Assistant battery entity for the Xiaomi doorbell; leave empty until verified.
  smart_plug_entities:
    name: Smart-plug switches
    description: Semicolon-separated label|switch_entity entries checked for unavailable, unknown, or missing switch state in the morning report.
  heat_pump_active_threshold_w:
    name: Heat-pump active threshold
    description: Minimum observed power in watts above which a heat pump is treated as running for SOC reserve warnings.
  heat_pump_floor_1_power_entity:
    name: First-floor heat-pump power entity
    description: Live power entity used to determine whether the first-floor heat pump is running.
  heat_pump_floor_2_power_entity:
    name: Second-floor heat-pump power entity
    description: Live power entity used to determine whether the second-floor heat pump is running.
  heat_pump_floor_3_power_entity:
    name: Third-floor heat-pump power entity
    description: Live power entity used to determine whether the third-floor heat pump is running.
  heat_pump_floor_1_energy_entity:
    name: First-floor HP energy helper
    description: Cumulative Wh or kWh sensor for yesterday's measured consumption; first-floor energy trust must be enabled after verification.
  heat_pump_floor_2_energy_entity:
    name: Second-floor HP energy helper
    description: Cumulative Wh or kWh sensor for yesterday's measured consumption.
  water_boiler_energy_entity:
    name: Hot-water energy statistic
    description: Recorder daily energy change (kWh), matching the water-boiler chart.
  heat_pump_floor_3_energy_entity:
    name: Third-floor HP energy helper
    description: Defaults to the HA integral of measured smart-plug power; calculated energy is labelled explicitly.
