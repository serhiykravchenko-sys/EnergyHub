configuration:
  bot_token:
    name: Токен Telegram-бота
    description: Секретний токен від BotFather. Не публікуйте та не зберігайте його в Git.
  destination_chat_id:
    name: ID сімейної групи
    description: Від'ємний ID Telegram-групи. Зберігайте справжній ID лише в конфігурації застосунку.
  weather_entity:
    name: Погодна сутність
    description: Значення auto вибере weather.forecast_home або першу доступну сутність; також можна ввести конкретний ID.
  send_time:
    name: Час ранкового повідомлення
    description: Місцевий час щоденного сімейного звіту.
  soc_snapshot_time:
    name: Час фіксації SOC
    description: Місцевий час фіксації фактичного SOC та цілі EnergyHub.
  night_start_time:
    name: Початок нічного тарифу
    description: Початок інтервалу розрахунку нічного імпорту.
  timezone:
    name: Часовий пояс
    description: Часовий пояс IANA для розкладу та прогнозу.
  useful_solar_threshold_w:
    name: Поріг корисної генерації
    description: Прогнозована потужність PV у ватах, яка вважається корисною генерацією.
  strong_wind_threshold_ms:
    name: Поріг сильного вітру
    description: Швидкість вітру або поривів у м/с для попередження про негоду.
  test_mode:
    name: Тестовий режим
    description: Надсилає один попередній перегляд для кожної версії та позначає щоденні звіти як тестові.
  battery_soc_entity:
    name: Сутність SOC батареї
    description: Сутність Home Assistant із фактичним SOC батареї.
  target_soc_entity:
    name: Сутність цільового SOC
    description: Цільовий SOC Adaptive Hybrid від EnergyHub.
  ahm_minimum_soc_entity:
    name: Сутність мінімального SOC AHM
    description: Вибраний користувачем залишковий запас Adaptive Hybrid.
  reserve_advice_entity:
    name: Сутність поради щодо запасу AHM
    description: Стан порадника EnergyHub за трьома завершеними ранками.
  reserve_advice_current_soc_entity:
    name: Поточний SOC порадника AHM
    description: Поточний запас, який оцінює порадник.
  reserve_advice_suggested_soc_entity:
    name: Рекомендований SOC порадника AHM
    description: Інформаційний запас, рекомендований порадником.
  reserve_advice_sample_count_entity:
    name: Кількість ранків для порадника AHM
    description: Порівнювані завершені ранки з поточним запасом.
  operating_mode_entity:
    name: Сутність режиму EnergyHub
    description: Використовується для підсумку нічного режиму.
  yesterday_consumption_entity:
    name: Споживання вчора
    description: Завершений добовий знімок споживання будинку від EnergyHub.
  solar_forecast_entity:
    name: Прогноз Solcast на сьогодні
    description: Сутність Solcast зі станом у kWh та атрибутом detailedHourly.
  sun_entity:
    name: Сутність Сонця
    description: Сутність Sun для часу сходу та заходу сонця сьогодні.
  moon_entity:
    name: Сутність Місяця
    description: Фаза Місяця; у звіті показуються лише молодик і повня.
  daily_grid_import_entity:
    name: Поточний добовий імпорт
    description: Оцінка імпорту EnergyHub, що скидається опівночі.
  yesterday_grid_import_entity:
    name: Імпорт за вчора
    description: Завершена оцінка імпорту EnergyHub за попередній день.
  yesterday_night_grid_import_entity:
    name: Нічний імпорт за вчора
    description: Оцінка імпорту EnergyHub за попередній день у межах налаштованого нічного тарифу.
  yesterday_normal_grid_import_entity:
    name: Звичайний імпорт за вчора
    description: Оцінка імпорту EnergyHub за попередній день за звичайним тарифом.
  yesterday_grid_import_cost_entity:
    name: Оцінка вартості імпорту за вчора
    description: Інформаційна оцінка вартості імпорту EnergyHub за попередній день.
  month_night_grid_import_entity:
    name: Нічний імпорт за місяць
    description: Оцінка імпорту EnergyHub за поточний місяць у межах нічного тарифу.
  month_normal_grid_import_entity:
    name: Звичайний імпорт за місяць
    description: Оцінка імпорту EnergyHub за поточний місяць за звичайним тарифом.
  month_grid_import_entity:
    name: Загальний імпорт за місяць
    description: Загальна оцінка імпорту EnergyHub за поточний місяць.
  month_grid_import_cost_entity:
    name: Оцінка вартості імпорту за місяць
    description: Інформаційна оцінка вартості імпорту EnergyHub за поточний місяць.
  night_grid_import_price_entity:
    name: Ціна нічного імпорту
    description: Налаштована в EnergyHub ціна однієї kWh за нічним тарифом.
  normal_grid_import_price_entity:
    name: Ціна звичайного імпорту
    description: Налаштована в EnergyHub ціна однієї kWh за звичайним тарифом.
  grid_voltage_entity:
    name: Сутність напруги мережі
    description: Вхідна напруга інвертора для визначення зникнення та відновлення зовнішньої мережі.
  grid_confidence_entity:
    name: Сутність Grid Confidence
    description: Оцінка надійності EnergyHub для повідомлень про зміну денної цілі резерву.
  telemetry_freshness_entity:
    name: Сутність свіжості телеметрії
    description: Стан свіжості EnergyHub для визначення, хто керує тепловими насосами.
  inverter_message_entities:
    name: Сутності повідомлень інвертора
    description: Розділені крапкою з комою сутності останніх повідомлень інвертора EnergyHub для ранкового звіту.
  environment_sensor_entities:
    name: Реєстр датчиків середовища
    description: Записи через крапку з комою з назвою, сутностями температури й вологості, групою indoor/basement та необов'язковими сутностями батареї й тиску.
  environment_stale_hours:
    name: Інтервал застарівання датчика
    description: Кількість годин без свіжого звіту або без змін температури й вологості, після якої датчик вважається ймовірно застарілим чи офлайн.
  environment_temperature_deviation_c:
    name: Відхилення температури
    description: Відхилення в градусах Цельсія від медіани в будинку або показника тієї самої години попереднього дня.
  environment_humidity_deviation_percent:
    name: Відхилення вологості
    description: Відхилення у відсоткових пунктах від медіани в будинку або показника тієї самої години попереднього дня.
  environment_persistence_minutes:
    name: Тривалість аномалії середовища
    description: Скільки хвилин незвичні температура або вологість мають тривати до появи в ранковому звіті.
  device_low_battery_percent:
    name: Поріг низького заряду пристрою
    description: Рівень батареї, за якого налаштований домашній датчик або дверний дзвінок потрапляє до звіту.
  doorbell_battery_entity:
    name: Сутність батареї дверного дзвінка
    description: Необов'язкова сутність батареї Xiaomi doorbell; залиште порожньою до перевірки.
  heat_pump_active_threshold_w:
    name: Поріг роботи теплового насоса
    description: Мінімальна потужність у ватах, вище якої тепловий насос вважається працюючим для попереджень про резерв SOC.
  heat_pump_floor_1_power_entity:
    name: Потужність теплового насоса 1-го поверху
    description: Сутність поточної потужності теплового насоса першого поверху.
  heat_pump_floor_2_power_entity:
    name: Потужність теплового насоса 2-го поверху
    description: Сутність поточної потужності теплового насоса другого поверху.
  heat_pump_floor_3_power_entity:
    name: Потужність теплового насоса 3-го поверху
    description: Сутність поточної потужності теплового насоса третього поверху.
